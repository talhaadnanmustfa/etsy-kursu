tail keyword kullanarak bir başlık oluştur.\" Ardından: \"Aralarından seçmem için 20 anahtar kelime ver\" (Ders 3.7'de 13'ünü seçeceksin).\n\n*Yöntem 2 — Rakip başlıkları (Video 2):* Konuyu Etsy'de arat; benzer **üç ilanın** başlığını bir metin dosyasına kopyala; ortak ifadeleri çıkar; sana uymayanları at. Emin'in örneğinde \"bear\" atıldı (tasarımında ayı yok) ve \"PNG, SVG\" atıldı (\"ben tişört satıyorum, dijital dosya satmıyorum\"). Kalanları ChatGPT'ye ver: \"Bu ifadeleri kullanarak bana bir başlık öner; ben bir tişört satıcısıyım; başlık İngilizce olsun.\" Sonra kelime öbekleri arasına virgül koy. (\"Bunları tek seferde yazarsanız uğraşmazsınız\", prompt'u baştan eksiksiz kur.)\n\n**En sık yapılan hata ve sonucu.** Kelime tekrarı (kancaları aynı yeme bağlamak) ve ilk 40 karakteri \"Best Quality Fast Shipping\" gibi görseli tanımlamayan sözlerle harcamak. Sonuç: eşleşme zayıflar, tıklama düşer — ve Ders 3.7'de göreceğin görünürlük cezası kapıyı çalar. *(Videoda: Video 1, 57:14–1:03:57.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 57:14–1:03:57.*\n1. 140 ve 40 sayılarının anlamı ne?\n2. Long tail keyword'ü Toyota örneğiyle anlat.\n3. İki başlık üretim yönteminin adımlarını say. Hangi kelimeler neden atılmıştı?","video":1,"damga":"57:14","sn":3434},{"ders":"3.7","modul":3,"baslik":"Tags: 13 kanca ve \"gift for her\" dersi","metin":"**Videoda:** Video 1, 1:04:26–1:10:41.\n\n**Neden bu ders var?** Çünkü 13 tag hakkının yanlış doldurulması, ilanı sadece işe yaramaz yapmaz — **cezalandırtır.**\n\n**Kurallar.** Bir ilana **13 tag** yazılır. Çapari mantığı burada da geçerlidir: hepsi birbirinden farklı, ama hepsi konuyla ilgili. \"Nurse\" konusunda 13 tag, nurse dünyasının farklı aramalarını yakalamalıdır — \"Mars'taki köpek balıkları\" değil (alakasız), \"nurse nurse tee\" de değil (tekrar).\n\n**\"Gift for her\" deneyi.** Emin'in canlı gösterdiği ders: 13'ü doldurmak için \"gift for her\" gibi genel bir kelime yazarsan ne olur? Ekranda aratıyor: karşına takı, tarak, makas, para hediyesi, mezuniyet hediye kartı, origami, takı kutusu — her şey çıkıyor. \"1 milyoncu gibi.\" Bu aramayı yapan müşteri ne alacağını bilmiyor. Senin tişörtünü aramıyor ki tıklasın. Emin kendisi de müşteri rolünde bir tişört ilanının önünden \"takı kutusu almaya geldiğim için\" tıklamadan geçiyor. İşte o an, ilanın istatistiğine bir gösterim, sıfır tıklama yazıldı.\n\n**Görünürlük cezasının mekanizması.** Etsy'nin hesabı Emin'in ağzından: \"Bu ilanı bu kelimede gösterdim — kimse tıklamadı. Şu kelimede gösterdim. Kimse tıklamadı. Demek ki bu satıcı iyi bir ilan yapamıyor. Ben bunu bir daha göstermem.\" Ve ilanın **visibility**'sini (görünürlüğünü) \"yerin dibine çakar\". Bir daha neredeyse kimseye göstermez. Doğru yol: müşterinin ağzına birebir uyan belirli kelimeler. \"ICU nurse shirt\" yazan biri tam olarak onu arıyordur. Etsy onu doğrudan senin ilanına getirir: \"mavi de hemşirelerin rengi, çok iyi. Tık tık, buldum, sepete.\"\n\n**En sık yapılan hata ve sonucu.** 13'ü \"doldurmuş olmak için\" doldurmak. Genel kelimeler gösterim üretir, tıklama üretmez. Tıklanmayan gösterim ise ilanı bitirir: Etsy o ilanı bir daha neredeyse kimseye göstermez. 10 isabetli tag, 13 gelişigüzel tag'den her zaman iyidir — ama hedef, 13 isabetli tag'dir (20 aday iste, 13 seç). *(Videoda: Video 1, 1:04:26–1:10:41.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 1:04:26–1:10:41.*\n1. \"Gift for her\" deneyinde ekrana neler geldi ve müşteri neden tıklamadı?\n2. Görünürlük cezası mekanizmasını Etsy'nin iç sesiyle anlat.\n3. 13 tag'i nasıl üretirsin? (Ders 3.6'daki 20-aday yöntemiyle bağla.)","video":1,"damga":"1:04:26","sn":3866},{"ders":"3.8","modul":3,"baslik":"Description ve dört parçanın uyumu","metin":"**Videoda:** Video 1, 1:10:52–1:16:47.\n\n**Neden bu ders var?** Çünkü ilanın dördüncü parçası açıklamadır ve Etsy'nin ilanını kime göstereceğine karar verdiği mekanizma, dört parçanın uyumundan beslenir.\n\n**Description'ın iki bölümü.** *Sabit bölüm* bir kez yazılır, her ilana kopyalanır: tişört detayları (marka, %100 pamuk, unisex-oversized kesim), ölçü bilgisi, baskı yöntemi ve **care instructions** (yıkama talimatları: soğuk suda yıka, ters çevirip ütüle). Emin'in incelediği ilanın sabit bölümünde baskı yöntemi DTG yazıyordu — \"biz DTF kullanıyoruz. DTG çok iyi bir print metodu değildir\" notunu düşüyor. *Değişken bölüm* açıklamanın en başındaki paragraftır: **her ilan için farklı**, anlamlı cümlelerle yazılmış, anahtar kelimelerden bazılarını içeren bir tanıtım.\n\nChatGPT'ye yazdırılır: \"Bu ilanın açıklamasının başına müşteriler için 200 karakterlik İngilizce bir paragraf yaz; yukarıdaki anahtar kelimelerden bazılarını kullan.\" 200 dersen kısa yazar. 400 istersen uzatır. Örnek çıktının tadı: \"Yumuşak, rahat, günlük kullanım için — hayatını hasta bakımına adayanlar için düşünceli bir hediye.\"\n\n**Yasak:** başlığı kopyalayıp açıklamaya yapıştırmak. \"Bazı arkadaşlar yapıyor — bu yanlış. Etsy'nin istemediği bir şey.\"\n\n**Uyum mekanizması — Etsy ilanını nasıl değerlendirir?** Emin'in anlatımıyla adım adım: (1) Etsy ilk görselini yapay zekayla tarar. Hem ne sattığını anlamak hem görselin çalıntı olup olmadığına bakmak için. (2) Başlığa, tag'lere, açıklamanın başına bakar. \"Bunu kim satın alır?\" tahmini kurar. (3) İlanı küçük bir gruba gösterir: \"500 kişiye gösterdim, 50'si tıkladı. Çok iyi; demek ki bu hedef kitle bunu alır\" der, kitleyi genişletir; siparişler gelmeye başlar. Bu yüzden görsel, title, tags ve açıklamanın başı **uyumlu ama birebir aynı değil** olmalıdır. Dört parça aynı hedef kitleyi işaret etmeli, ama birbirinin kopyası olmamalıdır. Tek konuya odaklı mağazanın avantajı da buradan gelir: \"Bu mağaza tek hedefli. Amerika'daki yüz binlerce hemşireye direkt gösteriyorum\" (Ders 3.1'in kancası).\n\n**En sık yapılan hata ve sonucu.** Açıklamanın başına başlığı yapıştırmak (uyum değil kopya — Etsy istemiyor) ya da ilk paragrafı hiç yazmamak (Etsy'nin tahmin kurduğu sinyallerden biri boş kalır; test gösterimleri zayıf başlar). *(Videoda: Video 1, 1:10:52–1:16:47.)*\n\n**Gerçek bir öğrenciden.** Test mekanizmasını anlatan bir öğrenci sonunu yanlış bağladı: \"tıklanmazsa Etsy ilanı **kapatır**\" dedi. Hayır — Etsy tıklanmayan ilanı kapatmaz. **Göstermeyi azaltır.** İlan yayında kalır ama görünmez olur. Kapatma bambaşka bir dünyanın işidir: kural ihlali (trademark, yasak ürün). Bu ayrım önemlidir, çünkü iki durumun tedavisi farklıdır: görünmeyen ilan iyileştirilir ya da yenilenir (Ders 3.11, Ders 4.3); kapatılan ilan için protokol vardır (Ders 5.7). *(Videodaki yeri: Video 1, 1:14:31–1:14:40.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 1:10:52–1:16:47.*\n1. Sabit bölümde neler durur? Care instructions ne demek?\n2. 500/50 testini anlat: Etsy neyi ölçüyor, sonuca göre ne yapıyor? Tıklanmayan ilana ne olur — kapanır mı?\n3. \"Uyumlu ama aynı değil\" ilkesini dört parça üzerinden bir örnekle göster.","video":1,"damga":"1:10:52","sn":4252},{"ders":"3.9","modul":3,"baslik":"ED klasör sistemi ve 50 klasör hedefi","metin":"**Videoda:** Video 2, 1:04:56–1:14:08.\n\n**Neden bu ders var?** Çünkü ilan üretimi dağınıklık kaldırmaz: sipariş geldiğinde doğru tasarımı otuz saniyede bulamıyorsan, sistem yok demektir. Kursun sistemi ED klasörleridir.\n\n**Sistem.** Her ilanın bir kodu olur: **mağaza adının baş harfleri + sıra numarası.** Emin'in örneği \"Demir Store\" → **ED001, ED002, ED003…** Her kod bir klasördür ve içinde şunlar durur:\n\n1. **3-5 mockup** — farklı renklerde (Pepper, Ivory, Heather Mauve gibi), ilk görsel mankenli. Artı size chart ve color chart görselleriyle ilan 8-10 görsele tamamlanır (Ders 3.5).\n2. Tasarımın **beyaz ve siyah şeffaf sürümleri** — \"ED001-siyah\", \"ED001-beyaz\" adlarıyla. Varsa SVG de (\"ED002.svg\").\n3. **\"Ürün başlığı\" metin dosyası** — title, 13 tag ve açıklama metni.\n\nBu kod, ilanı yayınlarken **SKU** alanına yazılır (Modül 4'te göreceksin) — sipariş geldiğinde SKU'ya bakar, klasörü açar, doğru tasarımı saniyede bulursun.\n\n**Hedef.** Emin'in çıtası: **mağaza açılmadan önce en az 50 klasör hazır** — ED001'den ED050'ye; tasarımlar, mockup'lar, başlıklar, tag'ler, açıklamalar tamam. \"Mağazayı açtığımızda tıkır tıkır listingleri gireceğiz.\" AVM kuralının ilan versiyonu: kartvizit açılıştan önce basılır. *(Bu hedefin Modül 1'deki \"günde 2-5 ilan\" temposuyla nasıl birleşeceği (50 hazır ilan hangi hızla yayınlanacak) videolarda net bağlanmıyor; Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın ve eğitmenine sor.)*\n\n**Emin'in ekranda kurduğu üç klasör.** ED001: baseball temalı tasarım — üç mockup + beyaz-siyah sürümler + başlık dosyası. ED002: SVG'li bir tasarım. SVG saklandı çünkü müşterinin istediği renge göre sürüm üretilecek. ED003: Canva'da üretilen mockup'larla aynı düzen. Her klasörde isimlendirme \"düpdüzgün\": kodu gören, içindekini bilir.\n\n**En sık yapılan hata ve sonucu.** Masaüstünde \"yeni klasör (7)\" düzeni: tasarımlar bir yerde, başlıklar başka yerde. Sonuç ilk siparişte patlar — müşteri beklerken sen dosya arıyorsundur. Yanlış sürümü (siyah tişörte siyah tasarım) baskıya göndermek de bu dağınıklığın çocuğudur. *(Videoda: Video 2, 1:04:56–1:14:08.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 1:04:56–1:14:08.*\n1. ED001 klasörünün üç içerik kalemini ve kodun SKU ile ilişkisini söyle.\n2. 50 klasör hedefi neyi garanti eder. Hangi sorusu eğitmene kalır?\n3. Tasarımın beyaz-siyah sürümleri neden klasörde bekler?","video":2,"damga":"1:04:56","sn":3896},{"ders":"3.10","modul":3,"baslik":"Konu bütünlüğü: tasarım, renk ve manken birbirini tutmalı","metin":"**Videoda:** Video 3, 0:15–10:06.\n\n**Neden bu ders var?** Video 3, öğrencilerin mockup ödevlerinin tek tek değerlendirilmesiyle açılıyor — ve bütün yorumlar tek kurala çıkıyor: **tasarımın konusu, tişörtün rengi ve mankenin ortamı birbirini tutacak.** Emin buna **konu bütünlüğü** diyor. Bu ders, o değerlendirme oturumunun damıtılmış halidir.\n\n**Kural ve yöntem.** Mockup seçimi zevk işi değil, araştırma işidir: tasarımdaki yazıyı Etsy'de arat, **satanların hangi rengi ve mankeni kullandığına bak.** \"Direkt ben bunu mockup'larla çat çat eşleştireyim, hemen publish edeyim — olmaz.\"\n\n**Emin'in değerlendirme notları — vaka vaka:**\n\n- **Turtle (kaplumbağa) tasarımı:** satanlara bak — açık mavi ve military green tişörtler, deniz kenarı mockup'ları. Konu deniz. Ortam deniz olacak. (Bir satıcı rengi \"C foam\" diye yazmış, Comfort Colors'ın seafoam rengi; renk adlarını tanımaya başla.)\n- **Kitap severler tasarımı:** \"Bugüne kadarki bütün tecrübem: kitapseverler ya dark grey, ya heather, ya siyah, ya forest green, ya military green alıyor — çoğunlukla forest green. **Beyaz tişört almıyorlar.** Birinci görsel forest green olmalı.\"\n- **\"Sorry boys\" tasarımı:** beyaz sweatshirt üstünde beyaz yazı — \"görünmüyor. Müşteri ne aldığını göremeyecek. Yazının rengi değişecek.\" Aynı şekilde açık tişört üstünde altın sarısı yazı da kaybolur. Siyah üstünde kahverengi gemi de.\n- **\"Forget the bunnies, chasing honeys\" (Easter tasarımı):** Etsy'de arat — satanlar hep **çocuk tulumu ve çocuk tişörtü** mockup'ında. \"Bu tişörtü çocuk için alıyorlar. Sahildeki kadının hoodie'sinin arkasına koyarsan albenisi olmaz.\"\n- **Valentine's Day + yeşil tişört:** \"Sevgililer Günü, yeşil tişörtün satıldığı bir dönem değil.\" Renk, sezonla da uyumlu olacak.\n- **Raven (karga) tasarımı:** yerleşim düzeltmesi canlı yapılıyor — \"yukarı, yukarı… o çok oldu, biraz aşağı; omuzlara yaklaşsın. Süper oldu.\" Ve bir pazar notu: kargalı-iskeletli koyu tasarımlar erkeklere gider; orada siyah uygundur.\n- **Kansas City yazılı lacivert sweatshirt:** \"Güzel.\" — İyi örnek de tescillenir: doğru konu, doğru renk, doğru ürün.\n- **Önlü arkalı tasarımlar (Velaris; \"Not Today\"):** Etsy'de örneklerine bak — Velaris tasarımının uzun parçası **sırta, aşağıdan yukarıya**; öne ayrı küçük tasarım. \"Not Today\"de yazı öne büyük, iskelet-surat arkaya. Öğrenci ikisini de öne, üstelik erkek mockup'ının göğsüne koymuş: \"Müşteri bunu görünce 'bu ne ya?' der. Ayrıca bu tasarım beyaz olmalı, sırtta olmalı ve kadın mockup'ında olmalı.\" Genel kural: **erkek mockup'ını neredeyse hiç kullanmıyoruz. Yüzde bir.**\n- **Gulf of Mexico tasarımı + kışlık mockup:** arka planda kar, adamda bere — önde körfez-deniz konulu protesto tasarımı. \"Uyumsuz. Kullanılamaz.\" (Aynı tasarım, deniz kenarı mockup'ıyla pekala olurdu, Ders 3.2'deki konu.)\n\n**Kırmızı çizgi: yetişkin içerik çocuk ürününe konmaz.** Sassenach/Outlander bir **yetişkin dizisidir**. Tasarımını çocuk tişörtüne koymak yalnızca satmaz — **Etsy politikası ihlalidir.** Emin ikinci bir örnek de veriyor: yetişkinlere yönelik temalı bir tasarımı çocuk tişörtü mockup'ına koyup listeleyen bir satıcının ilanını Etsy kapattı: \"Bu yetişkin içerikli bir ürün. Çocuklara yönelik koyamazsın.\"\n\n**Bakmak ve görmek.** Emin'in kapanışı: \"Sizin bakıp göremediğiniz şeyleri ben görüyorum, çünkü yıllardır müşterinin ne aldığını, ne yorumladığını okuyorum. Sen de mockup yaptıkça, mağaza ve yorum okudukça aynı göze sahip olacaksın.\" Ve öğrenme yöntemi: ekranını paylaşıp yorum alan öğrenci \"1-0 önde\" — soru sor, göster, düzelt.\n\n**En sık yapılan hata ve sonucu.** Tasarımları eldeki mockup'larla mekanik eşleştirmek. Sonuç: kitap tasarımı beyaz tişörtte, çocuk tasarımı yetişkin hoodie'sinde — müşteri eşleşmez, Etsy'nin kitle tahmini şaşar; yetişkin-çocuk çizgisinde ise iş ihlale kadar gider. *(Videoda: Video 3, 0:15–10:06.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 0:15–10:06.*\n1. Konu bütünlüğünün üç ayağı ne? Doğru mockup nasıl bulunur?\n2. Kitap severlerin renk paleti ne. İlk görsel hangi renk olmalı?\n3. Önlü arkalı tasarım nasıl yerleştirilir. Erkek mockup kuralı ne?\n4. Hangi eşleştirme politika ihlaline kadar gider?","video":3,"damga":"0:15","sn":15},{"ders":"3.11","modul":3,"baslik":"Tutturmak ısrar ister: aynı konuyu tekrar tekrar açmak","metin":"**Videoda:** Video 5, 16:41–19:47.\n\n**Neden bu ders var?** Çünkü yeni satıcı bir konuyu \"bir kere denedim, olmadı\" diye kapatır. Kursun ustaları ise tutan konunun etrafında döner dururlar.\n\n**Mantık.** Bir ilanı \"tutturmak\" tek seferlik iş değildir. İyi bir konu — reklamı kapatılmış olsa bile, ilk denemesi sönük geçse bile: **rengi, fontu, ilk görseli veya başlığı değiştirilerek yeni bir ilan olarak yeniden açılır**. Bir-iki gün sonra bir varyasyon daha. \"Custom\" kelimesi \"personalized\" olur. Siyah hoodie forest green olur. Pepper mockup Ivory olur. Örnek isimler değişir. Neden işe yarar? Çünkü \"bazı insanın gözüne küçük yazı fontu hoş görünür, bazısının gözüne tamamen beyaz yazı\". Aynı konsept, farklı sunumlarla farklı müşterileri yakalar.\n\n**Emin'in kanıtı.** Ekranda 200.000 satışlı, 4.800 ilanlık mağazayı açıyor. \"Pro Choice Women's Rights\" başlığını kopyalayıp mağaza içinde aratıyor: aynı başlıkla-benzer başlıkla onlarca ilan — pro choice, pro love, pro science, pro woman; ilk dört ilan aynı tasarımın font varyasyonları; kadın hakları konseptinde kimi tasarım dikdörtgen içinde, kimi düz. \"Adam bir ilan açıp bırakmıyor. Bu konu satıyor. Biliyor ve etrafında ısrar ediyor.\" Bizdeki karşılığı: \"custom mama shirt\" gibi her mağazada olması gereken meşhur bir konu ilk açılışta tutmadıysa, Tyler-Kelly örnek isimleri Hasan-Mehmet olur, Pepper Ivory olur, başlık \"personalized mama shirt\" olur. Yeniden açılır.\n\n**En sık yapılan hata ve sonucu.** İki uç: tutmayan konuyu tek denemeyle gömmek (belki konu değil sunum tutmamıştı) ve aynı ilanı hiçbir şey değiştirmeden arka arkaya kopyalamak (o, varyasyon değil çöp çoğaltmadır — Ders 3.5'teki görsel imzası kuralını da hatırla: birebir aynı görselle çoğaltma yapma). *(Videoda: Video 5, 16:41–19:47.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 16:41–19:47.*\n1. \"Tutturmak ısrar ister\" ne demek — hangi dört şey değiştirilerek yeniden açılır?\n2. Pro choice mağazası örneğinden çıkan ders ne?\n3. Varyasyon ile kopya arasındaki çizgi nerede?","video":5,"damga":"16:41","sn":1001},{"ders":"4.1","modul":4,"baslik":"Shop Manager turu","metin":"*Başvuru dersi — Shop Manager'ı ilk açtığın gün, ekranla birlikte gez. Bugün okuman gerekmez.*\n\n**Videoda:** Video 3, 12:15–17:54.\n\n**Neden bu ders var?** Panel senin dükkanının arka odasıdır. Hangi çekmecede ne olduğunu bilmeden dükkan yönetilmez. Bir uyarıyla başlayalım — Emin'in uyarısı: Etsy paneli ara ara günceller; \"sizin ekranınızda bir buton başka yerde olabilir, bir rakam daha görünür olabilir. Ufak tefek değişikliklerdir, şaşırmayın.\" Ekran değişir, mantık değişmez.\n\n**Ekranlar.**\n\n- **Search:** panel içi arama — bir ayarı, bir başlığı, \"help\"i ararsın.\n- **Dashboard:** genel durum. Üstte **views** (görüntülenme), **visits** (ziyaret), **orders**, **revenue** (gelir). Günlük-haftalık-aylık seçilir. Emin'in örnek ekranı: 3.200 views, 1.200 visit, 78 order. **Recent activity** sekmesi son hareketleri sayar: \"15 dakika önce şu ilan favoriye alındı, 19 dakika önce şu…\" — mağazanın nabzıdır. Kapatılmış bir mağazada bu ekranın üstünde kırmızıyla **\"permanently suspended\"** (kalıcı olarak askıya alındı) ve itiraz bağlantısı görünür. Emin kendi kapanmış mağazasından gösteriyor. Gerekçe satırı da ibretlik: \"customer service standartlarına uymadığı için.\"\n- **Shop Advisor:** Etsy'nin tavsiye ve bildirimleri — \"50.000. siparişin kutlu olsun\"dan \"şu makaleyi oku\"ya, \"kupa satıcıları için toplantı var, katıl\"a kadar. Kural: **panele düşen her bildirime tıkla**, çevir, oku, yapılacaksa yap, toplantıysa katıl. Sebebi mekaniktir: Etsy tıklamalarını kaydeder. İlgi gösteren, etkileşimi yüksek mağazalar Etsy'nin gözünde daha iyi gider. \"Ben Etsy olsam, ilgilenen kişilerle iş yaparım.\"\n- **Settings / Help / Apps / Finances:** çoğu bir kez ayarlanır — banka ve vergi bilgisi, mağaza logosu-başlığı-announcement (Settings > Info and appearance), Etsy'yle e-posta iletişimi (Help). **Apps** bölümünde Etsy'yle entegre üçüncü taraf uygulamalar durur: eRank, Everbee, Printify gibi (aylık ~10-12 dolar; başlangıçta gereksiz, Ders 3.2) ve üreticinin entegrasyon uygulaması: mağazana **connected** olur, kargo etiketleri o sistem üzerinden alınır.\n\n**En sık yapılan hata ve sonucu.** Bildirimleri okumadan çarpı ile kapatmak. Görünürde zararsızdır. Gerçekte Etsy'ye \"ilgisiz mağaza\" sinyali birikir — ve arada gerçekten yapman gereken bir düzeltme (Ders 4.2'deki görünürlük uyarıları gibi) gözden kaçar. *(Videoda: Video 3, 12:15–17:54.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 12:15–17:54.*\n1. Dashboard'daki dört sayıyı ve recent activity'nin ne gösterdiğini söyle.\n2. Shop Advisor bildirimleri neden tıklanır — mekanizması ne?\n3. Apps bölümünde bizim için kritik olan bağlantı hangisi?","video":3,"damga":"12:15","sn":735},{"ders":"4.2","modul":4,"baslik":"Listings sayfası ve görünürlük uyarıları","metin":"*Başvuru dersi — haftalık görünürlük rutinine başlarken aç.*\n\n**Videoda:** Video 3, 17:54–19:13; görünürlük uyarıları: Video 4, 36:08–38:34.\n\n**Neden bu ders var?** İlanlarının tamamı bu sayfada yaşar. Günlük işinin önemli kısmı burada geçer.\n\n**Araçlar.**\n\n- **Stats düğmesi:** her ilanın altında ziyaret-satış sayısını açar (\"bu ilan 1.720 kez ziyaret edilmiş, 300 satmış\").\n- **Quick edit:** ilan listesini yatay görünüme çevirir ve **dört şeyi** hızla düzenletir: title, section, shipping profile, tags. Emin'in buradan çıkardığı ders kalıcıdır: \"Etsy buraya bu düğmeyi koyduysa, bunu kullanmanı istiyor demektir — başlıkta, tag'lerde ara sıra küçük düzeltmeler yapman bekleniyor. Description için quick edit yok. Demek ki açıklamayı hızlı hızlı değiştirmen beklenmiyor.\" (Bu içgörü Ders 4.3'teki renew stratejisinin yarısıdır.)\n- **Filtreler:** Active, Expired, Sold out, Inactive, Featured. Emin'in ekranındaki örnek dağılım: 901 aktif, 242 expired, 1 sold out, 681 inactive. **Sold out**: stok biterse — biz stok 999 girdiğimiz için bizde görülmez. Sınırlı üretim yapan 3 girer, 3'ü satılınca biter. **Featured listings**: mağaza vitrininde öne sabitlediğin ilanlar. **Inactive**: senin kapattıkların + Etsy'nin kapattıkları (Etsy kapattıysa gerekçesi e-postayla gelir, Glock vakası Modül 5'te).\n- **Section filtresi ve kelime araması:** belirli bir bölümün ilanlarını ya da belirli bir kelimeyi geçen ilanları süzer. Emin'in kullanım örneği hayati: \"Bir kelime aniden trademark olursa — 'bu kelime hangi ilanlarımda geçiyor?' diye burada süzüp hemen kapatırım.\" (Modül 5'te bu refleks protokole dönüşecek.)\n\n**Etsy search visibility — mağazana özel uyarılar.** Panelin görece yeni bölümü. Etsy sana liste halinde iş çıkarır. Emin'in ekranındaki üç uyarı: (1) **35 ilanda ilk görsel kolaj** (dörtlü-ikili birleşik görsel). Değiştir. Sebep yine Offsite Ads: Facebook-Instagram-Google kolajlı görseli reklama kabul etmiyor. Emin dürüst konuşuyor: \"Biz de kullanıyoruz. Müşteri iki rengi yan yana görsün diye; Etsy içi satışta problem görmüyorum. Ama mümkünse kaçının.\"\n\n*(Yeni mağaza için hangisi geçerli — Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)* (2) **8 ilanın ilk görseli düşük çözünürlüklü**: 30-50 KB'lık görsel \"kalitesiz\" sayılır. Mockup 2000 piksel üzeri, 3-4 MB civarı, 10 MB altı olmalı. (3) **2 ilanda fotoğraf/video eksik**. Video için pratik çözüm: bir şablon video hazırlayıp bütün ilanlara koyabilirsin. Bu uyarıları **haftada bir** açıp kapatmak senin rutinindir.\n\n**En sık yapılan hata ve sonucu.** Görünürlük uyarılarını hiç açmamak. Etsy sana \"şu 43 ilanda sorun var\" diye liste vermişken bakmamak, ücretsiz danışmanlığı çöpe atmaktır — ve kolajlı/düşük çözünürlüklü ilanlar dış reklam trafiğinden sessizce dışlanır. *(Videoda: Video 3, 17:54–19:13.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 17:54–19:13.*\n1. Quick edit hangi dört alanı düzenletir ve description'ın yokluğundan hangi ders çıkar?\n2. Beş ilan durumunu (Active…Featured) birer cümleyle açıkla.\n3. Ekrandaki üç görünürlük uyarısı neydi ve kolajın sakıncası nereden geliyor?","video":3,"damga":"17:54","sn":1074},{"ders":"4.3","modul":4,"baslik":"Listing'in ömrü: 0,20 dolar, üç ay, expired ve renew stratejisi","metin":"**Videoda:** Video 3, 20:55–25:39; renew stratejisi: Video 3, 57:43–1:03:23.\n\n**Neden bu ders var?** Her ilanın bir ömür döngüsü vardır ve bu döngünün iki kararı (\"yenileyeyim mi?\" ve \"ne zaman yenileyeyim?\") parayla ölçülür.\n\n**Temel mekanik.** Bir ilanı yayınladığında Etsy **0,20 dolar listing fee** keser ve ilan **3 ay** yayında kalır. Üç ayın sonunda: ya 0,20 dolar daha verir yenilersin ya da ilan **expired**'a (süresi dolmuş) düşer. Bir de kendiliğinden işleyen kural: **her satışta ilan otomatik yenilenir ve 0,20 dolar yeniden kesilir** — \"aslında her order'da Etsy'ye bu yayın ücretini veriyorsunuz.\" (Sınıf sorusuna cevap: süre sabittir, 17 Nisan'da expired olan ilan, üç ay önce 17 Ocak'ta yayınlanmıştır.)\n\n**Auto renew kapatılır.** Otomatik yenilemede Etsy sormaz: satmayan ilan için üç ayda bir 0,20 dolar keser, sonsuza kadar. Kurs tavsiyesi: **bütün ilanlar manuel renew'de kalsın** — üç ayda satmayan ilan expired'a düşsün, kararı sen ver. Bin ilanlık bir mağazada boşa yenileme yılda 50-100 dolar eder.\n\n**Expired kararı — sezona göre.** Emin ekrandan iki örnek veriyor. \"Everyone Loves an Irish Girl\": 24 Ocak'ta açılmış, satmamış, 24 Nisan'da expired olmuş. Karar: \"Şu an St. Patrick's tasarımı. Önümüzdeki üç ay da satmaz. Yenilemem. Ta seneye Ocak'ta yeniden açarım.\" İkincisi \"Race Day\": 23 Ocak'tan beri satmamış ama ilkbahar geldi, yarış sezonu (araba, moto, kaykay) açıldı. \"hâlâ satma ihtimali var; bunu renew edip yayına alırım.\" Kural: **expired listesi ayda bir açılır. Sezonu gelen yenilenir, sezonu geçmiş bırakılır.**\n\n**Renew'ün ikinci kullanımı: vitrin yenilemek.** Aktif bir ilanı neden 0,20 dolar verip yenileyesin? Emin'in mantık yürütmesi yine düğmeden başlıyor: \"Etsy aktif ilana renew düğmesi koyduysa (expired olmayan, kapatılmış olmayan ilana) demek ki bazen yapmanı istiyor.\" Benzetmesi AVM'den: dükkanın vitrinindeki askılı ürünleri görevliler ara ara indirir, ütüler, farklı renkle değiştirir, yeniden asar. Renew, Etsy'ye \"vitrinimi yeniledim. Bu ilanı yeniden göstermeyi düşün\" demektir.\n\n**Doğru kullanım — üç adım:**\n\n1. **Önce küçük bir değişiklik yap** (quick edit'in varlık sebebi): başlıkta \"custom\" yerine \"personalized\"; tag'lerde bir-iki kelime; ilk görselde siyah hoodie yerine forest green. Kaydet.\n2. **Prime time'dan yarım saat önce renew'e bas.** Prime time = mağazanın en çok ziyaret aldığı saatler. Bulmak için: Dashboard > view all > **Stats**; dünü ya da belirli bir günü seç; saatlik ziyaret grafiğine bak. Emin'in mağazasında pik akşam 8 (Amerika saati) ve sabah 9-10. \"23 Nisan'a baktım — yine 8 pm.\" O saatten yarım saat önce renew.\n3. **Cevabı ölç.** Okumayı öğren: her satış zaten bir renew sayılır. **Renew sayısı satış sayısından fazlaysa ilan elle yenilenmiş demektir.** İyi senaryo: renew → ziyaret 5, tekrar renew → 10, tekrar → 15… \"üçüncü-dördüncü renew'den sonra sipariş bekliyoruz.\" Kötü senaryo Emin'in ekranından: 1 satış, buna karşılık 7 renew, ama ziyaret 8'de saymış — \"ilan renew'e cevap vermiyor. Boşuna 0,20 dolar verme, bırak.\" Yeni yayınlanmış bir ilana da (0 satış, 3-4 ziyaret) bir-iki gün içinde bir kez renew yapılabilir, tanıtım dürtmesi. Ama ölçüt hep aynıdır: cevap veren devam eder, vermeyen bırakılır.\n\n**En sık yapılan hata ve sonucu.** Auto renew'ü açık unutmak (sessiz para sızıntısı), expired listesine hiç bakmamak (sezonu gelen ilanlar yatar) ve en pahalısı: değişiklik yapmadan, rastgele saatte, cevap ölçmeden ısrarla renew basmak — \"mama rock\" ilanı gibi: 7 kez yenilenmiş, tepki yok. *(Videoda: Video 3, 20:55–25:39.)*\n\n**Gerçek bir öğrenciden.** Videoyu izleyen bir öğrenci renew saatini \"**akşam 8'de yapılır**\" diye ezberlemişti. Oysa 8, videodaki mağazanın kendi pik saatiydi — Emin o rakamı kural olarak vermez, Stats ekranından **bulup** gösterir. Kural saat değil, yöntemdir: kendi mağazanın en çok ziyaret aldığı saati Stats'tan bul, ondan yarım saat önce renew yap. Her mağazanın pik saati farklıdır. Komşunun saatiyle vitrin yenilenmez. *(Videodaki yeri: Video 3, 1:00:36–1:01:36.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 20:55–25:39.*\n1. 0,20 doların üç kesilme anını say: yayınlama, üç aylık yenileme, satış.\n2. İki expired örneğinde karar neden farklıydı?\n3. Renew'ün üç adımını ve \"cevap veriyor/vermiyor\" ölçütünü rakamla anlat.\n4. \"Renew akşam 8'de yapılır\" cümlesinin nesi yanlış? Doğru cümleyi kur.","video":3,"damga":"20:55","sn":1255},{"ders":"4.4","modul":4,"baslik":"Bulk edit: kırk ilanı bir hamlede düzenlemek","metin":"*Başvuru dersi — ilk toplu düzenleme ihtiyacında aç.*\n\n**Videoda:** Video 3, 31:40–36:34.\n\n**Neden bu ders var?** Mağaza büyüdükçe düzeltmeler teker teker yapılamaz. Etsy'nin toplu düzenleme araçları tam bunun içindir — biri hariç: fiyat.\n\n**Nasıl yapılır.** Listings sayfasında ilanları tik işaretiyle seçersin (filtre sonuçlarını topluca da seçebilirsin — \"Trump kelimesi geçen 16 ilan\" gibi). Üst menüden **Activate / Deactivate / Delete** (kalıcı siler, dikkat) ve **Renew** uygulanır. Asıl güç **Edit options** menüsündedir. Emin hepsini ekranda \"Emin\" kelimesiyle deneyerek gösteriyor:\n\n- **Edit titles:** seçili ilanların başlığının **başına** ya da **sonuna** kelime ekle (\"hepsine 'Emin ' ekle\" — boşluğu unutma); bir kelimeyi başka kelimeyle **değiştir** (\"shirt'leri 'Emin' yap\", hepsinde birden değişir); bir kelimeyi **sil**; **reset title** (başlığı komple silip yenisini yaz).\n- **Tag'ler:** toplu **ekle** — ama 13 dolu olan ilana eklemez; toplu **sil**. Emin'in senaryosu: \"Throne of Glass trademark oldu. Acilen bu tag'i silin\" deyip tek hamlede temizlemek.\n- **Description:** başına/sonuna metin ekle; **find & replace** (bul-değiştir); reset.\n- **Fiyat:** toplu artır/azalt — dolar olarak (increase by amount: +5 dolar bütün varyantlara) ya da yüzde olarak (+%10: 18 dolarlık varyanta 1,80 ekler). **\"Bunu öğrenmiş olun ama asla ve asla kullanmayın\"**, sebebi bir sonraki derste.\n- **Kişiselleştirme:** toplu aç/kapat, metnini toplu değiştir (\"Please add a note for the design color you want\" metnini 40 ilana bir hamlede yazarsın).\n- **Production partner:** toplu ata.\n- **Renewal options:** toplu **manuel** yap (açılış günü ilk işlerden — Ders 4.3).\n- **Shipping profile, return & exchange policy, section:** toplu değiştir.\n\n**En sık yapılan hata ve sonucu.** İki hata: toplu işlemi önce iki-üç ilanda denemeden 400 ilana basmak (toplu düzenleme geri alınamaz; yanlış \"replace\" bütün kataloğu bozar) ve fiyat aracını \"pratikmiş\" diye kullanmak — bir sonraki dersin kuralını çiğnemek. *(Videoda: Video 3, 31:40–36:34.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 31:40–36:34.*\n1. Tag toplu ekleme hangi durumda işlemez?\n2. \"Throne of Glass\" senaryosunda hangi araçlar sırayla kullanılır? (İpucu: önce bul, sonra sil.)\n3. Hangi toplu araç öğrenilir ama asla kullanılmaz?","video":3,"damga":"31:40","sn":1900},{"ders":"4.5","modul":4,"baslik":"Fiyat bir kez girilir: kupon mantığı ve fishing price","metin":"**Videoda:** Video 3, 36:44–45:50.\n\n**Neden bu ders var?** Çünkü fiyat, kursun \"bir kez yap, bir daha dokunma\" dediği tek alandır — ve müşterinin gördüğü bütün indirimler başka bir mekanizmayla, kuponla yönetilir.\n\n**Kural.** İlk bir-iki örnek ilanda varyant fiyatlarını girersin — **ve bir daha asla değiştirmezsin.** Emin: \"Fiyat değişikliği mağazanızı çok kötü etkiliyor.\" Müşteriye yansıyan fiyat kuponla oynanır: tişörte baştan 100 dolar yazarsın, \"%70 indirim. Koşun!\" dersin, müşteri 30 dolara alır. İndirimi %80'e çıkardın (20 dolar), zarar etmeye başladın. Fiyata dokunmazsın. **Kuponu %70'e geri çekersin**, satış 30 dolara döner. Mağazalar bunu hep böyle yapar: etiketteki rakam sabit, üstündeki indirim oynak.\n\n**Sınıftan kritik soru: \"Mağazamda %50 indirim açsam Etsy beni öne çıkarır mı?\"** Emin'in cevabı kesin: **Hayır.** \"Üç ay %50 yapın, sonra %80'e çıkarın — görünürlüğünüzü hiç etkilemez.\" İndirimin dokunduğu iki yer vardır: mağazanı **takip edenlere** bildirim gider (5.000 takipçin varsa onlara) ve Etsy uygulamasının bildirimler ekranında kupon olarak görünür (\"%20 thank you kuponu geldi\" gibi). O kadar. \"Velaris tişörtünü bedavaya da koysanız üst sıraya gelmezsiniz.\" Sıralamayı ne belirler? Modül 3'te kurduğun uyum, indirim değil. Etsy fiyata da bakmaz: \"Tişörtün olağan fiyat aralığında kaldığın sürece fiyat önemli değil.\"\n\n**Fishing price.** Arama listesinde 7,70 dolarlık tişörtler görürsün — gerçekte o fiyata satılmazlar. Mekanizma: bir ilanda yüzlerce **varyant** vardır (beden × renk kombinasyonları; Emin'in açtığı manage variations ekranında 392 satır) ve **Etsy listede en düşük varyantın fiyatını gösterir.** Satıcı, en az satan varyantı (2 yaş çocuk bedeni, kırmızı) 18 dolar girer; mağazadaki %50 kuponla listede **9 dolar** görünür. Müşteri tıklar, yetişkin 2X seçer: 16,80. Kargoyla 22-23 dolar. Emin buna **fishing price** diyor: oltanın ucundaki güzel kokulu yem.\n\nSınırları da net çiziyor: **9-10 doların altına inme.** Listede 3-4 dolar göstermek \"abartmaktır\" ve müşteriyi gerçekten kızdırır. Kademeli aralık kur: çocuk bedenleri 9, ara bedenler 12-15, small 18-19, büyük bedenler 21-23. İtiraz eden müşteriye açıklama hazır: \"Her ürünün tedarik maliyeti farklı — bebek tulumuyla 3X tişört aynı fiyata olur mu?\" Müşteriler bunu anlayışla karşılıyor. Dev mağaza örneği ekranda: 200.000 satışlı, 55.000 yorumlu mağaza listede 6,50 gösteriyor. O fiyat yalnızca toddler beyazın; gerisi 12-16 dolar.\n\nBir de kalite algısı notu: çok ucuz 3X tişört müşteriye \"Walmart'taki 1 dolarlık tişört mü?\" sorusunu sordurur. Günübirlik giyimde (Disneyland'e girerken — \"Disneyciler ucuzcudur\"; 6 kişilik aile 180-200 dolar vermek istemez) ucuz aranır. Uzun vadeli giyimde müşteri markayı bilir ve sorar: Comfort Colors mı, Bella Canvas mı, Gildan mı?\n\n**Varyantlar nasıl girilir?** 392 satırı elle doldurmazsın: **quantity** (stok) hepsinde **999** (Emin'in ekranında 44 girilmiş — hata örneği); fiyatlar kademeli ve bir kez. \"Bu kısımda çok vakit kaybetmeyin. İlk ilanı beraber ya da bilen biriyle kurun.\" Toplu girişte GetVela gibi aracı programlar da var (adını bil, detayına şimdi girme).\n\n**En sık yapılan hata ve sonucu.** Satış düşünce fiyat düşürmek (mağazayı \"çok kötü etkileyen\" hareket — doğrusu kupon), fishing price'ı 3-4 dolara çekmek (öfkeli müşteri, güven kaybı) ve stok alanına gerçek rakam girmek (44'te \"sold out\" sürprizi). *(Videoda: Video 3, 36:51.)*\n\n**Gerçek bir öğrenciden.** Sözlü kontrolde \"fiyatla ilgili en net kural neydi?\" sorusuna öğrenci, ucuz-pahalı tişört algısını anlattı — bildiği doğruydu ama sorulan o değildi: **\"fiyat bir kez girilir, bir daha dokunulmaz\"** kuralı aklında hiç yer etmemişti; indirimin kuponla yapıldığını da ancak ipucuyla hatırladı. Bu dersin iskeleti üç cümledir, üçünü ezbere bil: fiyat bir kez girilir; indirim kuponla yönetilir; listede görünen fiyat fishing price'tır. Buna karşılık fishing'in sınırını aynı öğrenci kendi gerekçesiyle doğru buldu: \"abartırsan müşteriyi korkutursun.\" Aynen öyle. 3-4 dolar gösterip sepette 22 dolar çıkarmak tıklamayı artırır ama müşteriyi kandırılmış hissettirir; satış düşer, Etsy bunu görür. *(Videodaki yeri: fiyat kuralı Video 3, 36:51; abartı sınırı Video 3, 42:59–43:14.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 36:44–45:50.*\n1. %80 zarar ettiriyorsa ne yaparsın — fiyat mı, kupon mu, hangi yöne?\n2. İndirim neyi etkiler, neyi etkilemez? İki cümleyle.\n3. Fishing price mekanizmasını 18 dolar + %50 kupon örneğiyle anlat. Alt sınır ne?\n4. Bu dersin üç cümlelik iskeletini ezbere söyle.","video":3,"damga":"36:44","sn":2204},{"ders":"4.6","modul":4,"baslik":"Copy ile ilan açmak","metin":"**Videoda:** Video 3, 46:06–49:29; Video 5 özeti: Video 5, 10:13–12:32.\n\n**Neden bu ders var?** Çünkü 50 klasörünü (Modül 3) yayına çevirecek olan el hareketi budur — ve yanlış düğme, satan bir ilanı yok eder.\n\n**Kural.** Yeni ilan **asla** \"Add a listing\" ile sıfırdan açılmaz — kategori, \"kim yaptı\", varyantlar, fiyatlar, kargo profili… her şeyi yeniden girersin. Video 5'te Emin boş formun ekranını gezdirip gösteriyor: \"İşte bu yüzden yapmıyoruz.\" Doğru yol: eğitmenle birlikte kurduğun **şablon ilanı** kopyalamak.\n\n**Akış — ekran sırasıyla:**\n\n1. Listings'te şablon ilanın menüsünden **Copy** de.\n2. **Başlığı** sil. Yeni ilanın başlığını yaz (Ders 3.6).\n3. **Görselleri** değiştir — ama size chart ve color chart görselleri her ilanda aynıdır, onlar **kalır**.\n4. **Açıklamanın** ilana özel ilk paragrafını değiştir. Sabit blok kalır.\n5. **Tag'leri** sil, yenilerini gir (Ders 3.7).\n6. Varsa **occasion** alanını değiştir (ilanın özel gün etiketi: Mother's Day, Easter…).\n7. **SKU**'yu değiştir: klasör kodun — ED001, ED002… (SKU varyant ekranında durur; \"barkod numarası gibi düşünün.\" Sipariş gelince tasarımı bu kodla bulacaksın.)\n8. **Dokunmadıkların:** varyantlar, fiyatlar, kategori, kargo profili — şablonun mirası, her yeni ilana aynen geçer.\n9. **\"Publish copy with changes\"** ile yayınla.\n\n**Edit tehlikesi.** En sık ve en pahalı acemi hatası: Copy yerine **Edit**'e basmak. Edit, var olan ilanın kendisini düzenler. Kaydettiğinde **eski ilan yeni içeriğin altında kaybolur.** Emin sınıftan geleni aynen aktarıyor: \"Hocam ben ilan açtım ama eski ilan kayboldu.\" — \"Copy'ye bastığınıza emin olun. Edit derseniz üstüne yazarsınız.\"\n\n**Personalization ayarı.** Tasarımın birden fazla renk sürümü varsa (Vivo örneği: golden da var, siyah da) müşterinin hangisini istediğini bilmen gerekir. Çözüm: ilanda kişiselleştirme kutusunu aç, metnini yaz (\"Please add a note for the design color you want\") ve **required** (zorunlu) yap. **Optional bırakma:** Emin'in gözlemi, \"optional bırakırsanız müşteri oraya anlamsız bir şey yazıyor ya da boş bırakıyor\" — sipariş hazırlanamaz, mesajlaşma trafiği başlar. (Kutu metnini 40 ilana birden yazmayı Ders 4.4'ten biliyorsun.)\n\n**En sık yapılan hata ve sonucu.** Edit'e basmak (satan ilan gider — geri gelmez). SKU'yu unutmak (sipariş gelince klasör avı). \"Nasılsa kopyaladım\" deyip occasion ve özel paragrafı eski ilandan bırakmak (Anneler Günü ilanının içinde Babalar Günü metni, müşteri güveni zedelenir). *(Videoda: Video 3, 49:08–49:22.)*\n\n**Gerçek bir öğrenciden.** Video 3'ü bitiren bir öğrenciye \"yeni ilan nasıl açılır?\" diye soruldu. Cevabı dürüsttü: \"Bilmiyorum, onu kaçırmışım.\" Copy videoda birkaç cümleyle geçer ama işin bel kemiğidir — 50 klasörünü yayına çevirecek düğme budur. Videoda bir yeri kaçırmak normaldir ve bu programın işi tam o boşlukları doldurmaktır. Ama bu dersten sonra \"Copy'yi kaçırdım\" diyemezsin. Akışı bir kez panel açıkken kendin yürüt (Ödev 4.1). El bir kez yaptığını unutmaz. *(Videodaki yeri: Video 3, 46:06–49:29; Video 5, 10:13.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 46:06–49:29.*\n1. Copy akışında değişen yedi alanı ve dokunulmayan dört alanı say.\n2. Edit'e basılırsa ne olur — sınıftaki cümleyle?\n3. Personalization kutusu neden required yapılır?","video":3,"damga":"46:06","sn":2766},{"ders":"4.7","modul":4,"baslik":"Orders: sipariş satırını okumak ve sipariş düğmeleri","metin":"*Başvuru dersi — ilk siparişin düştüğü gün aç.*\n\n**Videoda:** Video 4, 6:01–8:57.\n\n**Neden bu ders var?** Sipariş geldiği anda ekranda gördüğün her alanın bir anlamı ve bir kısmının da saati işleyen bir sonucu vardır.\n\n**Sipariş satırı.** Orders sekmesinde yeni siparişler üstten alta sıralanır. Bir satırda şunlar durur: müşterinin adı; **order numarası**; kullandığı kupon; ürünün başlığı; adet; **SKU** (hangi klasördeki tasarım — Ders 4.6'nın meyvesi); beden ve renk. Devamında kargo adresi ve **teslim alacak kişinin adı**; seçtiği kargo tipi ve ücreti (standart shipping 5,99; iki ürün alan müşteride 7,99, profildeki +2 dolar kuralı, Ders 2.5). En sağda sipariş tarihi ve **ship by date** (\"27'sinde sipariş verdi, 29'una kadar kargola\").\n\nİki işaret öğren: satırdaki **megafon simgesi**, siparişin reklamdan geldiğini gösterir (müşteri \"Ad by seller\" ilana tıklamış; reklam ücreti kesilmiş demektir — Ders 4.13'te önem kazanacak); simgesizler organiktir. **\"Upgrade requested\"** filtresi, standart yerine hızlı kargo seçenleri süzer: Emin'in ekranında iki müşteri USPS Priority Express'e 16 dolar vermiş: \"Demek ki acil ihtiyacı var.\" Bu bilgiyi işlemde önceliklendirme için kullanırsın.\n\n**Düğmeler.**\n\n- **Mesaj:** satırdan doğrudan müşteriye yazarsın.\n- **Update progress + etiketler:** siparişi kendi sınıflarına taşırsın (\"onay bekleyenler\", \"hazırlandı\"…). Mesajlarda da aynı sistem vardır (**labels**: \"geri gelecek\", \"hatalı\", \"kayıp\"). Emin büyüyen mağazaların düzenini anlatıyor: 3-4 kişilik ekipte biri mesajları ayıklar, biri yalnız sorunlularla ilgilenir, biri standart cevapları verir. 100 siparişlik günde siparişler etiketle kişilere bölünür. Şimdilik bilmen yeter — sistem büyüyünce hazırdır.\n- **Print:** kargo etiketi (label) basar. **Sen kullanmayacaksın** — bizim etiketlerimizi üretici, aracı program üzerinden alır (Ders 4.9). Bu düğme, evinden bardak-deri kargolayan satıcı içindir.\n- **Update ship by date:** tarihi bir-iki gün uzatır. Kullanım anı kritik: sipariş yetişmeyecekse **overdue'ya düşmeden önce** uzat; müşteriye \"bir aksilik çıktı, kargonu bir gün ertelemek zorundayım\" bilgisi gider. Satırdaki ibareler sırayla: **ship tomorrow → ship today → kırmızı OVERDUE** (gecikmiş). \"Overdue mağazanı çok kötü etkiler. Asla bir order'ın overdue'ya düşmesine izin verme.\"\n- **Mark as gift:** hediye işareti. Hediye paketi (gift box) bardak gibi ürünlerde ek ücretli hizmet olarak sunulabilir. Tişörtte yapılmaz — standart çiçekli poşet + UPS poşetiyle gider.\n- **Cancel order:** müşteri yanlışlıkla iki kez sipariş verdiyse, yanlış beden aldıysa, vazgeçtiyse — **paket kargoya çıkmadıysa** iptal edersin. Çıktıysa: \"Monika, kusura bakma. Siparişini kargoya verdim, artık iptal edemiyorum. Çok özür dilerim.\"\n- **Refund:** paranın bir kısmını iade eder. Genellikle **completed** siparişlerde, küçük bir kusur için kullanılır: \"Sen buna 36 dolar verdin; 5 dolar iade edeyim, fit olalım\" (güzel bir dille — şablonlar Modül 5'te). Ekranda sebep sorulur: **account adjustment** seçilir. Ürünün geri gönderilmesi istenmez. İadenin de küçük bir işlem kesintisi vardır.\n\n**İade politikası bağlamı.** Kurs çizgisi (Modül 2'den): **no returns, no exchanges.** Gerekçe: tişört kişisel üründür — \"adam üç hafta giyer, kirletir, sonra iade edeceğim der; iç çamaşırında, makyajda Amazon da iade almaz.\" (İadeyi açık unutan mağazalara üç hafta giyilmiş tişörtler dönmüş, gerçek tecrübe.) Ama politika ile pratik ayrıdır. Açıklamada \"memnun olmadığın bir durum olursa bana yaz, yardımcı olurum\" cümlesi durur ve **esnaf refleksi** çalışır. 20 tişört alıp biri büyük gelen müşteriye \"politikam gereği yapamam\" denmez. \"Hiç problem değil, small gönderiyorum\" denir. Bu dengeyi tecrübeyle öğreneceksin. İlk vakalarını eğitmeninle yönet.\n\n**En sık yapılan hata ve sonucu.** Ship by date'i \"belki yetişir\" umuduyla uzatmamak (overdue — mağaza zedelenir). Kargodaki siparişi iptal etmeye çalışmak. Refund sebep alanına rastgele bir şey seçmek. *(Videoda: Video 4, 6:01–8:57.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 6:01–8:57.*\n1. Sipariş satırındaki megafon ve \"upgrade requested\" ne anlatır?\n2. Ship tomorrow → overdue zincirini ve doğru müdahale anını anlat.\n3. Cancel ile refund'un kullanım yerlerini ayır. İade politikasıyla esnaf refleksi nasıl bağdaşır?","video":4,"damga":"6:01","sn":361},{"ders":"4.8","modul":4,"baslik":"Kargo sorusuna tek cevap: \"Yarın kargoya veririm\"","metin":"**Videoda:** Video 4, 1:43–4:56.\n\n**Neden bu ders var?** \"Bugün sipariş versem ayın üçünden önce elimde olur mu?\" — bu soru her hafta gelir ve yanlış cevabı, tutulamayacak bir sözdür.\n\n**Kural ve gerekçesi.** Senin kontrolünde olan tek şey, siparişi kargoya verme süredir (processing time: 1 gün — Ders 2.5). Paketi taşıyan sen değilsin: kargo görevlisi hastalanır, hava muhalefeti çıkar, araç bozulur. Teslimat iki gün sarkar ve \"sen üçü dedin, beşine geldi\" diye kızan müşteriyle uğraşırsın. O yüzden söz tektir: **\"Ben bunu yarın kargoya veririm. Ondan sonrası USPS/UPS'in işi. Tam ulaşacağı gün için söz veremem.\"**\n\n**İstisna: garanti isteyen müşteri.** \"Salı günü mutlaka lazım\" diyorsa tek garantili yol **UPS Next Day Air**: uçak kargo, bütün eyaletlere ertesi gün — Teksas'tan New Jersey'ye bile. Bölgeye göre **40-45 dolar** (bizim profilde müşteriye 49 yazar, Ders 2.5). Müşteri ödeme ekranında zaten üç seçenek görür: standart, express, next day air. \"Salı doğum günü var, hediye alınmamış\" diyen müşteri bu parayı verir: \"bunu ödeyen var.\"\n\n**Emin'in mesaj kalıbı** (Modül 5'te İngilizce şablonunu bulacaksın): \"Yarın kargoya verebilirim; kargoya verdikten sonraki aşamada benden kaynaklı olmayan, USPS kaynaklı gecikmeler yaşanabiliyor. Sana tam ulaşacağı günle ilgili söz veremem. Ama mutlaka salıya yetişmesi gerekiyorsa, ödeme ekranında Next Day Air'ı seçersen ancak o zaman söz verebilirim.\"\n\n**En sık yapılan hata ve sonucu.** İyi niyetle tarih sözü vermek (\"cumaya gelir\"). Kargo bir gün sarktı — müşteri haklı olarak kızgın, yorum bir yıldız, Star Seller ölçün yara aldı. Sözün maliyetini kargo şirketi değil sen ödersin. *(Videoda: Video 4, 1:43–4:56.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 1:43–4:56.*\n1. Neden yalnızca kargoya verme günü için söz verilir?\n2. Garanti isteyen müşteriye ne önerilir, kaç dolar, hangi kanaldan seçer?\n3. Kalıp cevabı kendi cümlelerinle kur.","video":4,"damga":"1:43","sn":103},{"ders":"4.9","modul":4,"baslik":"Ship by date, pre-transit, in transit, delivered","metin":"**Videoda:** Video 4, 15:34–23:47; senkronizasyon ayarı: Video 5, 0:33.\n\n**Neden bu ders var?** Siparişin kargo hayatının üç durumu vardır ve bunlardan biri (pre-transit) kursun en sert uyarısını taşır: yanlış yönetilirse mağaza kapatır.\n\n**Ship by date nasıl hesaplanır?** Sen Etsy'ye iki bilgi verdin (Ders 2.5): hangi günler kargo çıkardığın (pazartesi-cumartesi) ve processing time'ın (1 gün; kurulumda 1-2 gün aralığı). Etsy her siparişe tarihi kendisi yazar: \"27'sinde gelen siparişi en geç 29'una kadar kargola.\" (Sınıf sorusu (\"kargoladığımı nereden biliyor?\") cevabı aşağıda: etiketten.)\n\n**Üç durum.**\n\n- **Pre-transit:** kargo etiketi (label) basılmış, pakete yapıştırılmış — ama paket kargo şirketine teslim edilip **taranmamış**. Emin'in benzetmesi: paketi evde hazırladın, etiketi bastın. Sabah arabanın tekeri patladı, USPS'e götüremedin; götürüp \"dünkü siparişlerim\" diye teslim edene, görevli barkodu okutana kadar sipariş pre-transit'te bekler.\n- **In transit:** paket teslim edilmiş, taranmış, yolda. Takip sayfasında her adım görünür — Emin'in örneği: etiket 26 Nisan 07:19'da basılmış. 15:21'de Round Rock'taki paket istasyonuna teslim edilmiş. Ertesi sabah 08:28'de USPS bölge dağıtım merkezinde; sonra Dallas… Tesisin ritmi de görünüyor: gece vardiyası basar, sabah 6'da etiketler alınır, öğleden sonra paketler istasyona gider. \"shipping time'ımız bir gün\" bu demektir.\n- **Delivered:** teslim edilmiş. Takip notunu okumayı öğren: **\"at the door\"** (kapıya bırakıldı), **\"security gate\"** (site güvenliğine bırakıldı — Emin'in örneğinde cumartesi 16:44). \"Paketimi bulamadım\" diyen müşteriye bu bilgiyi sen verirsin: \"Cumartesi 16:44'te güvenlik girişine bırakıldığını görüyorum. Kontrol eder misin?\" (Müşteri takibi kendisi de görebilir ama çoğu anlamaz; senin işin okuyup çevirmektir. \"Almadım\"da ısrar ederse Modül 5'teki case protokolü devreye girer.)\n\n**Pre-transit kuralı — kursun en sert uyarısı.** **Bir sipariş pre-transit'te 12-15 saatten fazla kalmamalı**. Etiket alındığı gün paket taranmalı. Neden bu kadar sert? Çünkü etiket alıp paketi bekletmek bilinen bir dolandırıcılık desenidir: \"Bugün 100 siparişin etiketini al, paketleri üç gün sonra gönder. Üç-dört gün böyle tekrar etti mi Etsy mağazayı askıya alır: 'Elinde bir sürü pre-transit ürün var; paketleri teslim etmiyor musun? Müşterilerimi mağdur mu edeceksin?' Götürüp teslim etmezsen mağazayı kapatır, **müşterilere paralarını geri öder, senin içerideki paranı da vermez.**\"\n\nPratik görevin iki yönlü:\n\n1. **Üretici yönü:** dün etiketi alınmış sipariş bugün hâlâ pre-transit'teyse üreticideki muhatabına yaz. Gerçek örnek: 25 Nisan'ın iki siparişi 27'sinde pre-transit'te — sebep, çok satan bir renkte tişörtün o gün bitmesi; \"toptancıdan geliyor, bugün-yarın çıkar\" cevabı gelir. Sen de müşteriyi buna göre bilgilendirirsin.\n2. **Kendi yönün:** pre-transit'in bir sebebi de mağaza yöneticisidir. Gerçek örnek: custom siparişte logo müşteriden gelmedi; yönetici üreticiye \"etiketi alın, tasarımı öğleden sonra gönderirim\" dedi — tasarım gelmedi, paket etiketli bekledi, sayaç işledi. **Kural: tasarım netleşmeden etiket aldırma; onun yerine ship by date'i uzat** (Ders 4.7).\n\n**Teknik sızdırmazlık: senkronizasyon.** Etsy'nin \"kargoladın\" bilgisi etiketten gelir: üreticinin programı, kargo şirketi ve mağazan arasında **API entegrasyonu** vardır — etiket alındığı an **tracking number** mağazaya düşer ve sipariş pre-transit görünür. Üretici etiketleri ShipStation gibi bir programdan alıyorsa, etiket bilgisinin mağazaya **kaç saat sonra yansıyacağı** ayarlanabilir: sabah 6'da etiket alıp paketi öğleden sonra götüren üreticide senkronu 6 saat geciktir. Etiket mağazada öğlen görünür, paket iki saat sonra taranır; pre-transit süresi kâğıt üstünde de kısalır. Üreticin günlük paketlemiyorsa bunu konuş: ya senkronu geciktirsin ya sen shipping time'ını ona göre ayarla.\n\n**Çoklu profil notu.** İleride tişörtü Teksas'tan, bardağı Denizli'deki evinden kargolarsan her ürün grubuna ayrı shipping profile ve çıkış adresi tanımlanır. Completed'daki **destination** filtresi buna göre süzer. Kendi kargoladığın üründe Print düğmesi (Ders 4.7) o zaman senindir. Bizim kurulumda her şey ABD'den çıkar — filtre boş kalır.\n\n**En sık yapılan hata ve sonucu.** \"Etiket alındıysa iş bitti\" sanmak — bitmedi: taranana kadar sayaç sende işler. Ve en pahalısı: tasarım gelmeden etiket aldırma alışkanlığı. Bir gün 100 siparişlik tabloda bu, mağaza kapatan desenin ta kendisi gibi görünür. *(Videoda: Video 4, 22:24–23:15.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 15:34–23:47.*\n1. Üç durumu tanımla ve her birinde \"paket fiziken nerede?\" sorusuna cevap ver.\n2. 12-15 saat kuralının arkasındaki dolandırıcılık desenini ve Etsy'nin tepkisini anlat.\n3. Pre-transit'e düşmenin üretici kaynaklı ve yönetici kaynaklı birer örneğini ver. Her birinde senin hamlen ne?","video":4,"damga":"15:34","sn":934},{"ders":"4.10","modul":4,"baslik":"Sorumluluk paylaşımı: her şey sende","metin":"**Videoda:** Video 4, 27:05–33:14.\n\n**Neden bu ders var?** Sınıfta arka arkaya soruldu — \"kargo gecikirse müşteriyle kim konuşacak?\", \"kimin ne kadar sorumluluğu var?\". Çünkü production partner modelinde çizgiyi yanlış çizen yönetici ya işine karışılmasına izin verir ya da işini sahipsiz bırakır.\n\n**Çizgi.** Üretim tarafında **hiçbir işin yok**: tasarımı sisteme gönderirsin; üretici print eder, envanterden tişörtü bulur, presler, paketler, etiketi yapıştırır, UPS'e teslim eder. Mağaza tarafında ise **her şey senin**: ilanlar, tasarım gönderimi, bütün mesajlar, gecikme bilgilendirmesi, şikayetler, \"psikolojik yönetişim\" — müşteri karşısındaki tek muhatap sensin. Emre'nin sorusuna Emin'in cevabı: \"Sizde bir gecikme olsa biz sizinle irtibat kurup öğrenip müşteriye aktarıyoruz, o trafiği biz mi yönetiyoruz?\". \"Aynen. Her şeyi, bütün mesajları siz. Her şeyin sahibi sizsiniz.\"\n\nDahası: **üreticiyi denetleyen de sensin.** \"Üreticide gecikme olursa 'Emin Bey, bu kargo gecikiyor — bir oldu, iki oldu. Bu böyle olmaz' diyecek olan sensin.\" AVM benzetmesinin son hali: \"Sokağa su da bassa, sel de gelse. Giden mal senin malın, kaybedilen para senin paran, kaçan müşteri senin müşterin. Belediyeye kızacak olan da sensin.\" (Bir gerçeklik notu: kargo şirketine tesliminden sonra fiziki sorumluluk kargodadır, ama bilgilendirme ve müşteri yönetimi yine sende; \"delivered ama almadım\" senaryosunun çözümü Modül 5'te.)\n\n**Emin'in örneği — sınır nerede genişler?** Bir müşteri, arkadaşının işletmesinin logosunu tişörte bastırmak istedi. İnternetten alınmış logo \"kare kare, piksel piksel. Çamur gibi.\" Basılamaz. Ne yapıldı? Vaka 4.B'de tam anlatım. Ama özeti şu: müşteri yönetimi bazen tasarım müdahalesi de ister ve o müdahale senin işindir.\n\n**En sık yapılan hata ve sonucu.** Müşteriye \"üreticiden kaynaklı, benlik bir şey yok\" demek. Modül 5'in birinci tekil şahıs kuralının ihlalidir ve müşteri gözünde seni sahipsiz bir aracıya çevirir — bir sonraki siparişini sahibi belli bir mağazadan verir. *(Videoda: Video 4, 27:05–33:14.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 27:05–33:14.*\n1. Üretici tarafı / senin tarafın listesini ezbersiz, kendi cümlelerinle çiz.\n2. \"Üreticiyi denetleyen sensin\" ne demek — örnek cümlesi ne?\n3. AVM benzetmesinin bu dersteki versiyonunu anlat.","video":4,"damga":"27:05","sn":1625},{"ders":"4.11","modul":4,"baslik":"Stats ve Star Seller ölçüleri","metin":"**Videoda:** Video 4, 39:11–44:56.\n\n**Neden bu ders var?** Panelin sayıları iki işe yarar: mağazanın nabzını okumak (Stats) ve Etsy'nin senden beklediği hizmet çıtasını izlemek (customer service stats). İkisi de haftalık rutinindir.\n\n**Stats okuma.** Dönem seç (dün, son 30 gün…) ve şunları oku — Emin'in ekranındaki gerçek sayılarla:\n\n- **Visits, orders ve conversion rate** (dönüşüm oranı = sipariş ÷ ziyaret): 72 order ÷ 1.442 visit ≈ **%5.** Bu oran, ilanlarının \"tıklayanı müşteriye çevirme\" gücüdür.\n- **Revenue** (gelir) ve sosyal göstergeler: 195 favori, 2 yeni takipçi, 5 yorum, 4 **repeat buyer** (tekrar alışveriş yapan müşteri), 71 farklı şehirden ziyaret, sepete eklenen 84 ürün (~1.602 dolarlık sepet).\n- **Trafik kaynakları:** en büyüğü **Etsy uygulaması** (950 — millet telefondan alıyor; Ders 1.3'ün kanıtı), sonra Etsy araması (138), marketing/Etsy Ads (98), sosyal medya (Pinterest'ten 1 tıklama), direct ve diğerleri. Son 30 gün görünümü, önceki 30 günle kıyas verir: \"Facebook-Pinterest düşmüşüz, Instagram artmış.\"\n- **Share & Save satırı:** paylaşım linkinden gelen siparişlerde kazandığın kesinti indirimi — ekranda 12 paylaşım, 2 sipariş, ~30 dolar tasarruf (mekanizması Modül 5'te).\n- **Offsite Ads** anahtarı: Etsy ilanını Google'da ve sosyal platformlarda gösterir (\"turtle shirt\" aramasında Google'da Etsy reklamı çıkıyor). Oradan tıklanıp satış olursa \"reklamını ben yaptım, parasını ver\" der, ücret keser. Panelden açılıp kapatılabilir.\n\nStats'in üç pratik kullanımını önceki derslerden biliyorsun: prime time saatleri (Ders 4.3), hangi ilanın ziyaret aldığı ve hangi kelimelerden tıklama geldiği.\n\n**Customer service stats — Star Seller'ın dört ölçüsü.** Bu sayfa, Etsy'nin hizmet çıtasında nerede durduğunu gösterir:\n\n1. **Mesajlara 24 saat içinde cevap** — hedef %100. Kurs pratiği çok daha yukarıdadır: \"12 saati geçirmeyin; siparişe dönüştürmek için 3-4 dakikada cevap verin.\"\n2. **Zamanında kargo** — %95'in altına düşmemeli. Senin payın: tasarımları üreticiye eksiksiz ve zamanında göndermek (Ders 4.9'un yönetici hatası tam burayı vurur).\n3. **Ortalama yorum puanı 4,8'in üzerinde** — \"tek bir bir-yıldız ortalamayı düşürür.\"\n4. **Case rate %1'in altında** — case, müşterinin Etsy nezdinde açtığı şikayet dosyasıdır (Modül 5'te). Ekrandaki örnek: 4.229 siparişte %0.\n\nDördü tutunca **Star Seller rozeti** mağazanda görünür ve müşteri güveni artar: \"Bu mağaza Star Seller — problem yaşamam\" deyip siparişi senden verir. Sayfadaki soru-cevapları ve öğretici içerikleri de oku: Emin özellikle istiyor.\n\n> **Videolarda yok — sonradan eklendi, doğrulanmalı:** Etsy'nin resmî Star Seller ölçütlerinde bu dördüne ek olarak son üç ayda en az 5 sipariş ve 300 dolar satış şartı vardır; değerlendirme her ayın birinde yapılır. Yeni mağaza ilk günden rozet alamaz. Ölçüleri ilk günden alışkanlık yapmanın sebebi budur. *(Videolar arasında puan konusunda 4,5/4,8 farkı da var; Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)*\n\n**En sık yapılan hata ve sonucu.** Stats'i yalnız \"kaç sattım\"a bakmak için açmak. Trafik kaynağını, dönüşümü ve dört hizmet ölçüsünü izlemeyen yönetici, sorunu ancak rozet gidince (yani geç) fark eder. *(Videoda: Video 4, 43:33–44:56.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 39:11–44:56.*\n1. Conversion rate nasıl hesaplanır — ekrandaki örnekle?\n2. En büyük trafik kaynağı neydi ve hangi dersin kanıtı?\n3. Dört ölçüyü eşikleriyle say. Kutudaki ek şart ne?","video":4,"damga":"39:11","sn":2351},{"ders":"4.12","modul":4,"baslik":"Kupon düzeni: katmanlı indirim sistemi","metin":"*Başvuru dersi — kuponları eğitmenle kuracağınız gün aç.*\n\n**Videoda:** Video 4, 48:06–59:49.\n\n**Neden bu ders var?** Ders 4.5'te kuralı öğrendin: fiyat sabit, indirim kuponla. Bu ders o kuponların sistemini kurar — Marketing > **Sales and discounts** ekranında.\n\n**Katman 1 — Mağaza geneli sabit kupon.** Temel indirim. Emin'in örneğinde **%50** (60 dolar yazılmış tişört müşteriye 30 dolar görünür). Süreklidir. Müşterinin \"etiketteki fiyat\"ı fiilen budur.\n\n**Katman 2 — Etsy'nin otomatik e-posta kuponları.** Etsy senin adına üç kitleye mail atar: sepete ekleyip almayanlara (**abandoned cart**), favoriye alanlara (**your fave/favorites**) ve sipariş verenlere teşekkür (**thank you**). Gücünü ekrandan gösteriyor: son ayda Etsy **32.000 kişiye** mail atmış. Thank you kuponunu 198, favori kuponunu 227 kişi kullanmış. \"your fave'den bayağı gelir olmuş.\" **Kural: otomatik kuponlar, mağaza kuponundan 5 puan yüksek olur** (mağaza 45 ise onlar 50; mağaza 50 ise 55). Neden? Ekrandaki kötü örnekten: bir yönetici hepsini %50 yapmış. \"Adamı alışverişe sevk edecek bir şey yok: mağazada zaten %50 var. Favori alana %55 gelirse 'bana özel 5 puan göndermiş' der, alır.\"\n**Katman 3 — Run a sale: tarihli mağaza indirimi, gün gün.** Emin'in taktiği: indirimi aydan aya değil **gün gün** planla. Ekran yolu: Run a sale → yüzdeyi seç (%50, \"25 önerisini bırak, kendi oranını seç\") → bölge: **United States** → tarih: yalnız o gün → bütün ilanlar → create. Ertesi gün için bir tane daha, sonraki için bir tane daha. Planlananlar \"scheduled\" listesinde dizilir. **Her ayın başında 1'inden 30'una** kurulur. Neden bu zahmet? Çünkü ilan sayfasında müşteri şunu görür: **\"Bu indirim 10 saat içinde bitiyor.\"** Sınıftan gelen \"aylık kuponla farkı ne?\" sorusuna cevap tam bu: aciliyet yazısı. \"Halbuki bitmeyecek: 10 saat sonra öteki kupon devreye girecek. Ama akıllı balık da bazen oltaya böyle vurur.\"\n\n**Diğer araçlar.**\n\n- **Promo code (tek müşteriye özel kod):** sabit tutar, yüzde ya da ücretsiz kargo; tarihli. Kullanım örneği ekranda: \"20 tişört alacağım, indirim yok mu?\" diyen müşteriye mağazadaki %50 yerine **%60**'lık, bir-iki günlük özel kod: 60 dolarlık tişört %50 ile 30'a, %60 ile 24'e iner. 20 tişörtte müşteri 600 yerine 480 dolar öder. Ücretsiz kargo kodu da aynı ekrandan.\n- **Toplu alım indirimi:** 3 alana %55, 5 alana %60, 10 alana ücretsiz kargo — kademeler senin.\n- **Kombinasyon indirimi:** belirli ilanları birlikte alana indirim. Emin'in kitap severler örneği: aynı romanın üç ayrı tasarımını (Fireheart Queen, House of Wind Book Club, Velaris Comfort Colors) seç — \"üçünü birden alana %60\" de; hayranı olan müşteri üçünü alır. \"Amazon'un 'bunu alan şunu da aldı' mantığı.\"\n- **Accept offers:** müşterinin fiyat teklifi vermesine izin veren ayar. Kim kullanır? Elinde eski model iki sehpa kalmış mobilyacı — \"ucu açık teklif bırakır. 'Ciddi alıcı 5 dolar dese veririm' der.\" Bu tekliflerin toplayıcı lobileri bile var. **Biz kullanmayız**. Bizim ürünlerimiz elde kalmış stok değil.\n- Hepsinin bölge ayarı: **yalnız United States** (Ders 2.5'in kuralı).\n\n**Custom web address notu.** Aynı Marketing bölümünde kendi alan adını mağazana bağlama ve sosyal hesap bağlama seçenekleri de var. Emin kendi sitesi-Shopify konusunu \"mağazan büyüyünce, takipçi kitlen oluşunca düşünülecek iş\" diye anıp geçiyor — bu programın kapsamı dışındadır. Zamanı gelince eğitmeninle.\n\n**En sık yapılan hata ve sonucu.** Otomatik kuponları mağaza kuponuyla eşitlemek (32.000 mailin gücü boşa gider), run a sale'i aylık tek kupon olarak açmak (aciliyet yazısı kaybolur) ve kuponları \"everywhere\" bırakmak (yurt dışı siparişin kargo-takip derdi kapına gelir). *(Videoda: Video 4, 59:25–59:49.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 48:06–59:49.*\n1. Üç katmanı ve 5 puan kuralını, ekrandaki kötü örnekle birlikte anlat.\n2. Gün gün planlamanın müşteri ekranındaki karşılığı ne?\n3. 20 tişörtlük müşteriye özel kod hesabını yap: 60 dolar, %50 → %60.","video":4,"damga":"48:06","sn":2886},{"ders":"4.13","modul":4,"baslik":"Etsy Ads ve ROAS eşiği","metin":"*Başvuru dersi — reklamı açacağınız gün aç.*\n\n**Videoda:** Video 4, 1:05:12–1:16:46.\n\n**Neden bu ders var?** Reklam, panelin para yakabilen tek düğmesidir. Kurs sana bir eşik (2), bir protokol (kelime kapat → izle → kapat/yeniden aç) ve bir tuzak uyarısı (rapor ≠ toplam satış) verir.\n\n**Kontrolün üç kolu.** Etsy Ads'te reklamcılıktaki gibi hedef kitle, yaş, bölge seçemezsin — \"Etsy bunların hiçbirine seni karıştırmıyor.\" Yapabildiklerin: (1) günlük **bütçe** belirlemek, (2) hangi ilanların reklama girip girmeyeceğini seçmek (**not advertised** işareti), (3) ilan bazında Etsy'nin seni gösterdiği arama **kelimelerini kapatmak.** Bu kadar.\n\n**Raporu okumak — ekrandaki gerçek satırlar.** İlan başına: **views** 35.000, **clicks** 721, **click rate** ~%2, **orders** 64, **revenue** 1.656 dolar, **spend** 486 dolar. Etsy tıklama başına ücret alır. Emin ekranda kabaca 60-70 cent buluyor; tam hesap 486 ÷ 721 = **0,67 dolar/tıklama**. Başka ilanlarda 0,56 ve 0,74. \"rekabeti yüksek kelimede tıklama başı maliyet artar.\" **ROAS** (return on ad spend) = reklamdan gelen gelir ÷ reklam harcaması: 1.656 ÷ 486 ≈ **3,4.** Bir okuma inceliği: 22 siparişle yüksek ROAS yapan ilanda muhtemelen toplu siparişler vardır (\"22 order'da 60 item, üçlü beşli almışlar\").\n\n**Eşik ve protokol.** İlanları harcamaya göre sırala. Her satır için:\n\n- **ROAS 2'nin üzerinde → dokunma.** (3,4 → \"tamam, bu kalsın.\")\n- **ROAS 2'nin altında → görev başlıyor.** İlana gir. Etsy'nin reklam gösterdiği kelimeler listelenir. Satmadığın konuların kelimelerini **kapat**: Emin'in ekranındaki ilanda \"Gilmore Girls poster\", \"Gilmore Girls baby\" kapatılmış — \"Ben poster satmıyorum, wall art satmıyorum. Beni buralarda gösterme.\" Sonra **bir hafta izle.** Hâlâ 2'nin altındaysa: mağazan çok kârlı ve sipariş boluysa kapatmayabilirsin; değilse **ilanı reklama kapat ve o tasarımı yeni bir ilan olarak aç** (Ders 3.11'in tekniğiyle).\n\nVideo 5'ten iki uç örnek: 266 gösterim, 1 tıklama, 1 sipariş — ROAS ~49: \"attığın ok hedefi vurdu.\" 23 dolar harcama, 22 tıklama, 1 sipariş (18-19 dolar). ROAS 1'in altı: kelimeleri kapattıysan ve düzelmiyorsa reklamı kapat; tasarım iyiyse yeniden aç.\n\n**Tuzak: reklam raporu toplam satış değildir.** Ekrandaki ders vakası: \"custom logo hoodie\" ilanı — 117 dolar harcama, reklamdan 1 sipariş, ROAS 0,25. \"Batmışız mı? Dur.\" İlanın kendi istatistiği açılıyor: **son ayda 87 adet satmış, organikten.** Reklam raporu yalnız reklam tıklamasından gelen siparişi gösterir; insanlar reklamdan tıklayıp favoriye alıp sonra organik sipariş verebiliyor (ilanda \"custom hoodie\" kelimesinden 28 tıklama var). Böyle bir ilanda karar testle verilir: \"Reklamı kapatsam organik satışım düşer mi?\", önce sor, sonra kapat.\n\n**Oturmuş mağaza kuralı.** \"Günde 100 ve üzeri satan mağazalarda reklamı çok ellemiyoruz — reklam yesin.\" Çünkü bütçe değişikliği, ilanları reklama açıp kapatmak köklü harekettir. \"Etsy'nin o mağaza hakkında kafasında oturmuş bir şey var; köklü değişiklik yaparsan algoritması bozulur ve yeniden oturması bir ayı geçer. Belli satışa ulaştıktan sonra tek işin: her gün güzel konulardan, güzel mockup'larla ilan girmek ve siparişleri memnun etmek. Gerisine gerek yok.\"\n\n**En sık yapılan hata ve sonucu.** ROAS'ı düşük görüp organik satışı kontrol etmeden iyi bir ilanı reklama kapatmak (87'lik ilanı söndürebilirsin). Kelime kapatma ve bir hafta izleme adımını atlayıp doğrudan kapatmak. Ve oturmuş mağazada \"optimizasyon\" hevesiyle düğmelerle oynamak — bir aylık algoritma sarsıntısının faturasıyla. *(Videoda: Video 4, 1:13:49–1:14:51.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 4, 1:05:12–1:16:46.*\n1. Kontrolün üç kolunu ve seçemediklerini say.\n2. ROAS formülünü ekrandaki sayılarla hesapla. Eşik protokolünü adım adım anlat.\n3. Custom hoodie vakasında rapor neden yanıltıcıydı ve doğru karar süreci ne?","video":4,"damga":"1:05:12","sn":3912},{"ders":"4.14","modul":4,"baslik":"Finances paneli: deposit günlük, para ekranını okumak","metin":"*Başvuru dersi — ilk paran yatarken aç.*\n\n**Videoda:** Video 5, 19:50–27:41.\n\n**Neden bu ders var?** Kâr-maliyet analizi bu programın dışındadır (işe başlayınca eğitmeninle, gerçek rakamlar üzerinde) — ama panelin para ekranını **okuyabilmek** ve tek kritik ayarı **kurmak** senin işindir.\n\n**Ekranı okumak.** Finances'te aylık, üç aylık, altı aylık görünüm vardır. Kalemler: **sales** — dönemin toplam satış tutarı; **fees**. Etsy'nin kestiği ücretler (Emin'in anlatımıyla \"müşteriden parayı alıp sana getirirken bankalara, Mastercard'a-Visa'ya ödediğim aracılık ücretleri\", transaction ve processing kesintileri); **marketing**. Reklam gideri (Ders 4.13'ü iyi yönetirsen küçülür, kötü yönetirsen büyür); **net profit** (Etsy'nin **banka hesabına gönderdiği** para; **your current balance**) henüz gönderilmemiş, **Etsy'de bekleyen** para. Bu son ikisini karıştırma: biri cebine girmiş, öteki kapıda bekliyor.\n\nSipariş bazlı dökümde her kesinti ayrı görünür. Videoda geçen kalemler: tax (Etsy'nin topladığı satış vergisi), %6,5 **transaction fee** (dikkat: **kargo ücretinden de** kesilir) ve ülkeye göre **regulatory operating fee** (ekrandaki örnekte %2,27). Bir de her satışta kesilen 0,20 dolarlık yenileme var (Ders 4.3). Bunların videoda geçtiği haliyle tablosu Ek F'te. Rakamlar Etsy tarafından değiştirilebilir. Tabloda \"kontrol et\" notuyla durur. **Monthly statements** bölümünden her ayın tam dökümü CSV olarak indirilir. **Payment settings**'te banka, **legal and tax information**'da ad-soyad ve vergi bilgileri durur (kurulumda bir kez, Ders 4.1).\n\n**Tek kritik ayar: deposit günlük.** Etsy biriken parayı bankaya hangi sıklıkla yatıracağını sorar: günlük, haftalık, iki haftalık, aylık. **Daily (günlük) seç.** Gerekçe Emin'in ağzından: \"Allah muhafaza, mağazaya bir şey olursa paranın çoğu içeride kalmasın. Biz Etsy'nin içinde mümkün olduğunca az para kalsın diye uğraşıyoruz.\" (Pre-transit dersindeki karanlık senaryoyu hatırla: kapanan mağazanın içerideki parası ödenmiyor.)\n\n**En sık yapılan hata ve sonucu.** Deposit'i aylıkta unutmak — bir sorun anında bir aylık ciro içeride kalır. İkincisi: net profit ile current balance'ı karıştırıp \"param kayıp\" telaşı yaşamak. *(Videoda: Video 5, 19:50–27:41.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 19:50–27:41.*\n1. Beş kalemi (sales, fees, marketing, net profit, current balance) birer cümleyle ayır.\n2. Transaction fee'nin gözden kaçan kapsamı ne?\n3. Deposit ayarı ne olacak ve gerekçesi ne?","video":5,"damga":"19:50","sn":1190},{"ders":"4.15","modul":4,"baslik":"Baskı dosyası hazırlamak (manuel üretici)","metin":"*Başvuru dersi — ilk baskı dosyanı hazırlarken aç (Ödev 4.5 ile birlikte).*\n\n**Videoda:** Video 5, 28:02–44:25.\n\n**Neden bu ders var?** Üreticiler ikiye ayrılır. Yazılımla çalışanda işin kolay: tasarımını SKU adıyla (L309.png) ortak Drive klasörüne yüklersin; sipariş düşünce yazılım tasarımı kendisi bulur — \"sen sipariş hazırlamaya karışmazsın.\" **Manuel** çalışan üreticide ise her sabah bir **baskı dosyası** hazırlayıp göndermek senin işindir. Emin \"en manuel hali öğrenin. Proses nasıl işliyor görün\" diyerek adım adım gösteriyor. (Üreticilerin çalışma ve ücret modelleri (kim dizmeyi ücretsiz yapar, kim sipariş başına ücret ister) işe başlayıp ilk sipariş geldiğinde eğitmeninle konuşulacak konudur; Emin seçenekleri o gün masaya koyacağını söylüyor.)\n\n**Dosyanın kurulumu.** Illustrator'da yeni dosya: **genişlik 22,5 inç** — yazıcının basabildiği en geniş ölçü; **bu çerçeveden taşan basılmaz.** Yükseklik sipariş sayısına göre 100-150-200 inç. **CMYK, 300 ppi.** Beyaz tasarımları beyaz zeminde göremezsin: çalışma yüzeyinin üstüne kocaman **gri bir dikdörtgen** çiz, katmanını **kilitle**, artık beyaz tasarımlar seçilir durumda.\n\n**Her siparişin bloğu.** Sipariş bilgilerini panelden kopyala-yapıştırla dizersin — dört satır:\n\n1. **Mağaza adı** (üretici birden çok mağazaya basıyor; kimin işi olduğu en üstte yazar).\n2. **Müşterinin adı — dikkat: \"ship to\" adı.** Sipariş satırında iki isim görebilirsin: kullanıcı adı (Etsy hesap adı, \"William\") ve kargonun gideceği isim (\"Blake More\"). Baskıya ve pakete giden isim **ship to** ismidir.\n3. **Order numarası.**\n4. **Ürün bilgisi:** marka, beden, renk — \"Comfort Colors, medium, Pepper.\"\n\nYanına tasarımı yerleştirirsin: SKU koduyla Drive'dan bulunur (klasör sistemin — Ders 3.9 ve 4.6, tam burada hayat kurtarır).\n\n**Ölçü tablosu.** Tasarımın basılacağı boyut, Emin'in paylaştığı envanter dosyasının **design dimension** tablosundan alınır — bedene ve baskı yerine göre. Değerler: **cep boyu (pocket size) ~4-4,25 inç genişlik; ön yüz büyük baskı 11 inç; sırt 11,5 inç.** **Maksimum yükseklik bedene göre 14-14,5 inç** (small 14; medium 13,5-14; XL 15). Ve orantı kuralı burada da mutlaktır: 11 inç genişlik verdiğin tasarımın boyu 15,7'ye fırladıysa, **yüksekliği 14'e çekersin, genişliğin 9,8'e düşmesini kabul edersin**. Yoksa tasarım tişörte sığmaz, \"boydan uzun gelir, kötü görünür.\" Teselli de Emin'den: \"Bir hafta order hazırlayınca bu ölçüler ezberinizde olur; bakmanıza gerek kalmaz.\"\n\n**Baskı yeri notları.** Yazıcının başındaki insan senin notunla çalışır:\n\n- **Hiçbir not yazmazsan baskı ÖNE yapılır** — varsayılan budur.\n- Önlü arkalı tasarımda: \"**ön taraf**\" / \"**arka taraf**\".\n- Kol baskısında: \"**sol kol**\" / \"**sağ kol**\" (örnek: sırta \"Emin 10\", sol kola logo; öğrenci tasarımına notu: \"sağ kol dış — belirteceksin\").\n- Cep boyu tasarım not yazılmazsa **sola** basılır. Sağ istiyorsan yaz.\n- Ense, boyun, bel gibi standart dışı yerler **ayrıntılı tarif edilir** — gerekirse mockup üzerinde gösterilir. Standart türler bellidir: öne büyük; sırta uzunlamasına; öne cep + sırta büyük. Bunun dışına çıkıyorsan anlat.\n- Notlar **Türkçe yazılabilir** — sınıf sorusuna cevap: \"Baskıda çalışan herkes Türk; olmayanlar da öğrendi.\"\n\n**Çoklu sipariş işareti.** Aynı müşterinin iki ürünü varsa tasarımların yanına \"**2-1**\" ve \"**2-2**\" yaz ve yan yana koy. Neden? \"Günde 5.000 tişört basılan, dört-beş makinenin çalıştığı tesiste\" bu işaret, iki parçanın **birlikte paketlenmesini** sağlar — presteki kişi \"2-1'i gördüm, 2-2 nerede?\" diye arar. Erin Reyna'ya iki tişörtü tek pakette gider.\n\n**Son kontrol ve export.** Tasarımlar **birbirinin ve yazıların üstüne binmesin** — \"printer ne görürse onu basar\". 22,5 inç sınırı aşılmasın. Hepsini seç → sağ tık → **seçimi dışa aktar** → **4x PNG** (\"yüksek çözünürlük export etmem çok önemli\") → dosya adı tarih + mağaza: \"4 Mayıs Emin.png\" → üreticiye gönder. Üretici basar, keser, presler. Manuel sistemde bu dosya **her sabah** hazırlanır.\n\nİki kalite notu: baskı dosyasına tasarımı vektör de koyabilirsin PNG de (sınıf sorusu) — sonuç zaten 4x PNG export edilir. Vektör renk değiştirmede ve dosya boyutunda avantajlıdır. Pikselli tasarım gönderirsen üretici geri döner: \"Bu tasarımda pikselleşme var. Düzeltip tekrar gönderin\"; yazı tasarımın üstüne binmişse de aynı telefon gelir.\n\n**En sık yapılan hata ve sonucu.** Kullanıcı adını baskıya yazmak (yanlış isim!). Ölçüyü orantısız zorlamak (sığmayan baskı). Not yazmamak (arka tasarım öne basılır). Üst üste binen bloklar (yazı tişörtte). 1x export (baskıda kalite düşer). *(Videoda: Video 5, 54:02–54:26.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 28:02–44:25.*\n1. Dosya kurulumunun dört değeri: genişlik, yükseklik mantığı, renk modu, çözünürlük — ve gri dikdörtgen neden?\n2. Sipariş bloğunun dört satırını say. Hangi isim yazılır?\n3. Medium sırt baskısında 11,5 × 15,7 çıktı — ne yaparsın?\n4. \"2-1 / 2-2\" işareti hangi sorunu çözer?","video":5,"damga":"28:02","sn":1682},{"ders":"4.16","modul":4,"baslik":"Custom siparişleri hazırlamak","metin":"*Başvuru dersi — ilk custom siparişinde aç.*\n\n**Videoda:** Video 5, 44:36–52:38.\n\n**Neden bu ders var?** Etsy'nin ana mantığı kişiye özel üründür — ve custom sipariş, tasarımın her seferinde **senin elinle** düzenlendiği sipariştir. Hazır tasarımlı siparişte işin, tişört rengine göre beyaz ya da siyah sürümü seçmekten ibarettir (Ders 3.9'daki klasör sürümleri). Custom'da iş büyür.\n\n**Akış — Emin'in ekranından (custom mama shirt).** Müşteri personalization kutusuna çocuklarının isimlerini yazmış. Sen: Drive'dan ilanın tasarım dosyasını (LS023, Illustrator dosyası) indirirsin; **grubu çöz** (ungroup) dersin. İlandaki örnek isimleri müşterinin yazdıklarıyla değiştirirsin. Ve altın kural: **isimleri elle yazma, müşterinin kutuya yazdığından kopyala-yapıştır al.** \"Bir harfi yanlış yazarsan (Maverick yerine Moverick) müşteri anında mesaj atar: 'Adımı yanlış yazmışsın, iade istiyorum.'\" Sonra renk kararı: tişört **Heather Maroon** (bordo). Yazılar **beyaz** olur. Müşteri beyaz tişört alsaydı yazılar siyah olurdu. (İlanda personalization'la renk sorulmamışsa karar senindir: \"Kadın müşteride genellikle beyaz/açık tasarım daha iyi oluyor.\") Hizala, ortala; baskı dosyasındaki bloğuna yerleştir (Ders 4.15).\n\n**İlan tarafını doğru kurarsan sipariş kolaylaşır.** İki ekran örneği:\n\n- **The Bride / The Coven** (bekarlığa veda ilanı): açıklamada nelerin değiştirilebileceği yazılmış — isim, konum, yazı rengi. Müşteri kutuya talimatını yazmış: \"Jennifer'ın doğum günü için; location yazma; coven yaz.\" Sen tasarımı bu talimatla sıfırdan düzenlersin. İlan \"neyi değiştirebilirsin\" demeseydi bu sipariş üç mesajlık trafik olurdu.\n- **\"Colorful\" notu:** ilan, tasarımın üç sürümünü önden sunmuş (altın, renkli, siyah) ve \"hangisini istersin, yaz\" demiş. Müşteri tek kelime yazmış: \"colorful.\" Sipariş, soru sorulmadan hazır. **Seçenekleri önceden sunmak, siparişi kolaylaştırır.**\n\n**Eksik bilgi kuralı.** Baseball mom ilanı isim + forma numarası istiyor. Müşteri kutuya yalnızca \"**8**\" yazmış. Yeni yönetici müşteriye sorar ve bekletir. **Tecrübeli yönetici sormaz:** isim alanını boş bırakır, 8'i basar, gönderir. Mantığı: \"Müşteri isim yazılsın isteseydi yazardı. İtiraz ederse: 'Ben senden isim ve numara istedim mi? Evet. Sen bana isim gönderdin mi? Hayır. Ben oraya ne yazayım?' — hak iddia edersin.\" Kural kısaca: **müşteri ne gönderdiyse o; boş alan boş kalır.** (Bunlar \"üst üste koya koya öğrenilen\" tecrübeler, ilk vakalarında eğitmenine danışmak ayıp değil, yöntemdir.)\n\n**En sık yapılan hata ve sonucu.** Elle isim yazmak (tek harf = iade talebi + yeniden basım). Tişört rengine bakmadan sürüm göndermek (bordo tişörte siyah yazı — görünmez). Eksik bilgide müşteriyi soru yağmuruna tutmak (sipariş bekler, ship by date yaklaşır, Ders 4.9'daki etiket tuzağına zemin). *(Videoda: Video 5, 46:20–46:33.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 44:36–52:38.*\n1. Custom akışının beş adımını say: indir → çöz → değiştir (nasıl?) → renk → yerleştir.\n2. Jennifer/coven ve \"colorful\" örneklerinden çıkan ilan-tasarımı dersi ne?\n3. \"8\" vakasında tecrübeli yöneticinin yaptığını ve gerekçesini anlat.","video":5,"damga":"44:36","sn":2676},{"ders":"5.1","modul":5,"baslik":"Mesaj kutusu: spam ayıklama ve düzen","metin":"**Videoda:** Video 3, 1:03:52–1:05:14.\n\n**Neden bu ders var?** Çünkü mağaza açılır açılmaz ilk gelen mesajlar müşteriden değil, dolandırıcıdan gelir — ve ilk günün acemiliğiyle atılan bir tık pahalıya mal olabilir.\n\n**Spam deseni.** Emin'in uyarısı: \"Mağazayı açar açmaz üç-dört spam mesaj alacaksınız.\" Kalıbı hep aynıdır: \"Merhaba [mağaza sahibi], mağazan bir sipariş aldı ama işlemle ilgili bir problem var — aşağıdaki linke tıklayıp mağazanı onaylamak için bize yetki ver.\" Daha ortada hiçbir sipariş yokken! İki kontrol kuralı: (1) **Etsy senden panel mesajıyla asla bir şey istemez**. Ne onay, ne yetki, ne link tıklama. (2) Etsy seninle **mağazayı açtığın e-posta** üzerinden iletişim kurar. Gelen e-postanın gönderici adresi **etsy.com** ile bitmelidir: Emin ekranda sahte örneğini gösteriyor: iCloud adresinden gönderilmiş \"Etsy\" maili. Karar: bu mesajları **spam olarak işaretle ve geç**. Cevap da yazma, linke de tıklama.\n\n**Kutunun düzeni.** Messages'ta gönderilenler, okunmamışlar ve spam'in yanında kendi **etiketlerini** (labels) kurarsın: \"geri gelecek\", \"hatalı\", \"kayıp\" gibi. Modül 4'ten hatırla: büyüyen mağazada mesajları bir kişi ayıklar, sorunlularla başka biri ilgilenir — etiket sistemi o iş bölümünün altyapısıdır. Tek kişiyken bile işe yarar: sorunlu konuşmayı etiketle, hiçbir şikayet kalabalıkta kaybolmasın.\n\n**En sık yapılan hata ve sonucu.** \"Siparişim mi varmış?\" heyecanıyla linke tıklamak — hesap bilgilerini dolandırıcıya teslim etmenin ilk adımı. İkincisi: spam'i işaretlemeden silmek. İşaretlersen sistem benzerlerini tanır. *(Videoda: Video 3, 1:03:52–1:05:14.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 1:03:52–1:05:14.*\n1. Spam mesajın klasik senaryosu ne ve onu ele veren iki kontrol hangisi?\n2. Etsy seninle hangi kanaldan iletişim kurar?\n3. Etiketler tek kişilik mağazada ne işe yarar?","video":3,"damga":"1:03:52","sn":3832},{"ders":"5.2","modul":5,"baslik":"Müşteriyle yazışma sanatı: hız, isim, birinci tekil şahıs","metin":"**Videoda:** Video 3, 1:05:14–1:12:59.\n\n**Neden bu ders var?** Çünkü mesaj kutusu, mağazanın yüzüdür: satış çoğu zaman üç dakikalık bir cevapla kazanılır — ve tek bir \"üreticime sorayım\" cümlesiyle kaybedilir.\n\n**Hız.** Kural: **üç-beş dakika içinde cevap ver.** İki gerekçe: Star Seller'ın 24 saat ölçüsü böylece hiç zorlanmaz (Ders 4.11: \"12 saati geçirmeyin\" bile tedbirli hali) ve asıl önemlisi — geciken cevabın müşterisi başka mağazadan alır. Sipariş, en hızlı dükkanındır.\n\n**Üslup.** \"Merhaba Lori\" — isimle ve **baş harfi büyük** yazarak başla. Teşekkürle bitir. Bir-iki emoji, bir kalp serbest. Hatta iyi: müşterilerin çoğu kadın ve bu samimi dili seviyor; kuru \"teşekkür ederiz. nokta\" mesajından çok daha iyi çalışıyor. Kurumsal dil yok (o rezaletin örneği Ders 5.5'te).\n\n**Teyit ve örnek gönderme — custom akışı.** Müşteri istek yazdı. İlk işin **doğru anladığını teyit etmek**: \"Merhaba Lori, mesajın için teşekkür ederim! Tişörtün üzerine 'Lori Evans' yazmamı istediğini anlıyorum, doğru mu? Hangi yazı tipi ve renkle isteyeceksin?\" Müşteri belirtirse (Times New Roman, 20 punto gibi) uygularsın; \"fikrim yok, bir örnek yapar mısın?\" derse Canva ya da Illustrator'da mockup üzerinde hızlıca örneği kurar, **ekran görüntüsünü** gönderirsin. Onay gelirse baskıya. \"L büyük olsun, a küçük\" gibi revizyon gelirse düzeltir yeniden gönderirsin. Baskı, **onaydan sonra** başlar.\n\n**Birinci tekil şahıs — kursun demir kuralı.** Asla: \"Ben bunu bir yerden göndertiyorum, üreticiye sorayım\", \"Emin diye bir arkadaş var, ona danışıp döneceğim.\" Her zaman: **\"Hemen çalışıp sana dönüş yapacağım.\" \"Ben hazırlıyorum, ben gönderiyorum.\"** Müşteri, işin sahibi ve profesyoneliyle çalışmak ister. O sensin. Arka planda elbette üreticiye danışırsın (Ders 5.3'te bunun protokolü var). Ama müşterinin gördüğü sahnede tek kişi vardır.\n\n**Emin'in ekranından gerçek bir yazışma — bridal party.** Müşteri military green tişörtlerle ilgileniyor. Bekarlığa veda grubu için soruyor. Yazışmanın içinde bir hassasiyet dönemeci var: tasarımdaki çizmelerin içinden görünen bacaklar açık tenli. Müşteri siyahi; \"koyu kahverengi bacak yapar mısınız?\" Mağaza tasarımı düzenleyip **kahverengi bacaklı örneği** gönderiyor. Cevap: **\"This is perfect.\"** Müşteri üç gün sonra dönüp özür diliyor. \"kocam hastanedeydi, geç cevap verdim\" (gerçek insanlar, gerçek hayatlar, sabırlı ol).\n\nGrup siparişine dönüşüyor: herkes ayrı sipariş verecek. Mağazanın talimatı net: \"Kişiselleştirme kutusuna 'Let's Go, Girls (brown)' yaz — brown'ı görünce bacakları kahverengi yapacağımı anlarım.\" Araya İngilizce pratik bilgisi de giriyor: müşterinin \"lol\"u bir gülme ifadesidir. Bu yazışmadaki her hamle ders: teyit, örnek, hassasiyete saygı, net talimat, sabır.\n\n**Destek altyapın.** İlk haftalarda mesajlara cevap yazarken yalnız değilsin: Emin'in düzeni, örnek yazışmaların Telegram grubunda paylaşılması — \"bir müşteri şöyle yazdı, ne diyeyim?\" diye sorarsın, cevap şablonu gelir, herkes birbirinin vakasından öğrenir. Ekler'deki şablonlar (Ek D) da bu amaçla hazırlandı.\n\n**En sık yapılan hata ve sonucu.** Geç cevap (müşteri rakibe gitti). Teyitsiz baskı (yanlış isim, yanlış renk — iade). Üreticiyi anmak (profesyonellik bitti). Onay almadan basmak (\"ben öyle istememiştim\" mesajı). *(Videoda: Video 3, 1:05:14–1:12:59.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 1:05:14–1:12:59.*\n1. Hız kuralı ne ve iki gerekçesi hangileri?\n2. Custom akışının dört adımını say: teyit → soru → örnek → onay.\n3. Bridal party yazışmasından üç ders çıkar.","video":3,"damga":"1:05:14","sn":3914},{"ders":"5.3","modul":5,"baslik":"Şikayet yönetimi: hata kimdeyse zararı o öder","metin":"**Videoda:** Video 3, 1:13:09–1:17:07.\
