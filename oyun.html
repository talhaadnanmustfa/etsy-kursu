<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Etsy Satıcı Eğitimi — Oyun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F4;   --surface:#FFFFFF;  --rail:#F4EEE6;   --line:#E7DFD4;
  --ink:#241F1B;  --ink-2:#6B6058;    --accent:#B4451F; --accent-soft:#FBEDE4;
  --warn:#8E2C22; --warn-soft:#FBEAE5;--note:#8A6A1F;   --note-soft:#FAF1DC;
  --film:#1C1714;
  --ok:#5F7A4E;   --ok-soft:#EDF1E6;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Karla", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.25; margin:0}
p{margin:0 0 14px}
button{font-family:inherit; font-size:inherit; cursor:pointer}
a{color:var(--accent)}

/* ---------- dar ekran ---------- */
#dar{display:none; min-height:100vh; align-items:center; justify-content:center; padding:40px; text-align:center}
#dar .kutu{max-width:420px}
#dar h1{font-size:26px; margin-bottom:12px}
#dar p{color:var(--ink-2)}
@media (max-width:1279px){
  #dar{display:flex}
  #uygulama{display:none !important}
}

/* ---------- iskelet ---------- */
#uygulama{max-width:1240px; margin:0 auto; padding:0 24px 80px}
.ust{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 0 18px; border-bottom:1px solid var(--line); margin-bottom:28px;
}
.marka{font-family:var(--serif); font-size:17px; letter-spacing:.01em}
.marka b{font-weight:600}
.marka span{color:var(--ink-2); font-family:var(--sans); font-size:14px; margin-left:10px}
.ust-sag{display:flex; align-items:center; gap:6px}
.baglanti{
  background:none; border:0; color:var(--ink-2); font-size:14px;
  padding:6px 10px; border-radius:6px;
}
.baglanti:hover{background:var(--rail); color:var(--ink)}
.baglanti[disabled]{opacity:.35; cursor:default}
.baglanti[disabled]:hover{background:none; color:var(--ink-2)}
.baglanti.sonuk{color:#9A9188; font-size:13px}

.ekran{display:none}
.ekran.acik{display:block}

/* ---------- düğmeler ---------- */
.dugme{
  background:var(--accent); color:#fff; border:0; border-radius:8px;
  padding:12px 26px; font-weight:500; letter-spacing:.01em;
}
.dugme:hover{background:#9C3B1A}
.dugme.ikincil{background:none; color:var(--ink-2); border:1px solid var(--line)}
.dugme.ikincil:hover{background:var(--rail); color:var(--ink)}
.dugme.kucuk{padding:8px 16px; font-size:15px}

/* ---------- kapak ---------- */
.kapak{padding:56px 0 40px; max-width:720px}
.kapak h1{font-size:44px; line-height:1.15; margin-bottom:18px}
.kapak .alt{font-size:19px; color:var(--ink-2); margin-bottom:34px; max-width:560px}
.harita{
  border:1px solid var(--line); border-radius:12px; background:var(--surface);
  padding:6px 0; margin:0 0 34px;
}
.harita-satir{
  display:flex; align-items:center; gap:14px; padding:11px 20px;
  border-bottom:1px solid var(--line); font-size:16px;
}
.harita-satir:last-child{border-bottom:0}
.harita-satir .im{
  width:22px; height:22px; border-radius:50%; flex:0 0 22px;
  border:1.5px solid var(--line); display:flex; align-items:center;
  justify-content:center; font-size:12px; color:var(--ink-2);
}
.harita-satir.bitti .im{background:var(--ok); border-color:var(--ok); color:#fff}
.harita-satir.simdi{background:var(--accent-soft)}
.harita-satir.simdi .im{border-color:var(--accent); color:var(--accent)}
.harita-satir .ad{flex:1}
.harita-satir .not{color:var(--ink-2); font-size:14px}
.kapak-alt{color:var(--ink-2); font-size:14px; margin-top:26px; max-width:560px}

/* ---------- küpe çubuğu ---------- */
.kupe-serit{display:flex; gap:10px; margin-bottom:30px; align-items:flex-start}
.kupe{flex:1 1 0; min-width:0}
.kupe .kutu{
  height:26px; border:1px solid var(--line); border-radius:5px;
  background:var(--surface); display:flex; overflow:hidden;
}
.kupe .dilim{flex:1; border-right:1px solid var(--line); background:transparent}
.kupe .dilim:last-child{border-right:0}
.kupe .dilim.dolu{background:var(--accent)}
.kupe.tam .kutu{border-color:var(--ok)}
.kupe.tam .dilim.dolu{background:var(--ok)}
.kupe .ad{
  font-size:12px; color:var(--ink-2); margin-top:7px; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.kupe.tam .ad{color:var(--ok)}
.kupe.aktif .ad{color:var(--ink); font-weight:600}
.kupe-serit.yogun{gap:5px}
.kupe-serit.yogun .kupe .kutu{height:18px}
.kupe-serit.yogun .kupe .ad{display:none}

/* ---------- oyun odası ---------- */
.oyun-govde{display:grid; grid-template-columns:200px minmax(540px,1fr) 372px; gap:34px; align-items:start}
.sus{height:420px; border-radius:12px}
.sus.var{
  background:var(--rail); background-size:cover;
  background-position:center; opacity:.5;
}
.sayac-yol{height:3px; background:var(--rail); border-radius:2px; overflow:hidden; margin-bottom:26px}
.sayac-bar{height:100%; width:100%; background:var(--accent); transition:width .1s linear}
.sayac-bar.acele{background:var(--warn)}
.soru{font-family:var(--serif); font-size:26px; line-height:1.4; margin-bottom:26px}
.siklar{display:flex; flex-direction:column; gap:10px}
.sik{
  display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:15px 18px; color:var(--ink); line-height:1.5;
}
.sik:hover{border-color:#D6CABA}
.sik .harf{
  flex:0 0 24px; height:24px; border-radius:5px; background:var(--rail);
  color:var(--ink-2); font-size:13px; font-weight:600; display:flex;
  align-items:center; justify-content:center; margin-top:1px;
}
.sik[disabled]{cursor:default}
.sik[disabled]:hover{border-color:var(--line)}
.sik.secili{background:var(--film); border-color:var(--film); color:#F7F2EC}
.sik.secili .harf{background:rgba(255,255,255,.16); color:#F7F2EC}
.sik.dogru{border-color:var(--ok); background:var(--ok-soft)}
.sik.dogru .harf{background:var(--ok); color:#fff}
.sik.secili.dogru{background:var(--ok); border-color:var(--ok); color:#fff}
.sik.secili.dogru .harf{background:rgba(255,255,255,.2); color:#fff}
.panel{
  border:1px solid var(--line); border-radius:12px; background:var(--surface);
  padding:22px; min-height:300px; box-shadow:0 1px 2px rgba(36,31,27,.04);
}
.panel.bos{background:var(--rail); border-color:var(--rail); box-shadow:none;
  display:flex; align-items:center; justify-content:center}
.panel.bos span{color:var(--ink-2); opacity:.7; font-size:15px;
  text-align:center; max-width:20ch; line-height:1.65}
.panel .etiket{
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); margin-bottom:10px;
}
.panel h4{font-size:17px; margin-bottom:8px}
.panel p{font-size:16px; line-height:1.65}
.panel .neden{
  background:var(--warn-soft); border-radius:8px; padding:13px 15px;
  margin-bottom:16px; font-size:15px; line-height:1.6;
}
.panel .neden .etiket{color:var(--warn); margin-bottom:5px}
.panel .kaynak{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  font-size:13px; color:var(--ink-2);
}
.panel .devam{margin-top:18px}
.ipucu{font-size:13px; color:#9A9188; margin-top:10px}

/* ---------- oyun sonu ---------- */
.orta{max-width:680px}
.orta h2{font-size:30px; margin-bottom:14px}
.orta .alt{color:var(--ink-2); margin-bottom:28px}
.liste{
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  padding:6px 0; margin-bottom:28px;
}
.liste .sat{padding:11px 18px; border-bottom:1px solid var(--line); font-size:16px}
.liste .sat:last-child{border-bottom:0}
.liste .sat .kucuk{color:var(--ink-2); font-size:14px; display:block}
.bolum-baslik{
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); margin:0 0 10px;
}

/* ---------- sınav odası ---------- */
.sinav{max-width:780px; margin:0 auto}
.sinav-ust{
  display:flex; align-items:baseline; justify-content:space-between;
  padding-bottom:16px; margin-bottom:34px; border-bottom:1px solid var(--line);
}
.sinav-ust .baslik{font-family:var(--serif); font-size:18px}
.sinav-ust .sayac{font-size:16px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.sinav-ust .sayac.acele{color:var(--warn)}
.sinav .ilerleme{font-size:13px; color:#9A9188; margin-bottom:20px}
.sinav .soru{font-size:24px; margin-bottom:24px}
.sinav .sik{box-shadow:none}
.sinav .sik.secili{background:var(--film); border-color:var(--film); color:#F7F2EC}
.sinav-alt{margin-top:26px; display:flex; align-items:center; gap:16px}

/* ---------- sonuç ---------- */
.puan{font-family:var(--serif); font-size:56px; line-height:1; margin-bottom:6px}
.puan small{font-size:24px; color:var(--ink-2)}
.durum{font-size:17px; margin-bottom:28px}
.durum.gecti{color:var(--ok)}
.durum.kaldi{color:var(--warn)}
.kutucuk{
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  padding:20px 22px; margin-bottom:22px;
}
.kutucuk.uyari{background:var(--note-soft); border-color:#EEDFB8}
.kutucuk h4{font-size:16px; margin-bottom:10px}
.kural-sat{
  padding:9px 0; border-bottom:1px solid var(--line); font-size:16px;
  display:flex; gap:12px; align-items:baseline;
}
.kural-sat:last-child{border-bottom:0}
.kural-sat .metin{flex:1}
.dk{
  background:var(--accent-soft); color:var(--accent); border:0; border-radius:5px;
  padding:3px 9px; font-size:13px; white-space:nowrap; text-decoration:none;
  display:inline-block;
}
.dk:hover{background:#F6DECF}
.ders-metin{
  font-size:16px; line-height:1.75; border-top:1px solid var(--line);
  margin-top:14px; padding-top:14px;
}
.ders-metin h5{font-family:var(--serif); font-size:17px; margin:0 0 8px}
.ders-metin p{margin:0 0 12px}
.ders-metin ul,.ders-metin ol{margin:0 0 12px; padding-left:22px}
.ders-metin li{margin-bottom:5px}
.ders-metin strong{font-weight:600}
.ders-metin em{color:var(--ink-2)}
.ders-metin table{border-collapse:collapse; width:100%; margin:0 0 12px; font-size:15px}
.ders-metin th,.ders-metin td{border:1px solid var(--line); padding:7px 10px; text-align:left}
.ders-metin th{background:var(--rail); font-weight:600}
.katla{margin-bottom:14px}
.katla > summary{
  cursor:pointer; font-size:15px; color:var(--accent); list-style:none;
  padding:8px 0;
}
.katla > summary::-webkit-details-marker{display:none}
.katla > summary::before{content:"› "; }
.katla[open] > summary::before{content:"⌄ "; }

/* ---------- kural sayfası ---------- */
.kurallar-sayfa{max-width:840px}
.kural-modul{margin-bottom:34px}
.kural-modul > h3{font-size:22px; margin-bottom:4px}
.kural-modul .mad{color:var(--ink-2); font-size:14px; margin-bottom:16px}
.kural-kupe{margin-bottom:18px}
.kural-kupe h4{font-size:15px; margin-bottom:4px; color:var(--ink)}
.kural-kupe ul{margin:0; padding-left:20px}
.kural-kupe li{margin-bottom:5px; font-size:16px; line-height:1.6}

/* ---------- yazdırma ---------- */
@media print{
  @page{margin:18mm}
  /* kagit genisligi 1280px'in altinda kaldigi icin dar ekran uyarisi
     yazdirmaya da giriyordu; yazdirmada o kapi kapali olmali */
  #dar{display:none !important}
  #uygulama{display:block !important}
  body{background:#fff; font-size:11pt; line-height:1.5}
  .ust,.ekran:not(.acik),.dugme,.baglanti,.dk,.yazdirma-gizle{display:none !important}
  #uygulama{max-width:none; padding:0}
  .kurallar-sayfa{max-width:none}
  .kural-modul{break-inside:avoid; margin-bottom:18px}
  .kural-kupe{break-inside:avoid}
  a{color:#000; text-decoration:none}
}

/* ---------- onay ---------- */
.perde{
  position:fixed; inset:0; background:rgba(28,23,20,.42);
  display:flex; align-items:center; justify-content:center; z-index:50;
}
.perde .kart{
  background:var(--surface); border-radius:12px; padding:28px 30px;
  max-width:420px; box-shadow:0 12px 40px rgba(36,31,27,.18);
}
.perde h4{font-size:19px; margin-bottom:10px}
.perde p{color:var(--ink-2); font-size:16px}
.perde .sira{display:flex; gap:10px; margin-top:20px}
</style>
</head>
<body>

<div id="dar">
  <div class="kutu">
    <h1>Bu kursu bilgisayardan aç</h1>
    <p>Oyun dizüstü ekranı için tasarlandı. Telefonda ve dar ekranda açılmıyor.

  </div>
</div>

  <div class="ekran" id="ekSonuc"></div>
  <div class="ekran" id="ekKurallar"></div>
  <div class="ekran" id="ekEmin"></div>
  <div class="ekran" id="ekUcKayip"></div>
  <div class="ekran" id="ekBitis"></div>
</div>

ketin nereye bırakıldığı müşteriye bildirilir.","video":4,"damga":"19:22","sn":1162},{"id":"k101","kupe":"m5k4","modul":5,"ders":"5.3","satir":"Çözülmezse müşteriden Etsy'de case açması istenir.","video":4,"damga":"32:15","sn":1935},{"id":"k102","kupe":"m5k5","modul":5,"ders":"5.4","satir":"Custom istekler yeni bir listing fikridir; istek geldiği konudan ilan açılır.","video":3,"damga":"1:19:25","sn":4765},{"id":"k103","kupe":"m5k5","modul":5,"ders":"5.4","satir":"Müşteri \"feral mama\" yerine \"feral wife\" istediyse o konudan da listing açılır.","video":3,"damga":"1:21:00","sn":4860},{"id":"k104","kupe":"m5k6","modul":5,"ders":"5.5","satir":"Teslimattan sonra müşteriye kısa bir yorum ricası mesajı atılır.","video":3,"damga":"1:24:07","sn":5047},{"id":"k105","kupe":"m5k6","modul":5,"ders":"5.5","satir":"İlk siparişlerde fotoğraflı beş yıldızlı yorum almak mağazanın önünü açar.","video":3,"damga":"1:24:57","sn":5097},{"id":"k106","kupe":"m5k6","modul":5,"ders":"5.5","satir":"Share and Save linkinden gelen siparişte Etsy processing fee'yi almaz.","video":3,"damga":"1:27:09","sn":5229}],"dersler":[{"ders":"1.1","modul":1,"baslik":"Etsy bir AVM'dir, sen kiracısın","metin":"**Videoda:** Video 1, 1:34–7:17.\n\n**Neden bu ders var?** Çünkü kursun geri kalanındaki her kural (kargola, cevap ver, marka ismi kullanma, bilgilerin tutarlı olsun) tek bir mantıktan türer. O mantığı kavrarsan kuralları ezberlemen gerekmez. Kendin türetirsin.\n\n**Mantık.** Etsy, internet üzerinde bir pazar yeridir: kendi web siten değil, içinde milyonlarca satıcının dükkan açtığı dev bir satış sitesi. Emin'in bütün kursu üzerine kurduğu benzetme şu: **kendini bir AVM sahibi olarak düşün.** AVM'nin içinde bir sürü mağaza var; sahibi, mağazaların çok satmasını ister, çünkü her satıştan pay alır — ama asıl koruduğu şey AVM'nin müşterisidir. Tek bir kötü dükkan müşteriyi kaçırır. Etsy de aynen böyledir: sana dükkan kiralar, kurallarını yazılı olarak önüne koyar ve \"müşterimi kaçıran satıcıyı kapatırım\" mantığıyla bakar. Sen orada **kiracısın, ev sahibi değilsin**: \"Etsy kapatır\" cümlesini bu programda çok duyacaksın ve bu bir korkutmaca değil, işin gerçeğidir.\n\nMüşteri kaçıran davranışlar bellidir ve hepsi bu kursta kendi dersini bulacak: siparişleri zamanında kargolamamak, mesajlara düzenli cevap vermemek, kalitesiz ürün gönderip bir yıldızlı yorumlar toplamak ve marka haklarını (trademark) çiğnemek. İlerleyen modüllerde buna iki madde daha ekleyeceğiz: tutarsız kimlik-banka bilgisi (Modül 2) ve kargo etiketi alınıp bekletilen siparişler (Modül 4).\n\n**Nasıl yapılır?** Bu dersin tek görevi okumaktır: Etsy'nin yazılı kuralları **policies** (politikalar) adıyla yayımlanır. Emin bu metinleri gruba atacağını söylüyor ve tavsiyesi net: hepsini bir oturuşta değil, **peyder pey** oku; İngilizcesini anlamadığın yerde Türkçeye çevir. Politikaların özeti Emin'in ağzından şöyle: \"Mağazan güzel bir mağaza olacak, müşterilerimi memnun edecek, benim istediğim standartları karşılayacak, bir de hak hukuk konularına dikkat edecek.\"\n\n**Emin'in örneği.** Hak hukuk ne demek, AVM'den anlatıyor: AVM'deki hiçbir mağazada orijinal olmayan ürün satılamaz. Adidas'a, Nike'a, Apple mağazasına girdiğinde orijinal, kutulu, tertemiz ürünler görürsün. Etsy de kendi çarşısında aynı düzeni ister — ama bir farkla ki o fark bir sonraki dersin konusu.\n\n**En sık yapılan hata ve sonucu.** Kuralları \"nasıl olsa alışırım\" diye hiç okumamak. Sonuç: satıcı ilk ihlalini bilmeden yapar ve Modül 3'te göreceğin gibi Etsy, bilinen konularda \"bilmiyordum\" savunmasını kabul etmez. *(Videoda: Video 1, 1:34–7:17.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 1:34–7:17.*\n1. AVM benzetmesinde Etsy kim, sen kimsin, müşteri kimin müşterisi?\n2. Müşteri kaçıran dört davranışı say. Bu listeye sonraki modüllerde eklenecek iki maddeyi tahmin edebilir misin?\n3. Etsy'nin yazılı kurallarının adı ne ve Emin bunları nasıl okumanı istiyor?","video":1,"damga":"1:34","sn":94},{"ders":"1.2","modul":1,"baslik":"Ne satılır, ne satılmaz","metin":"**Videoda:** Video 1, 3:10–13:43.\n\n**Neden bu ders var?** Çünkü Etsy'yi Amazon'dan ayıran çizgi burasıdır ve bu çizgiyi bilmeyen satıcı, daha ilk ilanında mağazasını riske atar.\n\n**Mantık.** Amazon'da tanınmış bir markanın orijinal ürününü satabilirsin: Emin'in örneğiyle, en bilindik makyaj malzemesini toptancıdan alırsın, Amazon senden faturasını ister, gönderirsin, listelenirsin. **Etsy böyle bir şey istemez.** Etsy'de sattığın ürün **senin el emeğinden veya kişiselleştirmenden** geçmiş olmalıdır. Gildan marka boş bir tişörtü olduğu gibi satamazsın — üzerine bir tasarım basarsan satarsın. Boş bir telefon kılıfı satılmaz. Müşterinin köpeğinin fotoğrafını kılıfa basıyorsan satılır: müşteri fotoğrafı gönderir, sen kılıfa bastırır gönderirsin.\n\nSatılabilenler üç gruptur:\n\n**Physical item** (fiziksel ürün): kargoyla giden, el emeği veya kişiselleştirme içeren her şey — tişört, bardak, kolye, elle yapılmış resim, üzerine isim yazılan her şey. Kursun konusu bu gruptur.\n\n**Digital download** (dijital ürün): dosya olarak satılan tasarımlar. Emin'in örneği düğün davetiyesi: tasarımcı, düzenlenebilir bir davetiye şablonu hazırlayıp koyar; müşteri satın alınca kendisine bir link gelir (çoğunlukla Canva ya da Google Drive), müşteri şablona kendi ismini ve tarihini yazar, ister evinde ister matbaada bastırır. Türkiye'deki \"davetçiye gidip taslak seçme\" işinin online hali.\n\n**Supply** (ara malzeme): el yapımı ürün üretiminde kullanılan malzemeler — boncuk, parça, yarı mamul. Emin'in örneği, Kapalıçarşı'dan kargolayan bir tedarikçi: sattığı boncuklar kişiselleştirilmiş değildir ama alıcılar onlardan küpe, yüzük, kolye yapar. Supply satmak için **üretici ya da tedarikçi olduğunu beyan etmen** gerekir. El işçiliği şartının tek istisnası budur.\n\nVe kesin yasak: **tescilli isim** (trademark) kullanmak. Tişörte \"Adidas\" yazamazsın, kılıfa \"Apple\" yazamazsın, \"Harry Potter\" tasarımı satamazsın. Bu konunun cezaları ve yasak listesi Modül 3'te, kontrol yöntemi Modül 5'te ayrıntılı işlenecek. Şimdilik çizgiyi bil.\n\n**Emin'in örneği.** Videoda canlı gösteriyor: yeni bir mağaza \"Hogwarts\" yazan bir ilan açmış, tasarımı 1 dolardan satıyor ve 9 satış almış. Emin'in yorumu anında geliyor: \"Bu listing yakın bir süre sonra kapanacak — hatta mağaza da kapanabilir. Hogwarts trademark'lı bir kelime. Bu kişi bilmiyor. Bilmediği için yapıyor.\" Ders: Etsy bilmemeyi mazeret saymaz.\n\n**En sık yapılan hata ve sonucu.** \"Orijinalini satıyorum, faturam da var\" diye markalı ürün listelemek — Amazon mantığını Etsy'ye taşımak. Sonuç: ilan kapanır; ısrarda mağaza gider. İkinci hata: boş (baskısız) ürünü \"nasılsa tişört satıyorum\" diye listelemek. El emeği şartına takılır. *(Videoda: Video 1, 3:10–13:43.)*\n\n**Gerçek bir öğrenciden.** Sözlü kontrolde bir öğrenci, boş Gildan tişörtün neden satılamadığını \"çünkü Gildan tescilli bir marka\" diye açıkladı. Kulağa mantıklı geliyor ama sebep o değil: boş tişört, **el emeği/kişiselleştirme şartına** takıldığı için satılamaz — üzerine tasarım basıldığı an aynı Gildan tişört satılır hale gelir. Trademark ayrı bir yasaktır ve tişörtün *üzerine* tescilli bir isim basarsan devreye girer. İki kuralı birbirinin yerine koyma. *(Videodaki yeri: Video 1, 4:46–5:43.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 3:10–13:43.*\n1. Boş Gildan tişört, üzerine köpek fotoğrafı basılmış kılıf, \"Hogwarts\" tişörtü, düzenlenebilir davetiye şablonu, Kapalıçarşı boncuğu — beşi için ayrı ayrı: satılır mı, hangi grupta, neden?\n2. Amazon ile Etsy'nin markalı ürün konusundaki farkını bir cümleyle söyle.\n3. Supply satmanın ön şartı ne?\n4. Bir arkadaşın \"boş Gildan satılmaz, çünkü Gildan tescilli\" dedi. Nerede haklı, nerede haksız?","video":1,"damga":"3:10","sn":190},{"ders":"1.3","modul":1,"baslik":"Önce müşteri ol: uygulama, arama ve filtreler","metin":"**Videoda:** Video 1, 7:41–18:21.\n\n**Neden bu ders var?** Emin'in \"birinci not\" dediği kural buradadır: müşterilerin yaklaşık **yüzde 80'i Etsy'yi telefondan kullanıyor.** Sen satıcı olacaksın ama müşterinin ne gördüğünü bilmiyorsun — ve müşterinin gördüğünü bilmeyen satıcı, ilan hazırlayamaz.\n\n**Mantık.** Emin bunu Amazon kıyasıyla anlatıyor: Amazon'dan herkes alışveriş yapmıştır. Yorumların nerede olduğunu, ürüne nasıl bakacağını herkes bilir. Peki Amazon'un **satıcı panelini** hayal edebilir misin? Hayır — çünkü hiç görmedin. Etsy'de durum tam tersidir: Türkiye'de neredeyse kimse Etsy'yi müşteri olarak bile kullanmamıştır. Müşteri gibi gezmeden fotoğrafların, başlığın, seçeneklerin müşteriye nasıl göründüğünü anlayamazsın.\n\n**Nasıl yapılır?**\n\n1. Telefonuna **Etsy uygulamasını indir** ve her gün gez. (Bu aynı zamanda Modül 2'de göreceğin \"Etsy seni tanısın\" hazırlığının ilk adımıdır.)\n2. Arama kutusuna müşterinin yazacağı gibi yaz — Emin'in örneği \"Harry Potter shirt\" araması. Karşına çıkan her fotoğraf bir **listing**'tir, yani tek bir ürün ilanı. Bazı görsellerin üzerine gelince video oynar. Videolu ilanların köşesinde oynatma işareti görürsün.\n3. **Filtreleri** tek tek dene ve her birinde kendine sor: \"Ben müşteri olsam bunu işaretler miydim?\" Filtreler şunlar: **ships from** (nereden kargolanıyor — Almanya'da yaşayan müşteri Almanya'dan kargolayan satıcıyı süzebilir), **free shipping** (ücretsiz kargo) ve **personalized/customizable** (kişiselleştirilebilir, \"kızımın ismini yazdıracağım\" diyen müşteri bunu işaretler). Devamında fiyat aralığı, **physical item / digital download** ayrımı ve **Star Seller** (yalnız yüksek standartlı mağazaları göster). Sonra \"show results\". Müşterinin önem verdiği filtreler, senin ilanında bulunması gereken özelliklerdir.\n4. Sonuç sayfasında iki tür ilan gördüğünü fark et: en üstte **\"Ad by seller\"** yazanlar reklamla gelir. Altında mağaza adı yazanlar **organic** gelir — Google'daki gibi: önce reklamlar, sonra doğal sıralama. Bir de bazı ilanlarda **Etsy's Pick** etiketi görürsün. Emin'in açıklamasıyla bu, son 8-10 saat içinde 10'dan fazla sipariş almış, hızla satan ürünlere Etsy'nin verdiği işarettir.\n\n**Emin'in örneği.** Filtre denemesini canlı yapıyor: Almanya + kişiselleştirilebilir + Star Seller filtreleriyle arama 4-8 sonuca düşüyor. Filtreleri kaldırınca liste yeniden doluyor. Ders şu: her filtre pazarı daraltır ve bazı müşteriler gerçekten böyle daraltılmış listelerden alışveriş yapar — senin ilanın o listelerde kalabilmelidir.\n\n**En sık yapılan hata ve sonucu.** Uygulamayı hiç indirmeden, birkaç masaüstü aramasıyla \"anladım\" sanmak. Sonuç: kare görsel kuralından personalization kutusuna kadar bu kursta öğreneceğin şeylerin çoğunun *sebebini* görmemiş olursun; sebebini görmediğin kuralı da ilk yoğun haftada unutursun. *(Videoda: Video 1, 7:41–18:21.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 7:41–18:21.*\n1. Müşterilerin yüzde kaçı telefondan giriyor ve bu senin ilk işini nasıl belirliyor?\n2. \"Ad by seller\" ile organik sonucun farkı ne? Etsy's Pick neye verilir?\n3. Beş filtre say ve her biri için o filtreyi işaretleyecek bir müşteri tarif et.","video":1,"damga":"7:41","sn":461},{"ders":"1.4","modul":1,"baslik":"Kime satıyorsun: Amerika pazarı ve kadın alıcı","metin":"**Videoda:** Video 1, 18:36–22:54.\n\n**Neden bu ders var?** Çünkü ürün, fotoğraf ve dil seçimlerinin hepsi alıcının kim olduğuna göre yapılır — ve bu kursta alıcı çok net tarif edilir.\n\n**Mantık ve rakamlar.** Bu işte Amerika'ya satış yapılır. Emin videoda pazarın büyüklüğünü ekranda, Wikipedia'nın 2021 verisinden okuyor: **7,5 milyon satıcı, 120 milyon ürün, 96 milyon alıcı**; aktif müşteri sayısı 70 milyonun üzerinde. Kaba hesabı da şöyle: Amerika'da 300 milyon insan yaşıyorsa üçte biri kadarı Etsy müşterisi olabilir. Ve Emin'in **\"ikinci not\"** dediği kritik bilgi: **bu müşterilerin yüzde 95'i kadın.** Kadınlar hem kendine, hem çocuğuna, hem eşine alışveriş yapar — babanın doğum gününde siteye giren annedir: bir tişört, bir cüzdan, bir telefon kılıfı alır, her birine ~20 dolar öder. Emin kadın satıcıların bu işte çoğu zaman daha başarılı olduğunu söylüyor: alıcının gözünden bakabiliyorlar. Sitede gezerken de fark edeceksin: mankenlerin çoğu kadın.\n\nAlım gücü ve alışkanlıklar: Amerika'da 20-25 dolara tişört almak tamamen sıradandır. Bir aile yılda 10-20 tişört alır. Türk aklıyla \"1.000 liraya tişört mü olur\" dememen için Emin bunu özellikle vurguluyor. Satışın motoru **hediye günleridir**: Christmas (Noel), Anneler Günü, Babalar Günü, doğum günleri, Halloween (Cadılar Bayramı), Easter (Paskalya), St. Patrick's Day, yılbaşı. En çok hediye edilen üçlü: **tişört, deri cüzdan ve name necklace** (üzerinde isim yazan kolye).\n\nNiçin kişiye özel ürün? Emin'in kıyası: MediaMarkt'tan alınmış kutulu bir kulaklık mı daha çok hatıra değeri taşır, yoksa aranızdaki bir espriden çıkan sözün yazılı olduğu, adının bastırıldığı bir tişört mü? Kişiye özel hediye saklanır; kulaklık \"yerden yere gezer, kırılır.\" Bu yüzden kişiselleştirilebilir ürünler Amerika'da çok satar — ve kişiselleştirme, Etsy'nin sıralamada dikkate aldığı bir özelliktir: mümkün olduğunca kişiselleştirilebilir ürün listeleyeceksin.\n\nSon parça kültürdür: Amerika'da esprili, argo, şakalı tişörtler gündelik giyimdir. Emin'in ekranda gösterdikleri: \"I need a huge cocktail\"; hemşirelere yönelik kafein esprisi (\"günde dört sefer, aç karnına\"); hafta sonu insanı için \"coffee and soccer\"; \"yes, always right\". Kendi yorumu: \"Türkiye'de birine böyle bir tişört giydirmeyi teklif etsen cinayet çıkar — ama burada satıyor.\" Bu espriyi yakalamak, Modül 3'teki konu seçiminin ta kendisidir.\n\n**En sık yapılan hata ve sonucu.** Ürünü ve görseli kendi zevkine göre seçmek: erkek mankenli mockup, Türk esprisi, \"bence şık\" tasarım. Sonuç: %95'i kadın olan, hediye almak için gezen alıcıyla hiç eşleşmezsin; Etsy ilanını gösterir, tıklanmaz, görünürlüğün düşer (mekanizmayı Ders 3.7'de göreceksin). *(Videoda: Video 1, 18:36–22:54.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 18:36–22:54.*\n1. Alıcı profilinin üç kritik sayısını söyle: telefon oranı, kadın oranı, tişört fiyat aralığı.\n2. En çok hediye edilen üç ürün ne? Satışın motoru hangi günler?\n3. Kişiselleştirilmiş ürün neden hem müşteriye hem Etsy algoritmasına iyi gelir?","video":1,"damga":"18:36","sn":1116},{"ders":"1.5","modul":1,"baslik":"İyi ve kötü listing: bir satın alma yolculuğu","metin":"**Videoda:** Video 1, 23:08–28:11.\n\n**Neden bu ders var?** Emin müşteri rolüne girip baştan sona bir tişört satın alıyor — çünkü bir ilanın bütün parçalarının ne işe yaradığı, ancak alıcının gözünden bakınca anlaşılır. Buradaki ölçüt cümlesini ezberle: **iyi bir listing, müşterinin aklına gelebilecek her soruyu müşteri sormadan cevaplar.** Cevaplayamazsa müşteri tıklar, gider.\n\n**Bir listing sayfasının parçaları.** En fazla **10 fotoğraf ve 1 video** konabilir. Fotoğrafların arasında iki özel görsel vardır: **size chart** (beden tablosu: genişlik-uzunluk ölçüleri) ve **color chart** (renk tablosu: hangi renk gerçekte nasıl görünüyor). Sayfada ayrıca başlık, seçenekler (beden, renk), kişiselleştirme kutusu, açıklama ve yorumlar bulunur.\n\n**Emin'in yolculuğu — kötü örnek.** Harry Potter hayranı arkadaşına tişört alacak. Beden seçimi için size chart'a bakıyor ve pratik taktiğini paylaşıyor: \"Arkadaşım large giyiyor ama emin değilim. Eşinin bir tişörtünü ölçersin: genişlik 22 inç çıktıysa tabloda 22 inç hangi bedense onu alırsın. Large giyen adama bazen medium daha doğru çıkar.\" Sonra renk: espresso rengini seviyor, color chart'a bakıyor ve... espresso tabloda yok. Olan tablo da okunmuyor: \"Ivory yazıyor, haki, pepper, white, black, granite, watermelon… İsimleri okuyamıyorum arkadaşım. Şu an memnun bir müşteri değilim. Çıktım gittim bu mağazadan.\" İşte bir müşteri kaybı, sebepleriyle: cevapsız kalan soru.\n\n**İyi örnek.** İkinci mağazada az ama net renk seçeneği var. Seafoam rengini seçiyor, chart'ta nasıl durduğunu görüyor. Tasarımın hangi renk tişörtte hangi renk baskıyla (beyaz, gold, ivory üstünde siyah) gittiği fotoğraflarda gösterilmiş. Ve **\"Add your personalization\"** kutusu (müşterinin kişiselleştirme isteğini yazdığı alan) ne yazılacağını açıkça söylüyor: \"Gold, white veya black yaz.\" Emin karar değiştirip siyah tişört + gold baskı istiyor, kutuya \"gold\" yazıyor. Soru sormadan, mesajlaşmadan sipariş tamam.\n\n**Yolculuğun sonu.** Sepete eklemeden önce yorumlara bakıyor — kendi itirafıyla \"keşke sepete eklemeden önce baksaydım\": beş yıldızlar, bir tane de fotoğraflı yorum. Sonra sepet: hediye olarak işaretleme (gift), adres, kargo seçimi. Standart yerine **priority** (öncelikli, birkaç günde gelen) ya da yaklaşık **35 dolar** ekstrayla ertesi gün uçak kargo; \"bunu ödeyen de var.\" Ödeme, sipariş tamam. *(Kargo fiyatları videolar arasında küçük farklarla anılıyor; Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)*\n\n**En sık yapılan hata ve sonucu.** İlanı satıcı gözüyle kurmak: okunmayan renk tablosu, eksik ölçü, ne yazılacağı belirsiz kişiselleştirme kutusu. Sonuç: müşteri sormaz — gider. Sen de \"ziyaret var, satış yok\" tablosuna bakar kalırsın. *(Videoda: Video 1, 23:08–28:11.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 23:08–28:11.*\n1. Bir listing'te en fazla kaç fotoğraf ve video olur? Size chart ile color chart ne işe yarar?\n2. Kötü örnekte müşteriyi kaçıran neydi. İyi örnekte aynı sorunu ne çözdü?\n3. \"İyi listing, sorulmayan soruları cevaplar\" cümlesini kendi bir örneğinle açıkla.","video":1,"damga":"23:08","sn":1388},{"ders":"1.6","modul":1,"baslik":"İş modeli: production partner ve siparişin yolculuğu","metin":"**Videoda:** Video 1, 28:19–34:59.\n\n**Neden bu ders var?** Çünkü bu kursta üretim yapmayacaksın — ama üretimin nasıl aktığını bilmeyen bir mağaza yöneticisi, müşterisine tek cümle kuramaz.\n\n**Model.** Sen tasarımı bulur, ilanı açar, müşteriyle ilgilenirsin. Sipariş geldiğinde aynı anda üreticinin sistemine de düşer ve Emin'in Teksas'ın Leander şehrindeki üretim tesisi ürünü basar, paketler, kargolar. Etsy bu ilişkiye **production partner** (senin adına üretim yapan ortak) der ve Etsy'ye resmen bildirilir (kaydını Modül 2'de, açılış sihirbazında yapacaksın).\n\n**Siparişin yolculuğu — Emin'in tesis turundan.** Sipariş, satıcı paneline (**Shop Manager**, mağaza açılınca ortaya çıkan yönetim ekranı; Modül 4'ün konusu) düşer. Sipariş satırında müşterinin adı, sipariş numarası, \"şu tarihe kadar kargola\" (**ship by date**) uyarısı, aldığı ürün (beden, renk, \"large espresso + Blue Jean large\" örneği), adres ve seçtiği kargo (standart shipping 5,99 dolar) yazar. Üretimde: sanayi tipi yazıcılar tasarımları özel bir filme basar. Üzerlerinde hangi müşteriye, hangi bedene gideceği yazılıdır. Çalışanlar filmleri tek tek kesip renk ve bedene göre boş tişörtlerle eşleştirir; sıcak pres (heat press) 300 küsur Fahrenheit'ta baskıyı kumaşa yapıştırır, film soyulur, sağlamlaştırmak için bir kez daha preslenir.\n\nBu yönteme **DTF** (direct to film) denir. Başka yöntemler de vardır — **screen print** (serigrafi) ve **DTG** (direct to garment; Emin \"çok iyi bir print metodu değildir\" diyor). Paket **USPS** veya **UPS**'e (Amerika'nın kargo şirketleri) teslim edilir. Şirket paketi okuttuğu an **tracking code** (takip numarası) otomatik entegrasyonla mağazaya işlenir, sipariş panelde **completed** bölümüne geçer ve müşteri paketi kendisi izler. Emin ekranda gösteriyor: paket Round Rock'tan çıkmış, aşama aşama ilerliyor.\n\nGörev sınırı, Emin'in cümlesiyle: \"Sipariş sisteme düştükten sonra senin yapman gereken pek bir şey yok; üretim kısmında bir soru işareti olursa sana sorulur.\" Ama dikkat — bu, üretimin senin *derdin olmadığı* anlamına gelmez: müşterinin karşısındaki tek sorumlu sensin. Bu dengeyi Modül 4'te (Ders 4.10) derinlemesine işleyeceğiz.\n\n**En sık yapılan hata ve sonucu.** İki uç: ya üretimle ilgilenmeye kalkmak (işin değil), ya da \"üretici halleder\" deyip süreci hiç bilmemek. İkincisinin sonucu ağırdır: müşteri \"tişörtüm nerede?\" diye sorduğunda pre-transit ile in transit'i ayırt edemeyen yönetici, yanlış söz verir — yanlış sözün faturasını Modül 4'te göreceksin. *(Videoda: Video 1, 28:19–34:59.)*\n\n**Gerçek bir öğrenciden.** Sözlü kontrolde siparişin yolculuğu sorulunca öğrenci süreci doğru anlattı — ama **production partner, DTF ve tracking code** kelimelerini hiç kullanmadı. \"Üretici\", \"baskı\", \"takip\" dedi. Süreci bilmek yetmez: panelde ve üreticiyle yazışmada bu kelimelerin İngilizcesiyle karşılaşacaksın. Anlatırken terimleri Türkçeleriyle eşleştire eşleştire kullan ki ekranda gördüğünde tanıyasın. *(Videodaki yeri: Video 1, 28:19–34:59.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 28:19–34:59.*\n1. Production partner nedir ve Etsy'ye bildirilmesi neden zorunludur?\n2. DTF'yi iki cümleyle anlat. Öteki iki baskı yöntemi hangileri?\n3. Tracking code mağazaya nasıl işlenir ve sipariş hangi bölüme geçer?\n4. Siparişin yolculuğunu şu dört terimi kullanarak baştan sona anlat: Shop Manager, production partner, DTF, tracking code.","video":1,"damga":"28:19","sn":1699},{"ders":"1.7","modul":1,"baslik":"Ölçek, tempo ve \"geç mi kaldık?\" sorusu","metin":"**Videoda:** Video 1, 52:33–54:37.\n\n**Neden bu ders var?** Çünkü işin ritmini ilk gün doğru kurmak gerekir — ve çünkü herkesin aklındaki \"artık çok satıcı var\" itirazının kayıtlarda net bir cevabı var.\n\n**Ölçek.** Emin ekranda üç mağaza gösteriyor. Birincisi 166 ilanlık, sıradan bir mağaza. İkincisi 4.800 ilanlık, **210.000 tişört satmış** bir dev: \"Her birinden 4 dolar kazansa 800.000 dolar kâr.\" Üçüncüsü tek konuya odaklı: yalnızca hemşire tişörtü satan, 33.000 satışlı, tişörtü 31 dolardan satan bir mağaza. \"En az 10 dolar kâr ediyordur; 300.000 dolar eder. Bu mağazayı ben bir takip edeyim.\" Buradan iki ders çıkarıyor: iş, sürekli yeni ilan açıp her ilanı üst sıralara çıkarmaya çalışmaktır. Ve beğendiğin mağazaları takip edip incelemek artık senin işinin parçasıdır. \"hoşuna giden, ilginç bulduğun mağazaları inceleyip takip etmen lazım; artık işimiz bu.\"\n\n**Tempo.** İlk ilan mağaza açılırken yapılır (Modül 2). Sonrası günlük iştir: **başta günde iki, alıştıkça üç-dört-beş ilan.** *(Bu tempo ile Modül 3'teki \"açılıştan önce 50 hazır klasör\" hedefinin nasıl birleşeceği videolarda net bağlanmıyor; Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)*\n\n**\"Geç mi kaldık?\"** Emin'in cevabı üç katlıdır. Birincisi benzetme: her mahallede fırın var ve hepsi ekmek satıyor — çünkü herkes ekmek alıyor. Etsy'de de 90-100 milyon kullanıcı var ve herkes tişört giyiyor, hediye alıyor. İkincisi mekanizma: Etsy kötü mağazaları sürekli kapattığı için satıcı sayısı katlanarak artmıyor. Üçüncüsü tarih: Etsy eski bir pazar yeri ama Türkiye'de popülerleşmesi 2018-2019'dan, ivmesi 2020'den sonra; \"siz bu trene yolun çok başında biniyorsunuz. Daha 10-15 sene burada insanlar ekmek yiyecek.\"\n\n**En sık yapılan hata ve sonucu.** İki hata: ilk hafta şevkle on ilan açıp sonra iki hafta hiç açmamak (algoritma düzenli üretim görmek ister — sezon dersinde ayrıntısı var) ve rakip incelemeyi \"vakit kaybı\" saymak. İkincisinin sonucu: Modül 3'te göreceğin konu seçimi ve konu bütünlüğü kararlarını körlemesine verirsin. *(Videoda: Video 1, 52:33–54:37.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 52:33–54:37.*\n1. Günlük ilan temposu nasıl başlar, nereye çıkar?\n2. \"Geç kaldık\" itirazına kurstaki üç cevabı say.\n3. 4.800 ilanlık mağaza ile hemşire mağazasından çıkan iki farklı ders ne?","video":1,"damga":"52:33","sn":3153},{"ders":"2.1","modul":2,"baslik":"Etsy seni tanımadan mağaza açılmaz","metin":"**Videoda:** Video 1, 35:16–40:33.\n\n**Neden bu ders var?** AVM benzetmesinin kurulum ayağı budur: AVM sahibi dükkanı kime kiralamak ister? Adidas'a, Apple'a — tanıdığı, güvendiği, işini iyi yapan markalara. Etsy ise seni **hiç** tanımıyor: dolandırıcı mısın, müşteri kaçırır mısın, bilmiyor. Karar vermeden önce hakkında bilgi toplar. Senin işin, ona toplayacak doğru bilgiyi vermektir.\n\n**Mantık — Etsy nelere bakar?** Emin bunu hayali bir satıcı üzerinden anlatıyor. Biz ona Azra Hanım diyelim. \"Ben Etsy'yim, karşımda Azra Hanım var ve onu hiç tanımıyorum. O zaman bilgi toplarım: Azra Hanım Etsy'ye daha önce girmiş mi? Sipariş vermiş mi? Yorum yazmış mı? Telefonunda uygulama var mı, hesabı var mı? Siparişini hangi adrese istemiş: Almanya'ya mı, Türkiye'ye mi (demek orada yaşıyor)? Hangi kartı kullanmış? Kaç sipariş vermiş, toplam kaç dolarlık?\"\n\nBunun ötesinde Etsy, tarayıcı geçmişi, çerezler (**cookies**), cihaz parmak izi (**fingerprint**) ve IP adresi üzerinden, daha önce kapatılmış bir Amazon veya Etsy hesabıyla bağlantın olup olmadığına da bakar. Sıkıntılı bir işlemde yakalanmış bir bilgisayar ve IP kara listedeyse, o cihazdan açılan mağazaya izin vermez. Emin bunun ürkütücü tarafını gündelik bir örnekle anlatıyor: \"Geçen çocuk için bir scooter baktım; bir haftadır her yerde scooter reklamı görüyorum. İnternet artık her şeyi kaydediyor — mouse'u nereye sürüklediğimi, yorumları kaç saniye okuduğumu bile. Bu online ticaretin arkasında büyük bir veri analizi yatıyor.\"\n\nÜrkütücü ama madalyonun öbür yüzü şu: aynı veri, satıcı olarak senin eline de analiz olarak geçecek (Modül 4'te Stats).\n\n**Nasıl yapılır — hazırlık reçetesi.** Mağaza açma düğmesine basmadan önce:\n\n1. Bir Etsy hesabı aç ve **uygulamayı indir** (Modül 1'de başladın).\n2. **Bir hafta-on gün** her gün gez: arama yap, filtreleri dene, ilanları incele.\n3. Hesabına **adresini** gir.\n4. **Temiz bir kart** ekle. Temiz demek: daha önce başka bir hesapta ya da kapatılmış bir hesapta kullanılmamış. 16 haneli herhangi bir kart olabilir — banka kartı, kredi kartı, sanal kart. Önemli olan **içinde para olması** ve geçmişinin temiz olması.\n5. **Siparişler ver** — gelen ürünler senin adresine ulaşsın.\n6. Gelen siparişlere **yorum yaz**.\n7. En az bir satıcıyla müşteri olarak **mesajlaş** — Emin'in canlandırması: \"Merhaba Stefanie, ben senden bu ürünü almak istiyorum ama…\" gibi sıradan bir alışveriş sorusu yeter.\n\nBütün bu etkileşimler kaydedilir. Etsy seni \"gerçek bir kullanıcı\" olarak tanıdıktan sonra mağaza açılışı çok daha sorunsuz geçer.\n\n**En sık yapılan hata ve sonucu.** Kursa başlayıp aynı hafta mağaza açmaya kalkmak — Etsy'nin gözünde sıfır geçmişli, kimliği belirsiz bir başvuru olmak. İkincisi: eski, unutulmuş bir hesapta kullanılmış bir kartı \"aynı kart işte\" diye eklemek. Sonuç iki durumda da aynı kapıya çıkar: açılışta ya da açılıştan kısa süre sonra soruşturma ve kapanma riski. *(Videoda: Video 1, 35:16–40:33.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 35:16–40:33.*\n1. Etsy'nin mağaza başvurusundan önce baktığı en az altı sinyali say.\n2. \"Temiz kart\"ın tam tanımını yap: hangi kartlar olur, şartları ne?\n3. Reçetedeki yedi adımı sırasıyla say.","video":1,"damga":"35:16","sn":2116},{"ders":"2.2","modul":2,"baslik":"Açılış sihirbazı adım adım","metin":"**Videoda:** Video 1, 40:33–44:52.\n\n**Neden bu ders var?** Çünkü açılış tek seferlik bir iştir, soruları İngilizcedir ve yanlış işaretlenen bir alanın düzeltilmesi uğraştırır. Bu adımları **eğitmeninle birlikte** yapacaksın — Emin açılışı öğrenciyle beraber yaptığını özellikle söylüyor. Bu ders, o görüşmede kaybolmaman içindir.\n\n**Nasıl yapılır — ekran sırasıyla.**\n\n1. Etsy ana sayfasında **\"Sell on Etsy\"** bağlantısına tıkla. Karşılama ekranında **\"Get started\"** ile sihirbaz başlar.\n2. Etsy önce kimlik değil, **ne satacağını** sorar. Sıra şöyledir: hangi ülkede bulunduğun → mağaza adın → ne satacağın.\n3. İlk ilanını daha mağaza açılırken oluşturursun. Tişört için Emin'in verdiği cevaplar sırasıyla: satacağım şey **shirt**. Bu bir **physical item** (dijital değil); ürünü **ben yaptım**. Bu bir **finished product** (bitmiş ürün); **made to order** (sipariş üzerine üretiliyor). Ürün tipi olarak **\"It's an item that my shop alters\"** — \"mağazamın üzerinde değişiklik yaptığı bir ürün\"; tişört, bardak gibi kişiselleştirilen ürünler için doğru seçenek budur (bitki, kristal gibi bambaşka bir şey satan, kendine uyanı seçer).\n4. Üretimde ne kullandığın sorulur. Emin'in işaretledikleri: **yapay zeka**, **printer** ve **pres makinesi** (Cricut, CNC gibi seçeneklere dokunmuyor).\n5. Kritik soru: **bu ürünü tek başına mı üretiyorsun, production partner ile mi?** Burada üreticini eklersin. Form dört bilgi ister ve Emin örnek cevapları veriyor: **şirketin adı**; **nerede bulunduğu** (videodaki örnekte Stuttgart üzerinden gösteriyor; bizde Teksas/Leander olur). **Sana nasıl yardım ettiği** — \"Benim teknik yeterliliğim yok; onun printerları ve pres makineleri var\"; **senin üretimdeki rolün**. \"Her şeyi ben tasarlıyorum: tişörtleri, mockup'ları, tasarımları ben yapıyorum. O yalnızca bitmiş ürünü kişiselleştirip paketleyip kargoluyor.\" Sonra **save**.\n6. İlk ilan bitince kişisel bilgiler istenir: **banka bilgisi, kart bilgisi, adres, kimlik fotoğrafı** ve kamerayla **yüz doğrulaması** — Etsy kimliğindeki yüzle canlı yüzünü eşleştirir. Gerekçesi Emin'in ağzından: \"Burada para kazanacaksın; milyon dolar kazanan insanlar var. Kimliğin, yüzün, banka bilgilerin. Her şeyin tutarlı ve gerçek olması lazım.\" (Tutarlılığın kuralları bir sonraki derste.)\n\nBir ülke notu: Amerika'daki satıcılardan **SSN** (Amerikan sosyal güvenlik numarası — TC kimlik numarasının karşılığı gibi) istenir; Türkiye ve Almanya'da böyle bir numara istenmez, doğrulama kimlik ve adres üzerinden yapılır.\n\n**En sık yapılan hata ve sonucu.** Ürün tipini yanlış işaretlemek (örneğin \"alters\" yerine başka bir tip) ya da production partner'ı hiç bildirmemek. İkincisi ciddidir: üretimi başkası yapıyorken \"tek başıma üretiyorum\" demek, Etsy'nin el emeği kurallarına aykırı beyandır ve sonradan tespit edilirse mağazayı riske atar. *(Videoda: Video 1, 40:33–44:52.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 40:33–44:52.*\n1. Sihirbazın soru sırasını say: kimlikten önce ne gelir?\n2. İlk ilanın altı işaretini say (physical item'dan \"alters\"a).\n3. Production partner formunun dört alanına bizim durumumuz için birer cümle yaz.","video":1,"damga":"40:33","sn":2433},{"ders":"2.3","modul":2,"baslik":"Tutarlılık kuralı ve kara liste","metin":"**Videoda:** Video 1, 45:24–48:23.\n\n**Neden bu ders var?** Çünkü kurulum aşamasının en acımasız kuralı budur ve ihlalinin telafisi yoktur: **kimlik, kart, banka hesabı ve adres aynı kişiye ait olacak ve birbiriyle eşleşecek.**\n\n**Mantık.** Etsy'nin gözünden bak: para kazanılacak bir hesap açılıyor. Kimlik başka birine, kart başka birine, banka hesabı üçüncü bir kişiye aitse bu bir \"kim kimdir?\" sorunudur ve Etsy soruyu sormaz — hesabı kapatır.\n\n**Emin'in iki örneği.** Birincisi: Azra Hanım mağaza açıyor. Kendi kimliğini yükledi, yüz doğrulamasını geçti, sonra \"benim kartın limiti yokmuş\" deyip **kardeşinin kredi kartını** girdi. \"Çat — mağaza kapanır. Etsy der ki: bu kart kimin? Sen kimsin? Ne oluyor?\" İkincisi: her şey kendi adına, ama parayı **babasının banka hesabına** yatırtmak istedi. \"Hop. Olmaz. Yine kapatır.\" Kendi adına olduğu sürece kartın türü serbesttir (banka, kredi, sanal). Kişi değişemez.\n\n**Kara liste mekanizması.** Daha önce bir Etsy mağazan kapatıldıysa, o mağazada kullanılan **kart numarası, IBAN, SSN/TC kimlik numarası** listeye alınır — ve dahası: o hesabın açıldığı **bilgisayar ve IP adresi** de kayda geçer. Aynı bilgilerin herhangi biriyle (aynı bilgisayardan farklı kartla, farklı bilgisayardan aynı IBAN'la) yeni mağaza açmaya kalktığında Etsy \"aha, yakaladım\" der ve yenisini de kapatır. Emin'in çarpıcı itirafı: \"Bazen hesabımız kapandı mı bilgisayarı satıyoruz, çöpe atıyoruz. Çünkü IP'den de yakalıyor, bilgisayardan da.\" Bizim planımız her şeyi kurallara uygun yapmak olduğu için bu sorunla karşılaşmayacaksın; birden fazla mağaza gibi ileri konular, ihtiyaç olursa eğitmenle konuşulacak ayrı bir konudur.\n\n**En sık yapılan hata ve sonucu.** \"Aile içi kolaylık\": eşin kartı, babanın hesabı, kardeşin bilgisayarı. Sonuç: mağaza kapanır ve o mağazada kullanılan her bilgi (senin temiz bilgilerin dahil) kara listeye girer; gelecekteki açılışları da yakar. *(Videoda: Video 1, 45:43.)*\n\n**Gerçek bir öğrenciden.** İlk sözlü kontrolde \"tutarlılık\" kelimesi geçince öğrenci durakladı: kuralları tek tek biliyordu ama bu kelimenin neyi kapsadığını söyleyemedi. Tanımı net kur: tutarlılık, **kimlik, kart, banka hesabı ve adresin aynı kişiye ait olması ve birbiriyle eşleşmesi** demektir. Kelimeyi duyduğunda bu dört kalem aklına gelmiyorsa, ders henüz oturmamış demektir. *(Videodaki yeri: Video 1, 45:24–48:23.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 45:24–48:23.*\n1. Tutarlılık kuralının dört kalemini say.\n2. İki kapanış örneğini anlat: neyi paylaşmak mağazayı götürdü?\n3. Kara listeye neler alınır? \"Bilgisayarı çöpe atıyoruz\" cümlesi hangi mekanizmanın sonucu?","video":1,"damga":"45:24","sn":2724},{"ders":"2.4","modul":2,"baslik":"Mağaza sayfasının parçaları ve açılış öncesi malzeme","metin":"**Videoda:** Video 1, 48:39–51:25; açılış malzemesi: Video 2, 31:35–35:14.\n\n**Neden bu ders var?** Emin'in AVM'den kuralı: \"Dükkanı açtıktan sonra kartvizit bastırmazsın. Poşetler, askılar, yazar kasa, bütün konsept hazır gelir — ondan sonra satışa başlarsın.\" Mağaza sayfan da öyle: açılış günü her parça hazır olacak.\n\n**Parçaları tanı.** Emin ekranda gerçek bir mağazayı gezdiriyor (adı \"Custom Shirt and Gift Co\" — kendi esprisiyle: \"Bu kadar uzun isim koyduysa kesin Türk'tür\"):\n\n- **Banner:** sayfanın en üstündeki geniş görsel; yaklaşık **1'e 4** oranında (örnek: 300'e 1200 piksel). İçine örnek ürünler ve bir slogan konur: \"El yapımı tişörtler — kaliteli ve konforlu.\"\n- **Logo:** mağazanın küçük simgesi.\n- **Shop name:** mağaza adı. Kısa ve okunur olsun.\n- **Shop title:** adın hemen altındaki kısa tanıtım satırı — \"custom tişörtler, bardaklar, hediyeler, hızlı kargo\" gibi; karakteri sınırlı, vurucu bir alan.\n- **Announcement:** duyuru bölümü. Örnekteki mağaza ne yazmış: \"Hoş geldiniz! İki ürün satın alana %30 indirim — bir şey yapmanıza gerek yok, sistem sepette otomatik uygular\" ve \"bir sorun olursa bana mesaj atmaktan çekinmeyin.\" Pazarlama mesajı + güven cümlesi. (Bazı mağazalar buraya Instagram linki koyuyor; koyacaksan bir Instagram hesabın da olmalı, not et.)\n- **Star Seller rozeti:** mağaza adının yanında görünür. Ölçütleri Modül 4'te (Ders 4.11) ayrıntılı göreceksin. *(Emin'in bu videodaki özeti: hızlı kargo, hızlı cevap ve 4,8 üzeri puan; videolar arasında sayı farkı var — Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)*\n- **Items:** mağazanın ilanları. **Reviews:** yorumlar.\n- **Shop policies:** mağazanın iade-değişim-kargo kuralları. Bunları satıcı belirler. İncelenen mağaza iade kabul ediyor, **biz etmiyoruz** — gerekçesi ve esnaf dengesi Modül 4'te (Ders 4.7).\n- **Shop sections:** mağazanın kendi oluşturduğu ürün grupları — örnekteki mağazada \"wizard shirts\", yetişkin, anne, çocuk, çocuk doğum günü, teyze, büyükanne-büyükbaba, amca, spor, öğretmen tişörtleri, kahve bardakları… Bunları sen kurarsın; **category** (Etsy'nin genel kategori ağacı) ise Etsy'nindir, sen yalnızca seçersin.\n\n**Açılış öncesi malzeme listesi.** Emin'in istediği çalışma: mağazaları incelerken deftere \"benim neyim olmalı?\" listesi çıkar ve karşılarını doldur — banner, logo, mağaza adı, shop title, announcement metni, ilk ilanın konusu-başlığı-açıklaması, ilk 5-6 görselin ne olacağı, size chart, color chart. Size chart'ı Etsy'de 1-1,3 dolara satın alabilirsin ya da Canva'da kendin çizersin. Üzerine mağaza logonu koyarsın. Mankenli fotoğrafların altına modelin bilgisini yazmak da müşteri kararını kolaylaştırır. Örnekteki ilanda \"model 5 ft 4 inç, ~120 lb\" yazıyor. Müşteri \"ben 65 kiloyum, 1.65'im. Bende de böyle durur\" diye hesap yapar. Tam listeyi Ekler'de bulacaksın (Kontrol Listesi C.1).\n\n**En sık yapılan hata ve sonucu.** Mağazayı boş sayfayla açıp \"sonra doldururum\" demek. Sonuç: ilk günlerin değerli trafiği bannersız, politikasız, chart'sız bir vitrine gelir. Modül 1'deki kötü örneğin müşterisi gibi — sessizce gider. *(Videoda: Video 1, 48:39–51:25.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 1, 48:39–51:25.*\n1. Shop sections ile category farkı ne? Hangisini sen kurarsın?\n2. Announcement'a örnekteki mağaza neler yazmıştı — iki tür mesajı da söyle.\n3. Açılış öncesi malzeme listesinden en az sekiz kalem say.","video":1,"damga":"48:39","sn":2919},{"ders":"2.5","modul":2,"baslik":"Kargo profili: bir gün, 5,99 artı 2, ücretsiz kargo yok","metin":"**Videoda:** Video 5, 3:47–9:35.\n\n**Neden bu ders var?** Kargo profili bir kez kurulur, bütün ilanlara uygulanır ve müşterinin satın alma kararını doğrudan etkiler. Değerleri kurs net vermiştir. Gerekçelerini bilirsen eğitmenle kurulumda hiçbir alan sana yabancı gelmez.\n\n**Nasıl yapılır.** Panelde **Settings > Shipping settings** yolundan girilir. Profil kurarken sırasıyla: kargonun çıkacağı **posta kodu**; **processing time** (siparişi üretip kargoya verme süresi); kargo seçenekleri ve ücretleri; hangi günler kargo çıkardığın (kurulumda pazartesi-cumartesi işaretlenir — ship by date hesabını Modül 4'te göreceksin).\n\n**Kurs değerleri ve gerekçeleri:**\n\n- **Processing time = 1 gün.** Emin bunun \"müşteriler açısından çok önemli\" olduğunu söylüyor ve bir sınıf sorusuna cevaben mantığını açıyor: müşteri ilan sayfasında \"1 günde kargoya verilir\" ibaresini görünce \"hafta sonuna kadar elimde olur\" diye düşünüp rahat alıyor. 5 gün yazan mağazada \"5 gün hazırlık + 4-5 gün yol = 10 gün sonra gelir\" deyip vazgeçiyor. Üstelik Etsy, hızlı kargolayan ilanları arama sonuçlarında biraz öne alıyor. (Bazı mağazalarda uzun üretim süresi görürsün — o mağaza kendi processing time'ını öyle ayarlamıştır; bizim standardımız 1 gündür.)\n- **Standart kargo (first class mail) = 5,99 dolar.** Kural: \"kargo ücreti 6 doların üstünde olmasın.\"\n- **Additional item = +2 dolar:** aynı siparişteki her ek ürün için. İki tişört 7,99. Üç tişört 9,99.\n- **Priority mail = 9-10 dolar.** Hızlı seçenek.\n- **Next day air = 49 dolar.** UPS'in uçak kargosu. Ertesi gün teslim. Ücretler en yüksek maliyete göre yazılır. Gerçek etiket ucuz çıkarsa fark mağazada kalır. (Maliyet-kâr tarafı bu programın kapsamı dışındadır; işe başlayınca eğitmeninle konuşulur.)\n- **Yalnızca United States.** Yurt dışına satış yok: Kanada bile \"takibi, iadesi ciddi problem; 7-10 günde gidiyor, müşteri memnun olmuyor.\"\n- **Ücretsiz kargo yapılmaz.** Gerekçe: kargoyu bedava yaparsan ~5-6 dolarlık maliyeti tişört fiyatına gömmen gerekir. 19 dolarlık tişört listede 22-23 dolar görünür ve müşteri **tişört fiyatına** bakar. Etsy \"müşterilerin %70'i ücretsiz kargolu yerden alıyor\" diye tavsiye etse de Emin'in tişörtteki tecrübesi tersini gösteriyor: \"Ücretsiz kargo yapmayın. Kargo ücretini alın. Tişörtünüz listede ucuz görünsün.\" *(Video 1'de ücretsiz kargonun müşteri filtresi olarak önemli olabileceği söylenmişti; fark için Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın.)*\n\nBir teknik not (Modül 4'te derinleşecek): üretici etiketleri ShipStation gibi bir programdan alıyorsa, etiket bilgisinin mağazaya kaç saat sonra yansıyacağı ayarlanabilir — pre-transit süresini kısaltan bu senkronizasyon ayarını Ders 4.9'da göreceksin.\n\n**En sık yapılan hata ve sonucu.** İki hata: \"müşteri kaçmasın\" diye ücretsiz kargo açmak (ürün listede pahalı görünür, tıklama düşer) ve processing time'ı \"garanti olsun\" diye 3-5 güne çekmek (müşteri teslimatı geç hesaplar, almaz; Etsy öne çıkarmaz). *(Videoda: Video 5, 3:47–9:35.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 3:47–9:35.*\n1. Beş kurs değerini say: processing time, standart, ek ürün, priority, next day air.\n2. Ücretsiz kargonun tişörtte neden işlemediğini müşterinin gözünden anlat.\n3. Processing time'ın 1 gün olmasının iki ayrı faydası ne?","video":5,"damga":"3:47","sn":227},{"ders":"3.1","modul":3,"baslik":"Pazarlamacı zihniyeti ve konu seçimi","metin":"**Videoda:** Video 2, 35:53–39:07; Mars örneği: Video 1, 59:48.\n\n**Neden bu ders var?** Çünkü işin ilk ve en büyük yanlış anlaması şudur: \"Ben tasarımcı olacağım.\" Emin'in cümlesi net: **\"Siz tasarımcı değilsiniz — biz de değiliz. Bunun uzmanları ayrı.\"** Sen bir **pazarlamacı**, Emin'in öbür deyişiyle bir **esnafsın**: neyi satabilirim, nereden kaça alırım, kaça satarım? Tasarım sonra gelir. Ve satın alınır.\n\n**Mantık.** Tasarım piyasası hazırdır: tek tasarım 1-3 dolar; 30-60 tasarımlık **bundle** (paket) birkaç dolar. Emin'in un benzetmesi: ekmek yapacaksan buğday yetiştirmezsin — bir yerden un, bir yerden kabartma tozu, bir yerden süt alır, ürünü ortaya çıkarırsın. Sıfırdan tasarım yapmaya girişenlerin sonucunu da acımasız ama gerçekçi söylüyor: WhatsApp'tan \"hocam nasıl olmuş\" diye gelen tasarımlar \"6 yaşındaki çocukların yaptığına benziyor. Emektir, doğru. Ama amaç para kazanmaksa konuyu bul, tasarımı satın al.\" (Hazır tasarımı \"kopyalayıp değiştirmenin yollarını keşfetmek\" de bu zanaatın parçası, birebir kopya değil, üzerine çalışılmış alternatif.)\n\n**Konu nasıl seçilir?** Kafadan konu uydurulmaz. Emin'in ölçüsüz örneği: \"Mars'taki köpek balıkları tişörtü — kimse yapmamış, ben satarım! Böyle bir alıcı yok.\" Doğru yol üç adımdır:\n\n1. **Zaten satan ilgi alanlarından git:** kahve severler, kitap severler, sinema severler, evcil hayvan sahipleri, öğretmenler, hemşireler, anneler-babalar günü… Bu nişlerde alıcı hazırdır.\n2. **Rakipleri incele:** Etsy'de \"nurse shirt\" yaz, satanları aç, başlıklarına ve görsellerine bak; aynı hedef kitleye **daha iyi bir alternatif** planla. Emin'in ekranda yakaladığı fırsat tam bu türdendi: beğendiği bir tasarımı satıcı yalnızca cep boyu (küçük, göğüs hizasında) kullanmış — \"Dur, ben bunu büyük koyayım; sırt kısmına alternatif üretip listelerim. Hedef kitle zaten aynı.\"\n3. **Espriyle ya da kişiselleştirmeyle birleştir:** düz \"mama\" yazısı da satar ama rekabeti çok yüksektir. Üst sıraya çıkmak zordur. \"Feral mama\" (rakunlu, esprili anne tasarımı) gibi bir hikayeyle birleşen konu daha kolay yükselir — Etsy'de \"feral mama PNG\" aramasında 1,5 dolara sekiz tasarım hazır bekliyor. Kişiselleştirme de aynı işi görür: çocuk isimlerinin yazılabildiği bir tasarım, düz tasarımdan her zaman güçlüdür.\n\nTek konuya odaklı (konsept) mağazanın avantajını Modül 1'den hatırla: yalnızca hemşire tişörtü satan mağaza, Etsy'nin hedef kitle eşleştirmesini kolaylaştırır — \"Etsy'nin işini kolaylaştıracaksınız.\"\n\n> **Küçük ama önemli ayar:** Aramaları her zaman müşterin gibi yap — dil İngilizce, konum Amerika. Emin Video 3'ün açılışında bir öğrencinin ekranını düzelttiriyor: araç Türkçeye çevirip \"kaplumbağa\" yazmış; \"Onu sil, turtle shirt yazacaksın. Müşterimizin hepsi orada.\"\n\n**En sık yapılan hata ve sonucu.** Günlerini tek bir tasarımı çizmeye vermek. Sonuç: o sürede rakip beş konu test etti; senin \"emeğin\" ise müşterinin gözünde 2 dolarlık hazır tasarımdan farksız — üstelik çoğu zaman daha kötü. *(Videoda: Video 2, 35:53–39:07.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 35:53–39:07.*\n1. \"Tasarımcı değil pazarlamacısın\" cümlesini un benzetmesiyle aç.\n2. Konu seçiminin üç süzgeci ne? \"Mars'taki köpek balıkları\" hangi süzgece takılır?\n3. Cep boyu tasarımı gören Emin'in aklına gelen fırsat neydi?","video":2,"damga":"35:53","sn":2153},{"ders":"3.2","modul":3,"baslik":"Analiz araçları ve trend okuma: EtsyHunt, eRank","metin":"*Başvuru dersi — trend araçlarına bakacağın gün aç (kurs kararı zaten: başlangıçta gerek yok).*\n\n**Videoda:** Video 2, 0:22–1:41 ve Video 2, 13:10–31:19.\n\n**Neden bu ders var?** İnternette Etsy videosu izleyen herkes bu araçların adını duyar ve \"almalı mıyım?\" diye sorar. Emin ikisini de ekranda tanıtıyor — ve kursun kararını baştan söylüyor: **\"Gerek yok. Biz aldık ama kullanmıyoruz. Tanıdığımız arkadaşlar da kullanmıyor.\"** Yine de ne gösterdiklerini bilmelisin, çünkü araçların ekranları üzerinden kursun birkaç kalıcı kuralı anlatılıyor.\n\n**EtsyHunt ne gösterir?** Chrome'a eklenen bir uzantıyla, Etsy'de gezerken her ilanın yanında ek bilgiler belirir: haftalık satış, ilanın açılış tarihi, favori sayısı ve kullandığı tag'ler. Tag'lerin yanındaki sayı, o kelimeyi kullanan ilan sayısıdır — yani **rekabet**: \"comfort colors mama\" 12 milyon ilanda, \"birthday gift for wife\" 62 milyon ilanda geçiyor. Emin'in çıkarımı: \"Bu tarz kelimeler iyi değil. Çok rakip var. Long tail, rekabeti düşük kelimeler bulmalıyız\" (Ders 3.6'nın temeli).\n\nAynı aracın **product database** ekranı, kategori seçince son 7 günün çok satanlarını listeliyor: Star Wars temalı bir tasarım haftada 1.200 satmış. \"Gulf of Mexico\" ve \"Hands Off\" protesto tişörtleri yükselişte. Emin buradan pazarın bir gerçeğini okuyor: Amerika'daki siyasi çekişmeler iki taraf için de tişört sattırır — protesto, oradaki insanın gündelik ifade biçimidir. (Ekranda \"FDT\" kısaltması da geçiyor: güncel siyasi bir slogan. Konunun bize dersi sloganın kendisi değil, güncel olayların tişört pazarını anında hareketlendirdiğidir.)\n\n**eRank ne gösterir?** Mağaza takibi ve anahtar kelime analizi. Rakip mağazaların günlük satış tahminlerini ve yaşlarını listeler (5 yıllık bir mağaza son hafta 500 satmış gibi). Bir kelimenin arama hacmini, tıklanma oranını (CTR), rekabetini, benzer kelimeleri ve yıl içinde hangi aylarda arandığını gösterir. Bir de özel günler takvimi vardır (Ders 3.3'te kullanacağız). Emin iki dürüst uyarı ekliyor: birincisi, veriler tam doğru değildir — kendi mağazalarını ekleyip kıyaslamışlar: araç 66 satış gösterirken gerçek 90'mış, 74 gösterirken 80'miş. İkincisi, trend listeleri **trademark süzmez**: listede Lord of the Rings, konser tişörtleri gibi tescilli konular da çıkar. \"Araç 'bu trademark'tır' demiyor, sorumluluk sende\" (Ders 3.4'ün kancası).\n\n**Abonelik pratikleri.** Emin öğrencilerin sorularına dürüst cevaplar veriyor: araçlar aylık ~10 dolar; önceki gruplarda 4-5 kişi tek hesabı paylaşıp ikişer dolar ödemiş. Bir ay ücretsiz deneme var ve süresi içinde iptalde ücret iade ediliyor — \"sanal kartla deneyip iptal edenler de oluyor.\" Bunları aktarıyoruz çünkü kayıtlarda var; şartlar araçtan araca değişir, kullanacaksan sözleşmeyi kendin oku. Kursun ana kararı değişmiyor: **başlangıç için hiçbirine gerek yok**. ChatGPT ve Etsy'nin kendi arama sonuçları yeter.\n\n**En sık yapılan hata ve sonucu.** İki uç: araca abone olup sayı okumayı iş sanmak (ilan açılmayan gün, veri işe yaramaz) ya da trend listesinden tescilli bir kelime kapıp ilan açmak (\"araç önerdi\" savunması Etsy'de geçmez — ilan kapanır, tekrarında mağaza gider). *(Videoda: Video 2, 13:10–31:19.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 13:10–31:19.*\n1. Tag yanındaki 12 milyon sayısı ne anlatır ve hangi derse kapı açar?\n2. eRank verileri hakkında Emin'in iki dürüst uyarısı neydi?\n3. Kursun araçlar hakkındaki nihai kararı ve gerekçesi ne?","video":2,"damga":"0:22","sn":22},{"ders":"3.3","modul":3,"baslik":"Sezon takvimi: özel güne iki üç ay kala başlanır","metin":"**Videoda:** Video 2, 3:39–9:59; küçük günler ve takvim: Video 2, 21:30–23:57.\n\n**Neden bu ders var?** Çünkü Video 2'nin en kritik kuralı budur ve zamanlaması kaçan emek, çöpe gider — kursun en acı örneği bu derste.\n\n**Kural.** Yılın büyük günleri, büyükten küçüğe: **Christmas, Anneler Günü, Halloween, Babalar Günü.** Bu günlerin ilanlarına **iki-üç ay önceden** başlanır: önce günde bir, sonra günde iki, güne yaklaştıkça biraz daha sık; güne **iki-üç hafta kala** yeni ilan açmanın anlamı kalmaz — durursun. Somut tarih: Anneler Günü (Mayıs ortası) hazırlığı **Ocak sonunda, en geç 14 Şubat civarında** başlar. Kanıtı Emin ekranda gösteriyor: organik sıralarda öne çıkmış bir Anneler Günü ilanı **27 Ocak'ta** açılmış.\n\n**İkinci kural: aynı gün beş-on ilan birden açılmaz.** Emin'in acı örneği bir \"mama bundle\": 60 tasarım, ~3 dolar; son 24 saatte 5 kişi almış (yani elinde aynı paket olan başka satıcılar da var). Bunu alıp Anneler Günü'ne iki hafta kala 60 ilanı birden açan satıcı \"**yüzde 0,1 ihtimalle bile satamaz**. Bu iş organik ve yavaş ilerler. O 60 ilana 60 gün önce, günde birer ikişer başlaman gerekirdi.\" Etsy ilanları azar azar test edip gösterir (Ders 3.8'deki mekanizma). Yığın halinde açılan ilan test sırasını hiç bulamaz.\n\n**Üçüncü kural: tutan ilan ertesi yıl yine satar.** Emin yıllarca izlediği mağazalardan çıkardığı gözlemi anlatıyor. 2024 Anneler Günü'nde tutan \"Cool Mum Club\" tasarımı, 2025 Anneler Günü'nde yine satar. \"Etsy o dönem o ilanı hatırlar ve yine gösterir.\" Genel hali: **mağaza yılın hangi döneminde bir şey tutturduysa, o dönem onun için hep iyi geçer.** İki mağaza hikayesi: Şubat'ta açılan bir mağaza Anneler Günü'nde 300-500 satıp sonra düşer. Ertesi yıl aynı dönemde yine parlar; başka bir mağaza Anneler Günü'nü boş geçirip Babalar Günü'nü tutturur. Onun güçlü dönemi artık hep Babalar Günü'dür.\n\nEn büyük ödül Christmas'tadır: hacim olarak en büyük dönem. Emin'in elinde **11 ay zarar edip tek Christmas'ta 3.000-5.000 satışla bütün yılı kâra çeviren** mağazalar var. \"11 ay sabrediyoruz o mağazaya.\" Bu kuralı küçümseme: programı ilk çalışan öğrencinin kendi notlarında en önemli bulduğu satır buydu. Sözlü kontrolde sorulmayınca kendisi hatırlattı. Bu yılın tutan ilanı, gelecek yılın hazır sermayesidir.\n\n**Kelimeyi tek güne bağlama.** eRank'in aylık grafiğinde \"mama shirt\" iki kez pik yapıyor: **Mart'ta** (Anneler Günü hazırlığı) ve **Aralık'ta.** Neden Aralık? Çünkü Christmas'ta insanlar annelerine, babalarına, çocuklarına da tişört alır — ağacın altındaki kutulardan biri hep tişörttür. \"Mama shirt\", \"father's shirt\" gibi kelimeler Christmas'ta da satar.\n\n**Küçük günler.** Takvimde her güne bir şey var: Earth Day (22 Nisan), Star Wars Day, National Superhero Day, Anzac Day… Bunlar büyük hazırlık istemez — Christmas gibi süsleme-kostüm-aile hazırlığı kültürü yoktur. İnsanlar akıllarına gelirse bir hafta-on gün önce alır. **İki hafta önce bir-iki ilan** yeter. (Emin'in hoş bulduğu örnek: \"Earth Day Everyday\" (bir gün değil her gün) tişörtü de, PNG'si de satılıyor.)\n\n**En sık yapılan hata ve sonucu.** İlk hata: bundle alıp güne iki hafta kala toplu açılış (satmaz — yukarıdaki %0,1 örneği). İkincisi tersi: büyük günü tamamen kaçırıp \"bari şimdi açayım\" diye son haftada başlamak. O emek ancak *gelecek* yılın sezonuna yatırım olur; bunu bilerek yaparsan sorun değil, bilmeden yaparsan hayal kırıklığıdır. *(Videoda: Video 2, 6:26–6:56.)*\n\n**Gerçek bir öğrenciden.** Video 2'yi bitiren bir öğrenci sözlü kontrolde iki tarihi de yanlış hatırladı: başlangıcı \"iki ay önce\" dedi (doğrusu: Ocak sonu, en geç 14 Şubat — yani iki buçuk-üç ay), durmayı da \"**bir hafta kala**\" dedi (doğrusu: **iki-üç hafta kala**). Fark küçük görünür ama değildir: son bir-iki haftada açılan Anneler Günü ilanı, test sırası gelmeden günü kaçırır. Bu tarihleri ezberden değil takvimden bil: Ek E'deki tabloyu yazdırıp duvara asmak bu dersin en ucuz sigortasıdır. *(Videodaki yeri: Video 2, 4:20–6:26.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 3:39–9:59.*\n1. Dört büyük günü büyükten küçüğe sırala. Başlama ve durma zamanlarını söyle. (Durma \"bir hafta kala\" mı? Değilse kaç hafta ve neden?)\n2. 60'lık bundle vakasında yanlış neydi, doğrusu ne olurdu?\n3. \"Mama shirt\" neden Aralık'ta da pik yapar ve bundan hangi genel kural çıkar?\n4. Geçen yıl Anneler Günü'nde tutan bir ilanından bu yıl ne beklersin, neden?","video":2,"damga":"3:39","sn":219},{"ders":"3.4","modul":3,"baslik":"Trademark: yasak liste ve cezalar","metin":"**Videoda:** Video 2, 24:37–31:06; Pooh nüansı: Video 2, 37:41–38:11.\n\n**Neden bu ders var?** Modül 1'de çizgiyi öğrendin: tescilli isim kullanılmaz. Bu ders cezanın nasıl işlediğini ve yasak listenin içeriğini verir — çünkü **yeni mağazanın affı yoktur** ve listede seni şaşırtacak kelimeler var.\n\n**Ceza mantığı — mağaza büyüklüğüne göre.** Bir öğrencinin sorusu üzerine (\"geriye dönük ihlallerde mağaza kapanır mı?\") Emin mekanizmayı açıyor: \"Sıklığa, konuya ve mağazanın büyüklüğüne bağlı.\" Kendi mağazalarından örnek: 40-50.000 satışlı, 2-2,5 yıllık bir mağazada bugüne dek **50 ilan** kapanmış. Mağaza ayakta; Etsy büyük mağazayı \"bir daha kapattırma, dikkat et\" diye uyarır. Ama başka bir satıcı 10 ilanda mağazasını kaybetmiş. Yeni mağazada süreç acımasızdır: \"Harry Potter girdin, bir iki satış aldın. İlan kapandı. Taylor Swift girdin. İlan kapandı. **Üçüncüde Etsy mağazayı kapatır.** Çünkü der ki: bu adamın niyeti bozuk; hak hukuk gözetmiyor, sırf para kazanma odaklı.\" Ve bilinen isimlerde savunma yok: \"Harry Potter'ı, Taylor Swift'i bilmeme ihtimalin yok. 'Bilmiyordum' desen de geçmez. Art niyetlisin der.\"\n\n**Yasak liste.** Emin'in grupla paylaştığı \"asla kullanma\" listesinden kayıtlarda geçenler — Ek G'de tam liste halinde bulacaksın:\n\n- Spor: NFL, NBA, Super Bowl, Bengals, Philadelphia Eagles, \"Fly Eagles Fly\".\n- Müzik: Taylor Swift, Swiftie, The Eras Tour ve albüm adları; Morgan Wallen; Noah Kahan.\n- Film-dizi-kitap: Harry Potter ve bütün türevleri — \"Potter\" kelimesi, **HP kısaltması bile** —, Slytherin, Hufflepuff, Ravenclaw, Hagrid; Top Gun; Attack on Titan; Spartans.\n- Çocuk markaları: Sesame Street (Susam Sokağı), Dr. Seuss, Grinch.\n- Ve en şaşırtıcısı, günlük ifadeler: **\"Girl Mom\", \"Boy Mom\", \"Bruh\"** — evet, bunlar tişört sınıfında tescillidir ve kullanan ilanlar kapatılır.\n\n**Emin'in örnekleri.** Ekranda canlı: 2.000 satışlı bir mağaza \"Hagrid's Pumpkin Farm\" ve \"Grinch\" ilanları açmış. Yorumu: \"Bu ilanlar kapatılacak. Bilmiyor çünkü — trademark kurşununu atıyor, satış alayım diye. Bu tarz ilanları 10-20.000 satışlı mağazalarda göremezsiniz. Onlar bu riske girmez, çünkü o büyüklükte bir mağazanın kapanması ciddi üzücü bir olaydır.\" Bir dürüstlük anı da kendi geçmişinden: HP tasarımlarını \"biz de eski zamanda sattık\" diyor. Bugünkü tavsiyesi, o tecrübenin sonucudur. Konser tuzağını da Ders 3.2'den hatırla: bazı satıcılar konserden bir hafta-on gün önce grup tişörtü açıp 50-100 satıp kapatıyor. \"Yakalanırsan ilanı kapatır, tekrarında mağaza gider. Yeni bir mağaza için bu riske girilmez.\"\n\n**Winnie the Pooh nüansı.** Emin, Pooh'un koruma süresinin dolduğunu, bu karakterle çocuk isimli kişiselleştirilmiş tasarım yapılabileceğini söylüyor — \"Domuzcuğu koy, altına kızımın adı Liza'yı yaz\" örneğiyle.\n\n> **Videolarda yok — sonradan eklendi, doğrulanmalı:** Marka tescili (trademark) ile telif hakkı (copyright) ayrı korumalardır. Pooh örneğinde kamuya mal olan, 1926 tarihli *orijinal kitap* karakteridir; sonraki çizimler ve marka tescilleri korunmaya devam edebilir. Kitap ve dizi karakterleri, marka tescili olmasa bile telifle korunabilir ve Etsy telif şikayetini de kabul eder. Kural: \"süresi dolmuş\" denen karakterlerde bile açmadan önce eğitmenine danış.\n\n**En sık yapılan hata ve sonucu.** \"Küçük mağazayım, kimse görmez\" rahatlığı. Sonuç tam tersidir: küçük mağaza, ihlali en pahalıya ödeyen mağazadır — büyüğün 50 ilanına katlanan Etsy, senin üçüncü ilanında kapıya kilit vurur. *(Videoda: Video 2, 24:37–31:06.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 24:37–31:06.*\n1. Aynı ihlalde yeni mağaza ile 40-50.000 satışlık mağazanın akıbeti neden farklı?\n2. Listeden en az sekiz örnek say — en az biri \"günlük ifade\" grubundan olsun.\n3. Pooh nüansı nedir ve eklenen kutu neden \"yine de danış\" diyor?","video":2,"damga":"24:37","sn":1477},{"ders":"3.5","modul":3,"baslik":"Tasarım araçları ve mockup üretimi","metin":"*Uygulama dersi — ilk okumada \"Piksel ve vektör\" bölümünü, sahte SVG kutusunu ve \"Görsel kuralları\"nı oku. Adım listelerini Ödev 3.1'i yaparken ekran başında izle.*\n\n**Videoda:** Video 2, 39:29–1:04:40 (Illustrator); Video 2, 1:20:19–1:34:41 (Canva ve görsel imzası); sahte SVG: Video 5, 1:00:20–1:04:35.\n\n**Neden bu ders var?** İlanın yüzü görseldir ve görsel, mockup'tan yapılır. Bu ders üç şeyi birden verir: dosya bilgisi (PNG/SVG), araç bilgisi (Illustrator/Canva) ve üretim kuralları (30'a 30 kare, orantı, renk sürümleri, görsel imzası).\n\n**Piksel ve vektör.** Ekrandaki her görsel küçük karelerden oluşur. Bunlara **piksel** denir (Instagram'ın kare gönderisi 1080'e 1080 pikseldir, oradan bilirsin). **PNG** ve **JPG** piksel tabanlıdır: büyütünce kareleşir (\"pikselleşir\") ve renkleri kolay değiştirilemez. **SVG** ise vektöreldir: şekiller matematiksel çizgi olarak tutulur — bin kat büyüt, bozulmaz. Renkleri tek tıkla değişir. Bizim için önemi baskıdır: tasarım tişörte 20-22 santim genişliğinde basılır; kalitesiz dosya baskıda kare kare çıkar ve müşteri bunu hemen görür. **Kural: tasarım ya vektörel olacak ya da en az 2000 piksel ve 300 dpi PNG.** (Sınıftan gelen soruya cevap: çok yüksek kalite sorun değildir, \"sadece bilgisayarınızı yorar.\")\n\n> **Sahte SVG tuzağı (Video 5'ten).** Uzantısı SVG olan her dosya vektör değildir. Emin ekranda deniyor: bir PNG'nin uzantısını elle \"svg\" yapıyor: dosya SVG \"oldu\" ama içi hâlâ piksel. Daha sinsisi Canva'dır: sulu boya çiçek gibi hazır öğeler aslında PNG'dir; **\"SVG olarak indir\"** deseniz bile Illustrator'a alınca pikselleşir ve renkleri tek tek değiştirilemez. Gerçek SVG'de her parçanın rengi değişirdi. Çözüm: Canva'dan **şeffaf arka planlı PNG** indir ve PNG bilinciyle çalış. (Canva'nın gücü başka yerdedir: metin tasarımı, hazır yıldız-şekil ekleme, kırpma maskesiyle çiçekli yazı — bunlar kolaydır.)\n\n**Araç seçimi.** Photoshop (PS) piksel, Illustrator (AI) vektör tabanlıdır. İkisi de Adobe Creative Cloud'un ücretli programları (Emin'in Türkiye tahminiyle aylık 300-500 lira civarı; öğrenci indirimi, vergi numarası indirimi var — ücretsiz kullanmanın yollarını bulanlar da var, o senin araştırman). Canva ve Kittl tarayıcıda çalışan kolay araçlardır. Kursun yolu: **Canva ile başla. Ama iki-üç günde YouTube'dan kısa bir Illustrator ders dizisini izleye izleye uygula**. Telefonda video oynasın, bilgisayarda aynı adımları tekrar et. \"Canva bir süre sonra yetersiz kalır. Illustrator'ı iyi öğrenen arkadaşlar ayrıca para da kazanıyor.\"\n\n**Illustrator'da mockup — Emin'in ekran sırasıyla:**\n\n1. **Yeni dosya:** ölçü birimi **inç** (\"ben inç konuşacağım; siz de inç yapın ki aynı dilden konuşalım\"), çalışma yüzeyi (artboard) **30'a 30 inç**, taşma payı (bleed) **0**, renk modu **CMYK**, çözünürlük **300 ppi** — \"burayı bazen 72 olarak unutuyorsunuz; hayır, 300.\"\n2. Arayüz \"temel bilgiler\" düzeninde olsun: sağ üstte merceğin yanındaki menüden seçilir; sol ve sağ kısayollar görünür.\n3. **Dosya > Yerleştir (Ctrl+Shift+P)** ile mockup'ı (boş tişört fotoğrafı; Emin gruba gönderiyor, satın da alınabiliyor) içeri al.\n4. **Neden kare?** Etsy görselleri kare gösterir — telefonda da kare. Mockup'ı kare yüzeye yerleştirip fazlalıkları (mankenin ayakkabısı, dizleri) yüzeyin dışında bırakarak kırparsın. Siyah çerçevenin içi, export edilecek alandır.\n5. **Orantıyı koru:** büyütürken Ctrl+Shift basılı tut ya da genişlik-yükseklik alanındaki **zincir** simgesini kullan. Serbest çekiştirirsen \"manken şişmanlar\" — orantısız mockup, amatörlüğün ilk işaretidir.\n6. **Mesafe:** tişört ne çok uzak ne çok yakın. Çok uzaksa tasarım seçilmez (Emin'in ekranda bulduğu espresso'lu mama ilanı gibi — \"o kadar geride olmasına gerek yok\"). Çok yakınsa ürünün tişört olduğu anlaşılmaz. \"Ne olduğu belli olsun\" mesafesi idealdir.\n7. **Katmanı kilitle:** katmanlar panelinden mockup'a kilit koy — üzerinde çalışırken kaymaz.\n8. **Tasarımı yerleştir:** yakadan **üç-dört parmak** aşağıda, ortalanmış, gerçek baskı boyutuna yakın — kolun-saçın üstüne taşan dev tasarım olmaz, minicik de olmaz. Mankenin omzu eğikse tasarımı da hafif eğ. Gerçekçi dursun.\n9. **Renk sürümleri:** koyu tişörte açık, açık tişörte koyu tasarım — beyaz üstünde beyaz görünmez. Bu yüzden **her tasarımın en az beyaz ve siyah iki sürümü** olur: Düzenle > Renkleri düzenle > **Renkleri ters çevir** ile saniyede üretilir. Hangi kahverengiyi kullandığını unutmamak için tasarımı SVG olarak da sakla. Müşterinin aldığı renge göre doğru sürümü baskıya göndereceksin.\n10. **Export:** Dosya > **Ekranlar için dışa aktar (Ctrl+Shift+E)** → çalışma yüzeyini **1x PNG** olarak kaydet. (2x-4x ölçekler daha büyük dosya üretir; billboard-matbaa işleri içindir — baskı dosyasında 4x'i Modül 4'te kullanacağız.)\n\n**Canva'da aynı iş:** 30'a 30 inç tasarım oluştur → mockup'ı bırak → orantılı büyüt (Canva orantıyı kendisi korur), sağ-sol boşlukları eşitleyerek kırp → tasarımı ekle, küçült, yaka kuralı ve omuz eğimi aynı → **Paylaş > İndir > PNG (2880 piksel)**. JPG de olur mu? Sınıf sorusunun cevabı: \"Hiç fark etmez — Etsy yüklediğin her görseli kendi formatına çevirip küçültüyor\" (12,4 MB'lık PNG bile ~200 KB'lık WebP'ye iner). Tek sınır: **yüklenen dosya 10 MB'ı geçmesin.** Canva'da renk değiştirme sınırlıdır (filtre ve ayarlarla; tam siyah zor). Bu da Illustrator'ı öğrenmenin bir sebebi.\n\n**Görsel kuralları (Video 2'nin ekran incelemelerinden):**\n\n- Ürün fotoğrafının üzerine **yazı, yıldız, rozet konmaz**: \"more colors\", \"fast shipping\", \"super soft\" — hiçbiri. Sebebi: Etsy ilanlarını Facebook, Instagram ve Google'da reklam olarak gösterir (**Offsite Ads**) ve bu platformlar üzerinde yazı olan görselleri istemez; koyarsan görünürlüğün düşer. En fazla bir köşeye logo ya da rengin adı yazılabilir: \"ona da gerek yok. Fotoğrafta sadece sattığın ürün olsun.\"\n- **İyi color chart:** her rengin üzerinde tasarımın o renkteki hali durur (\"Pepper alırsan yazı beyaz gelir, Ivory alırsan siyah\"); sıralama alfabetik değil, **en çok satandan**: Pepper, Ivory, Espresso. Az satan renk (Crunchberry) mockup'a konmaz ama chart'ta durur — \"almak isteyen orada görsün.\"\n- **İlk görsel mankenli ve en çok satan renkte** olur.\n- Görsel sayısı: **en az 5 ürün görseli + 3-4 chart** = 8-10 görsel.\n\n**Görsel imzası — kopya görsel yeni mağazayı götürür.** Etsy yüklediğin dosyanın arka plan bilgilerini kaydeder: oluşturulma tarihi, kaynak program (Canva'dan geldiği yazar), boyutlar, renk profili, **signature**. Emin'e göre bunları **5-6 ay** hafızasında tutar. Gerçek vaka: bir mağaza kapandı; satıcı 2 ay sonra yeni mağaza açıp aynı görselleri kullandı. Yeni mağaza da askıya alındı (**suspend**). Aynı mockup dosyasını iki kişi yüklerse Etsy \"bunlar birbirini kopyalıyor\" muamelesi yapar. \"Cache temizlemenin yolları var, uğraşıyorlar, hiç gerek yok. **Herkes mockup'ını kendi bilgisayarında kendisi oluşturacak.**\" Eğitmenin gönderdiği hazır dosyayı bile olduğu gibi yükleme. Kendin yeniden işle.\n\n**En sık yapılan hata ve sonucu.** Orantısız büyütme (şişman manken), 72 ppi'da kalmış dosya (baskıda karelenme → müşteri şikayeti), görsele \"fast shipping\" yazmak (görünürlük kaybı) ve hazır mockup'ı aynen yüklemek (kopya muamelesi, suspend riski). *(Videoda: Video 2, 1:25:34–1:26:14.)*\n\n**Gerçek bir öğrenciden.** Sözlü kontrolün klasik yanılgısı bu derste çıktı: öğrenci PNG ile SVG'yi **ters** anlattı — SVG'yi \"fotoğraf gibi\" sandı, piksellilik tarifini ona yapıştırdı. Renk mantığını (siyah tişörte siyah tasarım olmaz) doğru bilmesi onu kurtarmadı. Dosya farkı bu işin temelidir. Şöyle aklında tut: **PNG'nin P'si piksel'in P'si.** SVG ise vektördür: sonsuz büyür, rengi tek tıkla değişir. Bu ikisini karıştıran, yukarıdaki Canva tuzağına da kolay düşer. *(Videodaki yeri: Video 2, 40:11–42:50; sahte SVG: Video 5, 1:00:20–1:04:35.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 39:29–1:04:40.*\n1. PNG-SVG farkını ve 2000 piksel / 300 dpi eşiğini bir baskı senaryosuyla anlat. Hangisi piksel, hangisi vektör — tereddütsüz söyle. Tersini söyleyen birini nasıl düzeltirdin?\n2. Illustrator akışının beş kritik ayarını say: birim, yüzey, bleed, renk modu, çözünürlük.\n3. Canva'nın \"SVG olarak indir\" tuzağı nedir. Doğru indirme ne?\n4. Görsel imzası vakasını anlat: ne yapıldı, ne oldu, kural ne?\n5. Görsele \"fast shipping\" yazmanın zararı nereden gelir — Etsy'nin içinden mi, dışından mı? Mekanizmayı anlat.","video":2,"damga":"39:29","sn":2369},{"ders":"3.6","modul":3,"baslik":"Title: 140 karakterlik olta","metin":"**Videoda:** Video 1, 57:14–1:03:57.\n\n**Neden bu ders var?** Çünkü milyonlarca ilan arasında üst sıraya çıkamayan ilan satmaz — ve sıralamanın ilk anahtarı başlıktır.\n\n**Kurallar.** Title en fazla **140 karakterdir** (Emin videoda önce 200 sanıp ekranda sayarak 140'ı doğruluyor — kontrol etme refleksi de dersin parçası). **İlk 4-5 kelime, yani ilk 40 karakter en değerli kısımdır:** görseli birebir tanımlamalı ve müşterinin arama kutusuna gerçekten yazacağı ifade olmalıdır.\n\nMüşteri nasıl arar? Uzun ve belirli arar. Emin'in gündelik örneği: arabana lastik alacaksın — \"araba lastiği\" yazmazsın; \"Toyota Corolla 2015 lastik\" yazarsın. Tişörtte de kimse \"tişört\" diye aramaz. Matematik öğretmenine hediye arayan, \"funny math teacher shirt\" yazar. Bu uzun-belirli ifadelere **long tail keyword** denir: arayan azdır ama arayan tam onu istiyordur. Ve rekabet düşüktür (Ders 3.2'deki 12 milyonluk kelimelerin panzehiri).\n\n**Tekrar yasağı ve çapari benzetmesi.** Kötü örnek ekranda: \"nurse nurse nurse gift nurse tee\" — aynı kelime beş kez. \"Bu yanlış. Kesinlikle olmaz.\" İyi başlık, birbirinin üstüne binmeyen, hepsi konuyla ilgili **farklı** kelimelerden oluşur. Benzetme: tek kancalı olta yerine **çapari** at. Üzerinde 20 kanca olan takım; bir çekişte sekiz-on balık ihtimali. Her farklı kelime, farklı bir aramadan müşteri yakalayan bir kancadır. ChatGPT'nin ürettiği örnek başlığı Emin bu gözle beğeniyor: \"ER Nurse Shirt for Women, Emergency Room Nurse Gift, Funny RN T-Shirt, Registered Nurse Tee\", long tail var, tekrar yok.\n\n**İki üretim yöntemi.**\n\n*Yöntem 1 — ChatGPT (Video 1):* Bilmediğin kısaltmayı önce sor (\"ER nurse ne demek?\" (acil servis hemşiresi; \"ICU nurse?\") yoğun bakım hemşiresi). Sonra iste: \"Bu konuda bir Etsy ilanı açıyorum. Arama hacmi yüksek kelimelerle, long
