n\n**Neden bu ders var?** Şikayet gelecek — yırtık ürün, yanlış beden, ezilmiş paket, baskı hatası. Panik protokolün düşmanıdır. Kursun protokolü ise dört adımdır.\n\n**Adım 1 — Sakinleştir.** İlk mesaj savunma değil, empati ve sahiplenmedir. Emin'in kalıbı: \"Merhaba Juana. Tişörtünün bu şekilde yırtık gelmesini görünce **şok oldum.** Bunun ne kadar can sıkıcı olduğunu anlıyorum. Üstelik bu bir doğum günü tişörtüydü. Bunun nasıl olduğunu hemen çözüp sana döneceğim.\" Suçlu aramak yok, \"kargo firmasının hatası\" yok, önce müşterinin duygusu.\n\n**Adım 2 — Fotoğraf iste.** \"Bana bir fotoğraf atabilir misin?\" Fotoğraf, hem sorunu teşhis eder hem üreticiyle konuşmanın belgesidir.\n\n**Adım 3 — Üreticiye danış, cevabı birlikte kur.** Müşteriye dönmeden (ya da ilk sakinleştirme mesajından hemen sonra) üreticiye yaz. Üretici kontrol eder: \"Bu bizden böyle gitmiş olabilir. Özür dileyip yenisini teklif edin\" ya da \"bu kargoda olmuş.\" İlk vakalarını mutlaka bu köprüyle yönet; zamanla refleks oturur.\n\n**Adım 4 — Zarar paylaşımı ve çözüm.** Kural: **hata kimdeyse zararı o öder.** Üretim hatasıysa (defolu baskı, yanlış ürün) yeniden gönderimin maliyeti üreticinindir. Ama hata sendeyse: Emin'in örneği: müşteri **kahverengi bacaklı** tasarımı istedi, yönetici üreticiye **sarı bacaklı** dosyayı gönderdi. \"üretici 'bana verdiğin dosyayı bastım' der ve haklıdır. Yeni tişörtü **kendi cebinden** ödersin.\"\n\nÇözüm yelpazesi:\n\n- **Kısmi iade (partial refund):** küçük kusurlar için. \"Let's Go, Girls yazısındaki virgül unutulmuş — kusura bakma, 5 dolar iade edeyim, yenisini göndermeyeyim?\" Müşteri çoğu zaman kabul eder: \"Olur, konuyu kapatalım.\" Tişörtte küçük bir iplik çıkmış. \"kesiver, 5 dolar iade edeyim.\" Mantığı: yeniden basıp göndermek her zaman daha pahalıdır. 5 dolar, zararı küçültür. **Ama sınırı bil:** hassas konularda kısmi iade teklif edilmez. Bacak rengi vakasında 10 dolar teklif etsen müşteri kabul etmez: \"ve kabul etmemekte haklıdır. Bu önemli bir konu.\" Orada doğru çözüm, doğrusunu basıp göndermektir.\n- **Yeniden gönderim:** kusur büyükse, ürün kullanılamazsa.\n- **İptal + tam iade:** bazen tek çözüm. \"Müşteri doğum günü için almıştı, doğum günü cumartesiydi, ürün defolu geldi — yenisini göndersen ne işe yarar? Doğum günü geçti.\" Cancel edilir, paranın tamamı iade edilir, özür dilenir.\n\n**\"Delivered ama almadım\" — case protokolü.** Takip sayfası teslim edildi diyor (Ders 4.9: \"at the door\", \"security gate\" notunu önce oku ve müşteriye söyle); müşteri \"paketim yok\" diyorsa: paket kapıdan çalınmış, komşu almış olabilir. **bunu müşteriye söylemezsin.** Şablon: \"Çok özür dilerim Brittany, bu nasıl oldu bilmiyorum. Siparişini 27'sinde kargoladım. 30'unda teslim edilmiş görünüyor. **Etsy'de bir case açabilir misin?** Etsy ikimiz adına en doğru kararı verecektir.\"\n\n**Case**, müşterinin Etsy nezdinde açtığı şikayet dosyasıdır. Dosyaya bir müşteri temsilcisi atanır ve inceler: sipariş zamanında kargolanmış mı (evet), takip delivered gösteriyor mu (evet) — \"satıcının sorumluluğunda değil\" der ve **Etsy zararı kendi cebinden öder**; kursun aktardığı çerçeve, 200-250 dolara kadar bir koruma politikasıdır. Senin işin süreci kibarca case'e yönlendirmek: ne müşteriyle tartışırsın, ne zararı hemen üstlenirsin. (\"Binlerce özel durum var, karşılaştıkça birlikte çözeceğiz\", Emin'in notu; ilk case'ini eğitmeninle yönet.)\n\n**En sık yapılan hata ve sonucu.** Savunmayla açmak (\"bizden öyle gitmez!\") — müşteri büyütür, case oranın işler (Ders 4.11'deki %1 eşiği). Fotoğrafsız çözüm önermek. Hassas konuda kısmi iadeyle \"fit olmaya\" çalışmak. \"Almadım\" diyene cepten yeni ürün basmak (Etsy'nin ödeyeceği zararı sen ödersin). *(Videoda: Video 3, 1:13:33–1:13:55.)*\n\n**Gerçek bir öğrenciden.** \"Müşteri sinirli, ürün yanlış geldi — ilk adım ne?\" sorusuna öğrenci doğrudan zarar paylaşımına atladı: kim ödeyecek, yeniden mi basılacak… Bildikleri doğruydu ama **sıra** yanlıştı. İlk adım her zaman sakinleştirmedir: özür + ilgi + fotoğraf ricası. Zarar konuşması, müşteri sakinleşip fotoğraf geldikten sonra başlar. Sırayı atlarsan, doğru çözümü bile kavgalı bir müşteriye anlatmak zorunda kalırsın. *(Videodaki yeri: Video 3, 1:13:33–1:13:55.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 1:13:09–1:17:07.*\n1. Dört adımı sırasıyla ve ilk mesajın kalıbıyla anlat.\n2. Sarı bacak vakasında zararı kim, neden ödedi?\n3. Kısmi iadenin işe yaradığı iki örnek ve yasak olduğu bir örnek ver.\n4. Case protokolünü şablon cümlesiyle kur. Etsy neye bakıp kararını verir?","video":3,"damga":"1:13:09","sn":4389},{"ders":"5.4","modul":5,"baslik":"Custom isteklerden pazarlama çıkarmak","metin":"**Videoda:** Video 3, 1:17:26–1:21:42.\n\n**Neden bu ders var?** Çünkü müşterinin her özel isteği iki şeydir: hazırlanacak bir sipariş — ve bazen, kimsenin görmediği bir pazar sinyali.\n\n**Temel kural: değişiklik ilana işlenmez.** Sınıf sorusu buradan geldi: \"Müşterinin isteğiyle üründe değişiklik yaptık — listing'i güncellememiz gerekiyor mu?\" Emin: \"Hayır, hiç gerekmiyor.\" Müşteri \"Frasers Ridge yerine başka isim yaz\" dedi; hazırlar gönderirsin. İlanın görseli değişmez. Satış da o ilanın istatistiğine yazılır (ikinci sınıf sorusunun cevabı: \"Tabii, aynen, o satış bu listing'i etkiler\"). Zaten \"your logo here\" tipi tam custom ilanlarda her sipariş farklıdır. Sipariş notunda ne yazıyorsa onu hazırlarsın (\"The Women's Club, öne büyük, arkaya küçük\" gibi).\n\n**Sinyal okuma.** Emin'in gerçek örneği: \"Feral Mama\" tasarımı için bir müşteri \"somebody's feral mama\"yı **\"somebody's feral wife\"** yaptırmak istedi. Sipariş hazırlandı — ama Emin'in yöneticiye asıl notu şuydu: \"Demek ki böyle bir beklenti var. Madem bir müşteri bunu istedi, **'feral wife comfort colors shirt' diye yeni bir ilan aç.** Genellikle anne gözüyle alınıyor ama karısına almak isteyen de var. Feral wife gider, feral sister gider…\" Tek bir custom istek, bir ilan ailesinin kapısını açtı. Kural: sıra dışı bir istek geldiğinde kendine sor. \"bunu isteyen tek kişi mi, yoksa ben bir talebin ilk örneğini mi görüyorum?\"\n\n**En sık yapılan hata ve sonucu.** Her custom istek için ilanı güncellemek (gereksiz iş, ilan istikrarı bozulur) — ya da tam tersi: sinyali görmemek (feral wife'ı hazırlayıp göndermek ve arkasından yeni ilanı hiç açmamak, bedava pazar araştırmasını çöpe atmak). *(Videoda: Video 3, 1:17:26–1:21:42.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 1:17:26–1:21:42.*\n1. Custom değişiklikte ilana ve istatistiğe ne olur?\n2. Feral wife hikayesinden çıkan iki karar neydi?\n3. \"Sinyal mi, tek seferlik istek mi?\" sorusunu nasıl cevaplarsın?","video":3,"damga":"1:17:26","sn":4646},{"ders":"5.5","modul":5,"baslik":"Yorum ricası ve Share and Save","metin":"**Videoda:** Video 3, 1:22:36–1:27:20.\n\n**Neden bu ders var?** Çünkü yeni mağazanın kaderini ilk yorumlar belirler — ve Etsy'nin satıcıya tek somut ikramı da bu derste.\n\n**İlk yorumlar neden kritik?** Emin'in anlattığı zincir: mağaza ilk siparişlerinden **beş yıldızlı, fotoğraflı** yorumlar alırsa Etsy şöyle düşünür — \"Güzel bir satıcı var, müşteriler memnun olmaya başladı. Dur, bir-iki sipariş daha aldırtayım, görünürlüğünü yükselteyim.\" Bir-iki satış daha, bir-iki beş yıldız daha: \"Tamam, bu buradan yürüsün.\" Kazan-kazan üçgeni: memnun müşteri Etsy'ye kazandırır, Etsy sana kazandırır. \"Etsy bu üçgen devam etsin istiyor.\"\n\n**Rica mesajı.** Teslimattan sonra kısa, samimi, tek paragraf: \"Merhaba Brenda! Siparişinin sana ulaştığını görüyorum — umarım beğenmişsindir. Beş yıldızlı, fotoğraflı bir yorum bırakırsan beni dünyalar kadar mutlu edersin. Küçük bir mağazayım ve bu benim için çok önemli.\" Kurallar: **kurumsal dil yasak**. Emin kötü örneği tiye alıyor: \"'Müşteri memnuniyeti bizim için çok önemlidir. Sizi memnun etmek için bu tişörtü hızla kargoya verdik…'. Hayır.\" ChatGPT'ye yazdırılmış hissi de yasak; düz, insan gibi, araya bir-iki emoji.\n\n\"Beni havalara uçurursun\" gibi ifadeler kullanan satıcıların müşterilerinden \"ne demek, hemen gönderiyorum!\" cevapları aldığını görüyor — bu dil çalışıyor. Uzunluk: \"üç paragraf, 300-500 kelime değil. Kısa ve öz.\" Sınıf sorusuna cevap: evet, **başlangıçta bütün siparişlere** gönder; \"ilk order'dan beş yıldızlı görüntülü yorumu acilen alması lazım mağazanın.\"\n\n> **Videolarda yok — sonradan eklendi, doğrulanmalı:** Etsy'de yorum karşılığında hediye, indirim ya da başka bir teşvik vaat etmek kurallara aykırıdır. Kurstaki mesaj yalnızca ricadır ve karşılık vaat etmez. Bu çizgiyi koru; \"yorum bırakırsan şunu veririm\" cümlesi asla kurulmaz.\n\n**Share and Save — Etsy'nin tek ikramı.** Sınıftan gelen soruya (\"Etsy'nin mağazayı öne çıkarmaktan başka ikramı var mı, indirim falan?\") Emin: \"Yok. Etsy'nin size sunduğu ekstra bir şey yok. Bir tek **Share and Save** var.\" Mekanizma: her ilanın edit sayfasında bir paylaşım linki verilir. O linki Instagram'da, Facebook'ta paylaşır ya da doğrudan müşteriye gönderirsin. **sipariş o linkten gelirse Etsy, kestiği ücretlerden birini almaz.** \"Diyor ki: sen bana Instagram'dan trafik getirmişsin; seni teşvik ediyorum.\" (Hangi ücret, yüzde kaç, Emin ekranda emin olamıyor: \"%5 mi %6 mı, processing mi transaction mı, bakarız\"; Stats'te gerçek etkisini görmüştün: 12 paylaşım, 2 sipariş, ~30 dolar tasarruf, Ders 4.11.)\n\n> **Videolarda yok — sonradan eklendi, doğrulanmalı:** Etsy'nin resmî Share & Save programında, kendi paylaştığın linkten gelen siparişlerde sipariş tutarının %4'ü satıcıya geri verilir. Oran değişebilir; Ek F'teki tabloda \"kontrol et\" notuyla durur.\n\n**En sık yapılan hata ve sonucu.** Kurumsal dille rica etmek (müşteri hissetmez, yazmaz). Yorum karşılığı vaat (kural ihlali). Share and Save linkini hiç kullanmamak (bedava iade edilen kesintiyi masada bırakmak). *(Videoda: Video 3, 1:23:50–1:24:13.)*\n\n**Gerçek bir öğrenciden.** \"Teslimattan sonra müşteriden ne istenir?\" sorusuna öğrenci \"kupon veririz\" diye cevap verdi — iki ayrı aracı tek şey sanmıştı. Ayrımı net kur: teslimattan sonra istenen şey **beş yıldızlı, fotoğraflı yorumdur** ve bu bir **ricadır**. Karşılığında hiçbir şey vaat edilmez. Kupon ise ayrı bir sistemdir (Ders 4.12): Etsy'nin otomatik teşekkür-favori-sepet kuponları kendi kanalında zaten çalışır. İkisini aynı mesajda birleştirdiğin an (\"yorum bırak, kupon vereyim\") yukarıdaki kutunun çizdiği kural ihlali çizgisini geçersin. *(Videodaki yeri: Video 3, 1:22:44–1:23:10; kupon sisteminin ayrı dünyası: Video 4, 48:06–59:49.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 1:22:36–1:27:20.*\n1. İlk yorumların tetiklediği zinciri Etsy'nin iç sesiyle anlat.\n2. Rica mesajının beş kuralını say: zaman, uzunluk, dil, içerik, sınır.\n3. Share and Save mekanizmasını ve senin yapacağın hamleyi anlat.\n4. \"Yorum bırakana %20 kupon veriyorum\" mesajının nesi yanlış? Yorum ricası ile kupon sistemini birbirinden ayır.","video":3,"damga":"1:22:36","sn":4956},{"ders":"5.6","modul":5,"baslik":"Marka güvenliği rutini: tarama, liste, riskli alanlar","metin":"**Videoda:** Video 2, 28:20–31:06; mağaza taraması: Video 3, 29:21.\n\n**Neden bu ders var?** Modül 3'te yasak listeyi ve cezaları öğrendin. Bu ders, o bilgiyi günlük çalışan bir rutine çevirir — çünkü marka güvenliği tek seferlik kontrol değil, süreklilik ister.\n\n**Rutinin üç parçası.**\n\n1. **Her yeni konuda tarama.** Konu seçtin (Ders 3.1) — ilan açmadan önce iki kontrol: kelime **yasak listede mi** (Ek G; Emin'in grupla paylaştığı, güncellenen liste, \"buradan takip edebilirsiniz, acil kapatılması gerekenleri de oraya yazıyoruz\") ve emin değilsen **USPTO araması** (Ders 5.8). Herkesin bildiği isimlerde aramaya bile gerek yok: Harry Potter, Taylor Swift. Direkt hayır.\n2. **Mağazanı tarayabilir ol.** Bir kelime aniden trademark olursa (liste güncellenir, haber gelir), Listings'teki **kelime aramasıyla** o kelimeyi geçen bütün ilanlarını süz (Ders 4.2) ve **kendin kapat** — şikayet gelmeden. Bulk edit'le tag temizliği de aynı hamlenin parçası (Ders 4.4'teki \"Throne of Glass\" senaryosu).\n3. **Riskli alanları bil.** Trend listelerindeki tescilli konular (Ders 3.2). Konser tişörtü tuzağı (\"bir hafta önce açıp yüz satıp kapatanlar var — yakalanırsan ilan, tekrarında mağaza gider; yeni mağaza bu riske girmez\"). Ve \"süresi dolmuş karakter\" söylentileri (Pooh nüansı, Ders 3.4, danışmadan açma).\n\n**Çizgiyi hatırla.** Cezalar Modül 3'ten: büyük mağazada ilanlar kapanır + uyarı; yeni mağazada bilinen isimde üçüncü ihlal = mağaza. \"İsterseniz 100.000 satış yapın — ihlal birikirse (10 oldu, 5 oldu, 3 oldu) gözünün yaşına bakmaz, mağazayı kapatır. Küçük, bilinmeyen konularda ise problem olmaz.\"\n\n**En sık yapılan hata ve sonucu.** Taramayı yalnız yeni ilanlarda yapmak: eski ilanların, kelime sonradan tescillenince mayına döner — süzüp temizlemeyen mağaza, şikayeti bekleyen mağazadır. *(Videoda: Video 2, 28:20–31:06.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 2, 28:20–31:06.*\n1. Rutinin üç parçasını say.\n2. \"Kelime aniden trademark oldu\" senaryosunda hangi iki panel aracını kullanırsın?\n3. Konser tişörtü neden tuzak?","video":2,"damga":"28:20","sn":1700},{"ders":"5.7","modul":5,"baslik":"Bir ilanın kapatılırsa: Glock protokolü","metin":"**Videoda:** Video 3, 26:10–28:19.\n\n**Neden bu ders var?** Ne kadar dikkatli olursan ol, bir gün Inactive listesinde Etsy'nin kapattığı bir ilan görebilirsin. O an yapacakların, mağazanın geleceğini belirler — ve kursta bunun yaşanmış, adım adım bir örneği var.\n\n**Vakanın kendisi.** Emin'in mağazasında elinde silah olan bir kurbağa tasarımı: üzerinde \"my Glock\" yazıyor. Glock bir silah markası — şirket Etsy'ye şikayet etti: \"Ben bu markayı inşa etmek için yıllardır çaba harcıyorum. Bu satıcı ismimin üzerinden ticari gelir elde ediyor.\" Etsy ilanı **anında** kapattı; gerekçe e-postayla geldi (Etsy'nin kapattığı her ilanda gelir, Ders 4.2).\n\n**Protokolün iki hamlesi.**\n\n1. **Benzerlerini kendin kapat.** Kapatılan ilanın sağında solunda aynı kelimeyi geçen başka ilanlar vardı — biri **1.200 satmış**, ötekiler 113, 20, 4. \"Etsy bunu kapatınca biz hemen o listingleri **kendimiz deaktive ettik.** Neden? O marka onları da şikayet eder.\" Şikayet edilmeden kapatılan ilan, dosyana yeni bir ihlal olarak girmez. (Aracın Ders 4.2'de: kelime aramasıyla süz, topluca kapat.)\n2. **Markaya kibar bir e-posta yaz.** Emin'in mektubunun içeriği — aynen bu tonda: \"Değerli Glock markası sahibi; böyle bir ismi tescil ettiğinizi biliyorduk, fakat bunun Etsy'de şikayete konu olacağını bilmiyorduk, hata ettik, özür dileriz. Ben Etsy'de küçük bir satıcıyım ve bu durum mağazama çok zarar veriyor. Bilseydim, bana bir mesaj atsaydınız ilanı derhal kapatırdım. Şikayetinizi geri çekerseniz çok sevinirim. Bu ilanı yeniden açmayı düşünmüyorum ve benzer bütün ilanlarımı da kapattım. İlginiz için teşekkür ederim.\" Neden değer? \"Marka şikayeti geri çekerse, **Etsy bunu senin hanene pozitif işler.**\"\n\nGeri çekilmez ve ihlaller birikirse zincirin sonu Modül 3'ten tanıdık: \"10 oldu, 5 oldu, 3 oldu — yeter deyip mağazayı kapatır; 100.000 satış da yapsan.\"\n\n**En sık yapılan hata ve sonucu.** Kapatılan ilanı görmezden gelip benzerlerini yayında bırakmak — markanın ikinci ve üçüncü şikayetini davet etmek. Ya da markaya öfkeli bir cevap yazmak (hiçbir kazancı yok, geri çekilme ihtimalini öldürür). *(Videoda: Video 3, 27:15–27:59.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 3, 26:10–28:19.*\n1. Protokolün iki hamlesini sırasıyla ve gerekçeleriyle anlat.\n2. Mektubun beş yapı taşını say: özür, cehalet beyanı, küçüklük, telafi, rica.\n3. Şikayetin geri çekilmesi ne kazandırır?","video":3,"damga":"26:10","sn":1570},{"ders":"5.8","modul":5,"baslik":"USPTO araması: pending, registered ve sınıf mantığı","metin":"**Videoda:** Video 5, 1:12:38–1:21:52.\n\n**Neden bu ders var?** Yasak liste bilinen isimleri tutar. Ya listede olmayan yeni bir kelime? Kontrolün resmî adresi **USPTO**'dur — Amerikan patent ve marka ofisi. Bütün marka tescilleri ve başvuruları orada aranır. Bu ders Video 5'in kapanış dersidir ve bir öğrencinin gerçek sorusu üzerine işlenmiştir (\"Velaris tasarımları yaptım; başvurusu yapılmış dediler, ne olacak?\").\n\n**Arama nasıl yapılır?** USPTO'nun trademark arama sayfasında kelimeyi arat. Sonuçlarda **goods and services** alanına bak — tescil **sınıf sınıf** yapılır: makyaj ayrı sınıftır, mum ayrı, çanta ayrı, **tişört/giyim ayrı.** Bizi ilgilendiren, kelimenin **shirt/giyim sınıfındaki** durumudur. Üç durum görürsün: **registered** (tescilli, kullanma), **pending** (başvurulmuş, henüz tescillenmemiş), **cancelled/dead** (düşmüş).\n\n**Velaris örneği — ekrandan.** \"Velaris\" ve \"City of Starlight\": başvuru **31 Aralık 2024**'te yapılmış, durum **pending**; statü güncellemesi Şubat 2025. Kursun görüşü: \"Şu an bu kelimeyle ilan açabilirsin. Başvuru sahibi kapattıramaz, çünkü tescil edilmedi. Ama bu bir gün tescillenecek. Muhtemelen önümüzdeki bir-iki ay içinde. **Zamanı gelince ben size 'şu değişiklikleri yapın' diyeceğim.**\" Yani pending, \"serbest\" değil \"süreli ve takipli\" demektir: tarihi not edersin, eğitmenle izlersin. *(Video 2'nin trademark sertliğiyle bu dersin pending esnekliği arasındaki gerilim için Eğitmen Rehberi'ndeki Çelişkiler bölümüne bakın, pratik kural orada net: danışmadan açma.)*\n\n**Tescil süreci neden yavaş ve ciddi?** Tek bir sınıfta tescil bile \"en hızlı şartlarda 4,5-5 ay sürer\" — çünkü ofis her başvuruda o sınıftaki mevcut markaları ve benzer isimleri araştırır: \"Nike varken 'Nake'i, Adidas varken 'Abidas'ı tescil ettiremezsin. 'sen tüketiciyi yanıltıcı derecede taklit ediyorsun' der, reddeder.\" Velaris başvurusu ise çok sınıflı: makyaj, mum, çanta, takı, kitap, tişört. Her sınıf ayrı incelenecek.\n\n**İki ünlü zaman çizgisi — tescil kullanıldıkça genişler.**\n\n- **Glock:** 1970'lerde silah markası; bıçaklar ve hendek aletleri sınıfında **2002** başvuru / **2003** tescil; uzun kollu tişört sınıfında **2014** başvuru / **2020** tescil; ayrıca airsoft (havalı) silahlar. Ders: \"O silah markası, giyimle ilgisi yok\" savunması geçmez — Glock tişört sınıfını da almış.\n- **Taylor Swift:** önce müzikte; sonra tişört, şapka, çanta; insanlar cüzdan yapıp satmaya başlayınca deri ürünlerinde; \"Taylor Swift\" yazamayan satıcılar \"Swiftie\" yazmaya başlayınca **Swiftie** kelimesi (tote bag ve tekstil sınıflarında); sonra albüm adları. \"Millet bir kelimeyle para kazandıkça marka sahibi gidip o sınıfı da tescil ettiriyor: 'Benim adımı kullanarak para kazanamazsın — telif ödersin.'\"\n\nBugün boş görünen sınıf yarın dolabilir: bu yüzden pending takip edilir, liste güncel tutulur ve emin olunmayan her kelime eğitmene sorulur.\n\n**En sık yapılan hata ve sonucu.** Kelimeyi genel aramada \"temiz\" görüp sınıfa bakmamak (müzikte tescilli sanıp tişörtte serbest zannetmek — ya da tersi). Pending'i \"serbest\" okuyup tarihsiz, takipsiz ilan açmak (tescil günü geldiğinde ilanların hazırlıksız yakalanır). *(Videoda: Video 5, 1:13:04–1:13:37.)*\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 1:12:38–1:21:52.*\n1. Aramada hangi alana bakılır ve üç durum nedir?\n2. Velaris kararını kursun ağzından, iki şartıyla anlat.\n3. Glock ve Taylor Swift çizgilerinden çıkan ortak kural ne?","video":5,"damga":"1:12:38","sn":4358},{"ders":"5.9","modul":5,"baslik":"Kursun kapanışı: birebir döneme geçiş","metin":"**Videoda:** Video 5, 1:22:22–1:23:14.\n\n**Neden bu ders var?** Çünkü kursun bitişi, işin başlangıcıdır — ve Emin son videoda bundan sonrasının nasıl işleyeceğini açıkça anlatıyor.\n\n**Emin'in kapanış konuşmasının özü.** \"Bu bahsettiğim şeylerin çoğunu internette de bulursunuz — 'Etsy'de mağaza nasıl açılır' yazın, elli video çıkar. Ama **asıl iş nüanslarda:** Velaris benzeri bir konu hangi tarihte, hangi kelimelerle, nasıl açılır. Bunlar birebir çalışırken paylaşılır. Bundan sonrası birebir iletişimimize bakacak: mağaza açmaya karar verdiğinde bana yaz; adım adım ne yapacağını Zoom'da yeniden, uygulamalı olarak üzerinden geçeceğiz. Çünkü ilk dinleyişte akılda kalmıyor.\" Üretici tarafı da aynı kapıya çıkıyor (Ders 4.15): seçenekler ve şartlar, ilk sipariş geldiğinde masaya gelir.\n\nKapanışta öğrenci tasarımlarına verdiği son notlar, kursun özeti gibidir: \"Hoodie'nin cebinin üstüne bu kadar büyük baskı olmaz — küçült\" (ölçü ve ürün bilgisi); \"kol baskısını 'sağ kol dış' diye belirteceksin\" (baskı notları); \"şu kelimeleri kullanma\" (marka güvenliği). Üç modülün dersi, üç cümlede.\n\n**Senin bu programdan çıkman gereken yer.** Program seni \"her şeyi bilen\" yapmadı — \"eğitmenle verimli çalışan\" yaptı: dili biliyorsun, kuralların gerekçelerini biliyorsun, panelde elin yatkın, soracağın soruları yazdın. Emin'in öğrenci gözlemini de unutma: ekranını paylaşıp yorum alan \"1-0 önde\"; en çok soru soran, en başarılı olan.\n\n**Kendini kontrol et:**\n*Yanlış cevap verdiysen: Video 5, 1:22:22–1:23:14.*\n1. \"Asıl iş nüanslarda\" cümlesini bir örnekle aç.\n2. Birebir dönem nasıl başlıyor — senin atacağın ilk adım ne?\n3. Kapanıştaki üç tasarım notu hangi üç dersin özetiydi?","video":5,"damga":"1:22:22","sn":4942}],"videolar":{"1":"M4aKSYoKr40","2":"8HXnMkaGzkc","3":"_Uayq-tPQsk","4":"_Qe8eoyppgM","5":"UFrGPjG6fAc"},"modulAd":{"1":"Etsy'nin Mantığı","2":"Mağaza Kurulumu","3":"İlan Üretimi","4":"Sipariş ve Mağaza Yönetimi","5":"Müşteri İlişkileri"}};

/* ==================================================================
   yardımcılar
   ================================================================== */
function $(id){ return document.getElementById(id); }
function ky(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function coz(b){
  var ikili = atob(b), n = ikili.length, dizi = new Uint8Array(n);
  for(var i=0;i<n;i++) dizi[i] = ikili.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8").decode(dizi));
}
function karistir(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function dk(sn){
  var d = Math.floor(sn/60), s = sn%60;
  return d + ":" + (s<10 ? "0"+s : s);
}
function benzersiz(a){
  var g = {}, c = [];
  for(var i=0;i<a.length;i++) if(!g[a[i]]){ g[a[i]]=1; c.push(a[i]); }
  return c;
}

   ================================================================== */
var KUPE = {}, MODULKUPE = {1:[],2:[],3:[],4:[],5:[]};
V.kupeler.forEach(function(k){ KUPE[k.id]=k; MODULKUPE[k.modul].push(k); });

var SORU = {}, OYUNH = {1:[],2:[],3:[],4:[],5:[]}, SINAVH = {1:[],2:[],3:[],4:[],5:[]}, FINALH = [];
V.sorular.forEach(function(q){
  SORU[q.id]=q;
  var m = KUPE[q.kupe].modul;
  if(q.havuz==="oyun") OYUNH[m].push(q);
  else if(q.havuz==="sinav") SINAVH[m].push(q);
  else FINALH.push(q);
});

var KUPEKURAL = {};
V.kurallar.forEach(function(k){
  (KUPEKURAL[k.kupe] = KUPEKURAL[k.kupe] || []).push(k);
});

var DERS = {}, KUPEDERS = {};
V.dersler.forEach(function(d){ DERS[d.ders]=d; });
V.kupeler.forEach(function(k){
  KUPEDERS[k.id] = k.dersler.map(function(x){ return DERS[x]; }).filter(Boolean);
});

function kupeAd(id){ return KUPE[id] ? KUPE[id].ad : id; }
function modulAd(m){ return V.modulAd[String(m)] || ("Modül "+m); }
/* Liste satiri: uzun ad zaten kisa adi icerir; ikisini yan yana yazmak
   ayni kelimeleri iki kez okutuyordu. Ust satir ilk iki nokta ustuste
   isaretine kadar, alt satir kalani. */
function konuSat(id){
  var u = KUPE[id] ? KUPE[id].uzunAd : id;
  var i = u.indexOf(": ");
  if(i < 0) return '<div class="sat">' + ky(u) + '</div>';
  return '<div class="sat">' + ky(u.slice(0, i))
       + '<span class="kucuk">' + ky(u.slice(i + 2)) + '</span></div>';
}
function ytBaglanti(video, sn){
  var k = V.videolar[String(video)];
  if(!k) return null;
  return "https://www.youtube.com/watch?v=" + k + "&t=" + Math.max(0,sn|0) + "s";
}

/* ==================================================================
   kayıt katmanı — modül sınırında yazılır
   ================================================================== */
var ANAHTAR = "etsy-oyun-v1";
var BOS = {
  s:1, tamam:[], kayip:{}, emin:[], zor:{},
  finalKayip:0, finalKacirilan:[], ucKayipKupe:[], finalDonus:[],
  gorulen:[], muzik:false, isinmaBitti:false, kuralGoruldu:false, bitti:false
};
var D = null;

function yukle(){
  D = JSON.parse(JSON.stringify(BOS));
  try{
    var ham = localStorage.getItem(ANAHTAR);
    if(ham){
      var o = JSON.parse(ham);
      if(o && o.s === 1){ for(var a in BOS) if(o[a] !== undefined) D[a] = o[a]; }
    }
  }catch(e){ /* depolama kapalıysa oturumluk oynanır */ }
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(D)); }catch(e){}
}
function sifirla(){
  try{ localStorage.removeItem(ANAHTAR); }catch(e){}
  D = JSON.parse(JSON.stringify(BOS));
}

/* ==================================================================
   sıradaki adım
   ================================================================== */
function siradaki(){
  if(D.bitti) return {tip:"bitti"};
  if(D.finalDonus.length) return {tip:"finalDonus", modul:D.finalDonus[0]};
  for(var m=1;m<=5;m++) if(D.tamam.indexOf(m)<0) return {tip:"modul", modul:m};
  if(!D.kuralGoruldu) return {tip:"kural"};
  if(!D.isinmaBitti) return {tip:"isinma"};
  return {tip:"final"};
}

/* ==================================================================
   müzik ve süs — dosya yoksa sessizce yok sayılır
   ================================================================== */
var SES = null, SESVAR = false;
function muzikKur(){
  var a = new Audio();
  a.loop = true; a.volume = 0.18; a.preload = "auto";
  a.addEventListener("canplaythrough", function(){
    SESVAR = true; SES = a;
    var b = $("btnMuzik");
    b.disabled = false;
    b.textContent = D.muzik ? "Müzik ✓" : "Müzik";
    if(D.muzik) muzikOynat();
  });
  a.addEventListener("error", function(){ SESVAR = false; SES = null; });
  a.src = "muzik.mp3";
}
function muzikOynat(){
  if(!SES || !SESVAR) return;
  var s = SES.play();
  if(s && s.catch) s.catch(function(){});
}
function muzikDur(){ if(SES){ try{ SES.pause(); }catch(e){} } }
function muzikDurum(oyunOdasi){
  if(!SESVAR) return;
  if(oyunOdasi && D.muzik) muzikOynat(); else muzikDur();
}

var SUSVAR = false, SUSYOL = "sus.png";
function susKur(){
  var g = new Image();
  g.onload = function(){ SUSVAR = true; };
  g.onerror = function(){ SUSVAR = false; };
  g.src = SUSYOL;
}

var EKRANLAR = ["ekKapak","ekOyun","ekOyunSonu","ekSinav","ekSonuc",
                "ekKurallar","ekEmin","ekUcKayip","ekBitis"];

  EKRANLAR.forEach(function(e){ $(e).classList.toggle("acik", e===id); });
  AKTIF = id;
  muzikDurum(id === "ekOyun");
  $("btnBastan").style.display = (id === "ekOyun" || id === "ekOyunSonu") ? "" : "none";

  $("btnMuzik").style.display = (id === "ekSinav") ? "none" : "";
  window.scrollTo(0,0);
}

    +  'Başka bilgisayarda sıfırdan başlar. Kayıt modül sınırında alınır: modülün ortasında '
    +  'çıkarsan o modül baştan başlar.</p>';
  h += '</div>';
  $("ekKapak").innerHTML = h;
  $("btnDevam").onclick = ilerle;
  ustDurum("");
  goster("ekKapak");
}

function ilerle(){
  var s = siradaki();
  if(s.tip==="modul" || s.tip==="finalDonus") oyunBaslat(s.modul, s.tip==="finalDonus" ? "finalDonus" : "modul");
  else if(s.tip==="kural") kurallarCiz(true);
  else if(s.tip==="isinma") oyunBaslat(0, "isinma");
  else if(s.tip==="final") sinavBaslat("final", 0);
  else bitisCiz();
}

/* ==================================================================
   OYUN ODASI
   ================================================================== */
var O = null;   // oyun oturumu (kaydedilmez)

function oyunBaslat(modul, tip){
  var kupeler, tur;
  if(tip === "isinma"){
    kupeler = V.kupeler.slice();
    tur = 1;
  } else {
    kupeler = MODULKUPE[modul].slice();
    tur = (D.kayip[modul] || 0) + 1;
  }
  O = {
    tip: tip, modul: modul, tur: tur,
    kupeler: kupeler,
    adim: {}, kupeSorulan: {}, yanlisKupe: {}, hicYanlis: {},
    sonKupeler: [], kuyruk: [], sayac: 0,
    gorulenBuTur: [], aktifKupe: null, soru: null, cevap: null,
    kilit: false, sayacId: null, kalan: 0, toplam: 0,
    isinmaButce: 900, isinmaHarcanan: 0, dusen: {},
    kota: {}, isinmaYedek: false
  };
  kupeler.forEach(function(k){
    O.adim[k.id] = (tip === "isinma") ? 3 : 0;
    O.kupeSorulan[k.id] = {};
    O.hicYanlis[k.id] = true;
    // ısınma ağırlığı: ilk seferde oturan konu bir kez, zorlanılan konu daha sık
    O.kota[k.id] = 1 + Math.min(3, D.zor[k.id] || 0);
  });
  ustDurum(tip === "isinma" ? "Isınma" : ("Modül " + modul + " oyunu"));
  odaCiz();
  sonrakiSoru();
}

function uygunKupe(id){
  var son = O.sonKupeler.slice(-4);
  return son.indexOf(id) < 0;
}

function havuzKupe(kupeId){
  if(O.tip === "isinma"){
    var hepsi = (OYUNH[KUPE[kupeId].modul] || []).filter(function(q){ return q.kupe === kupeId; });
    var yeni = hepsi.filter(function(q){ return D.gorulen.indexOf(q.id) < 0; });
    if(yeni.length) return yeni;
    return O.isinmaYedek ? hepsi : [];
  }
  return OYUNH[O.modul].filter(function(q){ return q.kupe === kupeId; });
}
function isinmaAday(){
  return O.kupeler.filter(function(k){
    return O.kota[k.id] > 0 && havuzKupe(k.id).length;
  });
}

function soruSec(kupeId, kacin){
  var havuz = havuzKupe(kupeId);
  if(!havuz.length) return null;
  var kalan = havuz.filter(function(q){ return !O.kupeSorulan[kupeId][q.id]; });
  if(!kalan.length){                       // havuz tükendi, yeniden dolaşıma girer
    O.kupeSorulan[kupeId] = {};
    kalan = havuz.slice();
  }
  var secim = kalan;
  if(kacin){
    var baska = kalan.filter(function(q){ return q.senaryo !== kacin.senaryo; });
    if(baska.length) secim = baska;
  }
  // ikinci turdan sonra havuz alternatif senaryolara kayar
  if(O.tur > 1){
    secim = secim.slice().sort(function(a,b){
      var pa = a.senaryo === "A" ? 1 : 0, pb = b.senaryo === "A" ? 1 : 0;
      return pa - pb;
    });
    return secim[0];
  }
  return karistir(secim)[0];
}

function sonrakiSoru(){
  var eksik = O.kupeler.filter(function(k){ return O.adim[k.id] < 3; });

  if(O.tip === "isinma"){
    if(O.isinmaHarcanan >= O.isinmaButce) return oyunBitir();
    if(!isinmaAday().length){
      if(!O.isinmaYedek){ O.isinmaYedek = true; }   // görülmemiş kalmadı, havuz açılır
      if(!isinmaAday().length) return oyunBitir();
    }
  } else {
    if(!eksik.length && !O.kuyruk.length) return oyunBitir();
  }

  var hedef = null, kacin = null;

  // 1) yanlış bilinen sorunun dönüş sırası
  for(var i=0;i<O.kuyruk.length;i++){
    var g = O.kuyruk[i];
    var sonMu = (O.tip !== "isinma") && !eksik.length;    // oturum bitmek üzere
    if((O.sayac >= g.zaman || sonMu) && (uygunKupe(g.kupe) || sonMu)){
      hedef = g.kupe; kacin = SORU[g.soru]; O.kuyruk.splice(i,1); break;
    }
  }

  // 2) normal seçim
  if(!hedef){
    var aday = eksik.filter(function(k){ return uygunKupe(k.id); });
    if(O.tip === "isinma"){
      aday = isinmaAday().filter(function(k){ return uygunKupe(k.id); });
      if(!aday.length) aday = isinmaAday();
      aday.sort(function(a,b){
        var za = (D.zor[a.id]||0), zb = (D.zor[b.id]||0);
        return O.adim[a.id] - O.adim[b.id] || zb - za || (Math.random()-0.5);
      });
    } else if(!aday.length){
      // hiçbir eksik küpe aralık kuralına uymuyor: yeşil bir küpe araya girer
      var yesil = O.kupeler.filter(function(k){
        return O.adim[k.id] === 3 && uygunKupe(k.id) && havuzKupe(k.id).length;
      });
      if(yesil.length) aday = [karistir(yesil)[0]];
      else {
        for(var n=3;n>=0 && !aday.length;n--){
          var son = O.sonKupeler.slice(-n);
          aday = eksik.filter(function(k){ return son.indexOf(k.id) < 0; });
        }
      }
    } else {
      aday.sort(function(a,b){
        var za = (O.yanlisKupe[a.id]||0), zb = (O.yanlisKupe[b.id]||0);
        return O.adim[a.id] - O.adim[b.id] || zb - za || (Math.random()-0.5);
      });
    }
    if(!aday.length) return oyunBitir();
    hedef = aday[0].id;
  }

  var q = soruSec(hedef, kacin);
  if(!q){
    O.sonKupeler.push(hedef);
    return sonrakiSoru();
  }
  O.kupeSorulan[hedef][q.id] = 1;
  O.sonKupeler.push(hedef);
  O.aktifKupe = hedef;
  O.soru = q;
  O.cevap = coz(q.c);
  O.kilit = false;
  O.sayac++;
  O.isinmaHarcanan += q.sure;
  if(O.tip === "isinma") O.kota[hedef] = Math.max(0, (O.kota[hedef]||0) - 1);
  if(D.gorulen.indexOf(q.id) < 0) D.gorulen.push(q.id);
  soruCiz();
}

function odaCiz(){
  var h = "";
  h += '<div class="kupe-serit ' + (O.tip==="isinma" ? "yogun" : "") + '" id="serit"></div>';
  h += '<div class="oyun-govde">';
  h += '  <div><div class="sus" id="susAlan"></div></div>';
  h += '  <div>';
  h += '    <div class="sayac-yol"><div class="sayac-bar" id="sayacBar"></div></div>';
  h += '    <div class="soru" id="soruMetin"></div>';
  h += '    <div class="siklar" id="siklar"></div>';
  h += '    <div class="ipucu">1–4 ya da A–D tuşlarıyla seçebilirsin. Enter devam eder.</div>';
  h += '  </div>';
  h += '  <div id="panelYuva"><div class="panel bos"><span>Bir şık seç. Açıklama burada çıkacak.</span></div></div>';
  h += '</div>';
  $("ekOyun").innerHTML = h;
  if(SUSVAR){
    $("susAlan").classList.add("var");
    $("susAlan").style.backgroundImage = "url('" + SUSYOL + "')";
  }

}

function seritCiz(){
  var h = "";
  O.kupeler.forEach(function(k){
    var a = O.adim[k.id];
    h += '<div class="kupe ' + (a>=3?"tam":"") + ' ' + (k.id===O.aktifKupe?"aktif":"") + '" title="' + ky(k.uzunAd) + '">'
      +  '<div class="kutu">'
      +  '<div class="dilim ' + (a>=1?"dolu":"") + '"></div>'
      +  '<div class="dilim ' + (a>=2?"dolu":"") + '"></div>'
      +  '<div class="dilim ' + (a>=3?"dolu":"") + '"></div>'
      +  '</div><div class="ad">' + ky(k.ad) + '</div></div>';
  });
  $("serit").innerHTML = h;
}

function soruCiz(){
  seritCiz();
  var q = O.soru;
  $("soruMetin").textContent = q.metin;
  var h = "";
  q.siklar.forEach(function(s, i){
    h += '<button class="sik" data-h="' + s.h + '" data-i="' + i + '">'
      +  '<span class="harf">' + s.h + '</span><span>' + ky(s.m) + '</span></button>';
  });
  $("siklar").innerHTML = h;
  Array.prototype.forEach.call($("siklar").children, function(b){
    b.onclick = function(){ cevapla(b.getAttribute("data-h")); };
  });
  $("panelYuva").innerHTML = '<div class="panel bos"><span>Bir şık seç. Açıklama burada çıkacak.</span></div>';
  sayacBaslat(q.sure);
}

function sayacBaslat(sn){
  sayacDur();
  O.toplam = sn * 1000;
  O.kalan = O.toplam;
  var bar = $("sayacBar");
  bar.classList.remove("acele");
  bar.style.width = "100%";
  var bas = Date.now();
  O.sayacId = setInterval(function(){
    O.kalan = O.toplam - (Date.now() - bas);
    if(O.kalan <= 0){
      sayacDur();
      bar.style.width = "0%";
      cevapla(null);
      return;
    }
    bar.style.width = (100 * O.kalan / O.toplam) + "%";
    if(O.kalan <= 5000) bar.classList.add("acele");
  }, 90);
}
function sayacDur(){ if(O.sayacId){ clearInterval(O.sayacId); O.sayacId = null; } }

function cevapla(harf){
  if(O.kilit) return;
  O.kilit = true;
  sayacDur();
  var q = O.soru, c = O.cevap, kupeId = q.kupe;
  var dogruMu = (harf === c.d);
  var sureBitti = (harf === null);

  var delta = dogruMu ? 1 : (sureBitti ? -1 : -2);
  O.adim[kupeId] = Math.max(0, Math.min(3, O.adim[kupeId] + delta));
  if(!dogruMu){
    O.hicYanlis[kupeId] = false;
    O.yanlisKupe[kupeId] = (O.yanlisKupe[kupeId]||0) + 1;
    D.zor[kupeId] = (D.zor[kupeId]||0) + 1;
    if(O.tip === "isinma"){ O.dusen[kupeId] = 1; O.kota[kupeId] = (O.kota[kupeId]||0) + 1; }
    O.kuyruk.push({kupe:kupeId, soru:q.id, zaman: O.sayac + 12 + Math.floor(Math.random()*4)});
  }

  Array.prototype.forEach.call($("siklar").children, function(b){
    var bh = b.getAttribute("data-h");
    b.disabled = true;
    if(bh === c.d) b.classList.add("dogru");
    if(harf && bh === harf) b.classList.add("secili");
  });
  seritCiz();

  var h = '<div class="panel">';
  if(sureBitti){
    h += '<div class="neden"><div class="etiket">Süre doldu</div>'
      +  'Cevap veremedin. Küpe bir adım düştü — yanlış cevaptan az.</div>';
  } else if(!dogruMu){
    h += '<div class="neden"><div class="etiket">Neden olmadı</div>' + ky(c.n[harf] || "") + '</div>';
  }
  h += '<div class="etiket">' + (dogruMu ? "Doğru" : "Doğrusu " + c.d) + '</div>';
  h += '<h4>' + ky(kupeAd(kupeId)) + '</h4>';
  h += '<p>' + ky(c.a) + '</p>';
  var yt = ytBaglanti(q.video, q.sn);
  h += '<div class="kaynak">Video ' + q.video + ', ' + ky(q.damga)
    +  (yt ? ' <a class="dk" href="' + yt + '" target="_blank" rel="noopener">videoyu aç</a>' : '')
    +  '</div>';
  h += '<div class="devam"><button class="dugme kucuk" id="btnIleri">Devam</button></div>';
  h += '</div>';
  $("panelYuva").innerHTML = h;
  $("btnIleri").onclick = function(){ sonrakiSoru(); };
  $("btnIleri").focus();
}

function oyunBitir(){
  sayacDur();
  if(O.tip === "isinma"){
    D.isinmaBitti = true;
    kaydet();
    isinmaSonuCiz();
    return;
  }
  if(O.tip === "finalDonus"){
    D.finalDonus = D.finalDonus.filter(function(m){ return m !== O.modul; });
    kaydet();
    oyunSonuCiz(true);
    return;
  }
  oyunSonuCiz(false);
}

function oyunSonuCiz(finalDonusMu){
  var oturan = O.kupeler.filter(function(k){ return !O.hicYanlis[k.id] && O.adim[k.id] === 3; });
  var h = '<div class="orta">';
  h += '<h2>Modül ' + O.modul + ' oyunu bitti</h2>';
  h += '<p class="alt">Bütün küpeler doldu. ' +
       (finalDonusMu ? 'Şimdi doğrudan finale dönüyorsun.' : 'Teste hazırsın.') + '</p>';
  if(oturan.length){
    h += '<div class="bolum-baslik">Birkaç denemede oturan konular</div>';
    h += '<div class="liste">';
    oturan.forEach(function(k){
      h += konuSat(k.id);
    });
    h += '</div>';
  }
  h += '<button class="dugme" id="btnTest">' + (finalDonusMu ? "Devam" : "Teste geç") + '</button>';
  h += '</div>';
  $("ekOyunSonu").innerHTML = h;
  $("btnTest").onclick = function(){
    if(finalDonusMu) kapakCiz();
    else sinavBaslat("test", O.modul);
  };
  goster("ekOyunSonu");
}

function isinmaSonuCiz(){
  var dusenler = Object.keys(O.dusen);
  var h = '<div class="orta">';
  h += '<h2>Isınma bitti</h2>';
  if(dusenler.length){
    h += '<p class="alt">Finalden önce şu konulara bir daha bak.</p>';
    h += '<div class="liste">';
    dusenler.forEach(function(id){
      h += konuSat(id);
    });
    h += '</div>';
  } else {
    h += '<p class="alt">Isınmada hiç takılmadın. Finale geçebilirsin.</p>';
  }
  h += '<button class="dugme" id="btnFinale">Finale gir</button> '
    +  '<button class="dugme ikincil" id="btnKuralaDon">Önce kurallara bak</button>';
  h += '</div>';
  $("ekOyunSonu").innerHTML = h;
  $("btnFinale").onclick = function(){ sinavBaslat("final", 0); };
  $("btnKuralaDon").onclick = function(){ kurallarCiz(false); };
  goster("ekOyunSonu");
}

/* ==================================================================
   SINAV ODASI — modül testi ve final
   ================================================================== */
var S = null;

function sinavSuresi(liste){
  var t = 0;
  liste.forEach(function(q){ t += 60 + (q.kar > 400 ? 15 : 0); });
  return t;
}

function sinavBaslat(tip, modul){
  var liste;
  if(tip === "test"){
    liste = karistir(SINAVH[modul]).slice(0, 10);
  } else {
    var havuz = [];
    for(var m=1;m<=5;m++) havuz = havuz.concat(SINAVH[m]);
    havuz = havuz.concat(FINALH);
    // önceki denemede kaçırılanlar her seferinde tekrar içeri alınır
    var zorunlu = D.finalKacirilan
      .map(function(id){ return SORU[id]; })
      .filter(Boolean)
      .slice(0, 30);
    var kalan = karistir(havuz.filter(function(q){
      return zorunlu.indexOf(q) < 0;
    }));
    liste = karistir(zorunlu.concat(kalan).slice(0, 30));
  }
  S = {
    tip: tip, modul: modul, liste: liste, i: 0,
    cevaplar: {}, secili: null, kalan: sinavSuresi(liste), sayacId: null
  };
  ustDurum(tip === "test" ? ("Modül " + modul + " testi") : "Final");
  sinavCiz();
  sinavSayac();
}

function sinavCiz(){
  var q = S.liste[S.i];
  var h = '<div class="sinav">';
  h += '  <div class="sinav-ust">';
  h += '    <div class="baslik">' + (S.tip==="test" ? "Modül " + S.modul + " testi" : "Final sınavı") + '</div>';
  h += '    <div class="sayac" id="sinavSayac">' + dk(S.kalan) + '</div>';
  h += '  </div>';
  h += '  <div class="ilerleme">Soru ' + (S.i+1) + ' / ' + S.liste.length + '</div>';
  h += '  <div class="soru" id="sinavSoru"></div>';
  h += '  <div class="siklar" id="sinavSiklar"></div>';
  h += '  <div class="sinav-alt">';
  h += '    <button class="dugme" id="btnSinavIleri">' + (S.i === S.liste.length-1 ? "Bitir" : "Sonraki") + '</button>';
  h += '    <span class="ipucu" style="margin:0">Şık seç, sonra Enter.</span>';
  h += '  </div>';
  h += '</div>';
  $("ekSinav").innerHTML = h;
  $("sinavSoru").textContent = q.metin;
  var g = "";
  q.siklar.forEach(function(s){
    g += '<button class="sik" data-h="' + s.h + '"><span class="harf">' + s.h + '</span><span>' + ky(s.m) + '</span></button>';
  });
  $("sinavSiklar").innerHTML = g;
  Array.prototype.forEach.call($("sinavSiklar").children, function(b){
    b.onclick = function(){ sinavSec(b.getAttribute("data-h")); };
  });
  S.secili = S.cevaplar[q.id] || null;
  if(S.secili) sinavIsaretle();
  $("btnSinavIleri").onclick = sinavIleri;
  goster("ekSinav");
}

function sinavIsaretle(){
  Array.prototype.forEach.call($("sinavSiklar").children, function(b){
    b.classList.toggle("secili", b.getAttribute("data-h") === S.secili);
  });
}
function sinavSec(h){
  S.secili = h;
  S.cevaplar[S.liste[S.i].id] = h;
  sinavIsaretle();
}
function sinavIleri(){
  if(S.i === S.liste.length - 1) return sinavBitir(false);
  S.i++;
  sinavCiz();
}
function sinavSayac(){
  if(S.sayacId) clearInterval(S.sayacId);
  var bas = Date.now(), basKalan = S.kalan;
  S.sayacId = setInterval(function(){
    S.kalan = basKalan - Math.floor((Date.now() - bas)/1000);
    var e = $("sinavSayac");
    if(e){
      e.textContent = dk(Math.max(0, S.kalan));
      e.classList.toggle("acele", S.kalan <= 60);
    }
    if(S.kalan <= 0){ clearInterval(S.sayacId); S.sayacId = null; sinavBitir(true); }
  }, 500);
}

function sinavBitir(sureBitti){
  if(S.sayacId){ clearInterval(S.sayacId); S.sayacId = null; }
  var dogru = 0, kacirilanKupe = [], kacirilanSoru = [];
  S.liste.forEach(function(q){
    var c = coz(q.c);
    if(S.cevaplar[q.id] === c.d) dogru++;
    else { kacirilanKupe.push(q.kupe); kacirilanSoru.push(q.id); }
  });
  kacirilanKupe = benzersiz(kacirilanKupe);
  var gecti = S.tip === "test" ? (dogru >= 7) : (dogru >= 25);
  sonucCiz(dogru, gecti, kacirilanKupe, kacirilanSoru, sureBitti);
}

/* ==================================================================
   SONUÇ + kademeli öğretim
   ================================================================== */
function kuralBloku(kupeler){
  var h = '<div class="kutucuk"><h4>Kaçırdığın konuların kuralları</h4>';
  kupeler.forEach(function(id){
    var ks = KUPEKURAL[id] || [];
    h += '<div style="margin-bottom:12px"><div class="bolum-baslik" style="margin-bottom:4px">'
      +  ky(KUPE[id].uzunAd) + '</div>';
    ks.forEach(function(k){
      var yt = ytBaglanti(k.video, k.sn);
      h += '<div class="kural-sat"><span class="metin">' + ky(k.satir) + '</span>'
        +  (yt ? '<a class="dk" href="' + yt + '" target="_blank" rel="noopener">V' + k.video + ' ' + ky(k.damga) + '</a>' : '')
        +  '</div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function dersBloku(kupeler){
  var h = '<div class="kutucuk"><h4>Derslerin tam metni</h4>';
  kupeler.forEach(function(id){
    (KUPEDERS[id] || []).forEach(function(d){
      var yt = ytBaglanti(d.video, d.sn);
      h += '<details class="katla"><summary>Ders ' + d.ders + ' — ' + ky(d.baslik) + '</summary>';
      h += '<div class="ders-metin">' + mdCevir(d.metin) + '</div>';
      if(yt) h += '<a class="dk" href="' + yt + '" target="_blank" rel="noopener">Video ' + d.video + ', ' + ky(d.damga) + '</a>';
      h += '</details>';
    });
  });
  h += '</div>';
  return h;
}

function sonucCiz(dogru, gecti, kacirilanKupe, kacirilanSoru, sureBitti){
  var h = '<div class="orta">';
  var toplam = S.liste.length;
  h += '<div class="puan">' + dogru + ' <small>/ ' + toplam + '</small></div>';
  h += '<div class="durum ' + (gecti?"gecti":"kaldi") + '">'
    +  (gecti ? "Geçtin." : "Geçemedin.")
    +  (sureBitti ? " Süre doldu; cevaplanmayan sorular yanlış sayıldı." : "")
    +  ' Geçme notu ' + (S.tip==="test" ? "7" : "25") + '.</div>';

  if(!gecti && kacirilanKupe.length){
    h += '<div class="bolum-baslik">Kaçırdığın konular</div>';
    h += '<div class="liste">';
    kacirilanKupe.forEach(function(id){
      h += konuSat(id);
    });
    h += '</div>';
    h += '<p class="ipucu" style="margin-bottom:22px">Hangi soruları kaçırdığın yazmıyor. '
      +  'Yazsaydı tekrar denemek ezber oyununa dönerdi.</p>';
  }

  if(S.tip === "test"){
    if(gecti){
      if(D.tamam.indexOf(S.modul) < 0) D.tamam.push(S.modul);
      D.tamam.sort();
      kaydet();
      h += '<button class="dugme" id="btnSonrakiAdim">Devam</button>';
    } else {
      D.kayip[S.modul] = (D.kayip[S.modul] || 0) + 1;
      var kademe = Math.min(3, D.kayip[S.modul]);
      if(kademe >= 3){
        kacirilanKupe.forEach(function(id){ if(D.emin.indexOf(id) < 0) D.emin.push(id); });
      }
      kaydet();
      if(kademe >= 1) h += kuralBloku(kacirilanKupe);
      if(kademe >= 2) h += dersBloku(kacirilanKupe);
      if(kademe >= 3){
        h += '<div class="kutucuk uyari"><h4>Emin\'e sorulacaklar listesine eklendi</h4>'
          +  '<p style="margin:0">Bu konular üçüncü kez kaçtı. Listeye yazıldı; '
          +  'üstteki menüden her an açabilirsin.</p></div>';
      }
      h += '<p class="alt">Modül oyunu baştan oynanacak. Küpeler sıfırlanır, '
        +  'geçtiğin modüller yerinde kalır. Her tur biraz daha zorlaşır.</p>';
      h += '<button class="dugme" id="btnSonrakiAdim">Modülü baştan oyna</button>';
    }
  } else {
    D.finalKacirilan = kacirilanSoru;
    if(gecti){
      D.bitti = true;
      kaydet();
      h += '<button class="dugme" id="btnSonrakiAdim">Bitir</button>';
    } else {
      D.finalKayip = (D.finalKayip || 0) + 1;
      kacirilanKupe.forEach(function(id){
        if(D.ucKayipKupe.indexOf(id) < 0) D.ucKayipKupe.push(id);
      });
      var moduller = benzersiz(kacirilanKupe.map(function(id){ return KUPE[id].modul; })).sort();
      D.finalDonus = moduller;
      if(D.finalKayip >= 3){
        kacirilanKupe.forEach(function(id){ if(D.emin.indexOf(id) < 0) D.emin.push(id); });
      }
      kaydet();
      if(D.finalKayip >= 3){
        kaydet();
        ucKayipCiz();
        return;
      }
      h += kuralBloku(kacirilanKupe);
      if(D.finalKayip >= 2) h += dersBloku(kacirilanKupe);
      h += '<p class="alt">Bütün kursa değil, sadece kaçırdığın konuların geldiği '
        +  'modüllere dönüyorsun: '
        +  moduller.map(function(m){ return "Modül " + m; }).join(", ")
        +  '. Sonra doğrudan finale.</p>';
      h += '<button class="dugme" id="btnSonrakiAdim">Devam</button>';
    }
  }

  h += '</div>';
  $("ekSonuc").innerHTML = h;
  var b = $("btnSonrakiAdim");
  if(b) b.onclick = function(){
    if(S.tip === "test" && !gecti) oyunBaslat(S.modul, "modul");
    else if(S.tip === "final" && gecti) bitisCiz();
    else kapakCiz();
  };
  ustDurum("");
  goster("ekSonuc");
}

/* ==================================================================
   ÜÇ KAYIP SAYFASI — aynı zamanda Emin listesinin tamamı
   ================================================================== */
function ucKayipCiz(){
  var kupeler = D.ucKayipKupe.slice().sort(function(a,b){
    return KUPE[a].modul - KUPE[b].modul || KUPE[a].sira - KUPE[b].sira;
  });
  var h = '<div class="kurallar-sayfa">';
  h += '<h2 style="font-size:30px;margin-bottom:10px">Üç denemede kaçan konular</h2>';
  h += '<p class="alt" style="margin-bottom:26px">Aşağıdaki konular üç finalin '
    +  'hepsinde ya da bir kısmında kaçtı. Her birinin kural satırı ve dersin tam metni burada.</p>';
  var sonModul = null;
  kupeler.forEach(function(id){
    var k = KUPE[id];
    if(k.modul !== sonModul){
      if(sonModul !== null) h += '</div>';
      h += '<div class="kural-modul"><h3>Modül ' + k.modul + ' — ' + ky(modulAd(k.modul)) + '</h3>';
      sonModul = k.modul;
    }
    h += '<div class="kural-kupe"><h4>' + ky(k.uzunAd) + '</h4>';
    (KUPEKURAL[id] || []).forEach(function(r){
      var yt = ytBaglanti(r.video, r.sn);
      h += '<div class="kural-sat"><span class="metin">' + ky(r.satir) + '</span>'
        +  (yt ? '<a class="dk" href="' + yt + '" target="_blank" rel="noopener">V' + r.video + ' ' + ky(r.damga) + '</a>' : '')
        +  '</div>';
    });
    (KUPEDERS[id] || []).forEach(function(d){
      h += '<details class="katla"><summary>Ders ' + d.ders + ' — ' + ky(d.baslik) + '</summary>'
        +  '<div class="ders-metin">' + mdCevir(d.metin) + '</div></details>';
    });
    h += '</div>';
  });
  if(sonModul !== null) h += '</div>';
  h += '<div class="kutucuk uyari" style="margin-top:10px"><p style="margin:0">'
    +  'Burası Emin\'le oturup konuşma noktası. Kilit yok; final yine denenebilir.</p></div>';
  h += '<button class="dugme" id="btnUcDevam">Finale dön</button> '
    +  '<button class="dugme ikincil" id="btnUcModul">Önce modüllere dön</button>';
  h += '</div>';
  $("ekUcKayip").innerHTML = h;
  $("btnUcDevam").onclick = function(){ D.finalDonus = []; kaydet(); sinavBaslat("final", 0); };
  $("btnUcModul").onclick = function(){ kapakCiz(); };
  ustDurum("");
  goster("ekUcKayip");
}

/* ==================================================================
   KURAL SAYFASI
   ================================================================== */
function kurallarCiz(akista){
  var h = '<div class="kurallar-sayfa">';
  h += '<h2 style="font-size:30px;margin-bottom:8px">Kural sayfası</h2>';
  h += '<p class="alt" style="margin-bottom:8px">Kursun bütün kuralları tek sayfada, '
    +  'kural başına tek satır. Ders değil, referans. Yazdırıp saklayabilirsin.</p>';
  h += '<p class="yazdirma-gizle" style="margin-bottom:26px">'
    +  '<button class="dugme ikincil kucuk" id="btnYazdir">Yazdır</button></p>';
  for(var m=1;m<=5;m++){
    var kupeler = MODULKUPE[m];
    h += '<div class="kural-modul"><h3>Modül ' + m + ' — ' + ky(modulAd(m)) + '</h3>';
    h += '<div class="mad">' + kupeler.length + ' küpe</div>';
    kupeler.forEach(function(k){
      var ks = KUPEKURAL[k.id] || [];
      if(!ks.length) return;
      h += '<div class="kural-kupe"><h4>' + ky(k.uzunAd) + '</h4><ul>';
      ks.forEach(function(r){ h += '<li>' + ky(r.satir) + '</li>'; });
      h += '</ul></div>';
    });
    h += '</div>';
  }
  h += '<div class="yazdirma-gizle">';
  if(akista){
    h += '<button class="dugme" id="btnKuralBitti">Okudum, ısınmaya geç</button>';
  } else {
    h += '<button class="dugme ikincil" id="btnKuralGeri">Geri dön</button>';
  }
  h += '</div></div>';
  $("ekKurallar").innerHTML = h;
  $("btnYazdir").onclick = function(){ window.print(); };
  if(akista){
    $("btnKuralBitti").onclick = function(){
      D.kuralGoruldu = true; kaydet(); oyunBaslat(0, "isinma");
    };
  } else {
    $("btnKuralGeri").onclick = function(){ kapakCiz(); };
  }
  ustDurum("Kural sayfası");
  goster("ekKurallar");
}

/* ==================================================================
   EMİN'E SORULACAKLAR
   ================================================================== */
function eminCiz(){
  var liste = D.emin.slice().sort(function(a,b){
    return KUPE[a].modul - KUPE[b].modul || KUPE[a].sira - KUPE[b].sira;
  });
  var h = '<div class="kurallar-sayfa">';
  h += '<h2 style="font-size:30px;margin-bottom:8px">Emin\'e sorulacaklar</h2>';
  if(!liste.length){
    h += '<p class="alt">Liste boş. Israrla kaçırdığın bir konu olursa buraya kendi kendine yazılır.</p>';
  } else {
    h += '<p class="alt" style="margin-bottom:26px">Israrla kaçırdığın konular. '
      +  'Konu konu duruyor, soru soru değil.</p>';
    var sonModul = null;
    liste.forEach(function(id){
      var k = KUPE[id];
      if(k.modul !== sonModul){
        if(sonModul !== null) h += '</div>';
        h += '<div class="kural-modul"><h3>Modül ' + k.modul + ' — ' + ky(modulAd(k.modul)) + '</h3>';
        sonModul = k.modul;
      }
      h += '<div class="kural-kupe"><h4>' + ky(k.uzunAd) + '</h4><ul>';
      (KUPEKURAL[id] || []).forEach(function(r){ h += '<li>' + ky(r.satir) + '</li>'; });
      h += '</ul></div>';
    });
    if(sonModul !== null) h += '</div>';
  }
  h += '<button class="dugme ikincil" id="btnEminGeri">Geri dön</button></div>';
  $("ekEmin").innerHTML = h;
  $("btnEminGeri").onclick = function(){ kapakCiz(); };
  ustDurum("Emin'e sorulacaklar");
  goster("ekEmin");
}

/* ==================================================================
   BİTİŞ
   ================================================================== */
function bitisCiz(){
  var h = '<div class="orta" style="padding-top:60px">';
  h += '<h2 style="font-size:36px">Temiz bitirdin.</h2>';
  h += '<p class="alt">Beş modül, kural sayfası, ısınma ve final. Hepsi geçti.</p>';
  h += '<p class="alt">Buradan sonrası Emin\'le birebir. Kural sayfası üstteki menüde '
    +  'duruyor; istediğin zaman açıp yazdırabilirsin.</p>';
  h += '<button class="dugme ikincil" id="btnBitisKural">Kural sayfası</button>';
  h += '</div>';
  $("ekBitis").innerHTML = h;
  $("btnBitisKural").onclick = function(){ kurallarCiz(false); };
  ustDurum("");
  goster("ekBitis");
}

/* ==================================================================
   markdown -> html (ders metinleri için sınırlı çevirici)
   ================================================================== */
function satirIci(s){
  s = ky(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+)`/g, "<em>$1</em>");
  return s;
}
function mdCevir(md){
  var satirlar = String(md).split("\n"), c = [], i = 0;
  function tabloMu(a,b){ return a && b && a.indexOf("|")===0 && /^\|[\s:|-]+\|$/.test(b.trim()); }
  while(i < satirlar.length){
    var s = satirlar[i];
    if(!s.trim()){ i++; continue; }
    if(/^#{1,6}\s/.test(s)){
      c.push("<h5>" + satirIci(s.replace(/^#{1,6}\s/,"")) + "</h5>"); i++; continue;
    }
    if(tabloMu(s.trim(), satirlar[i+1])){
      var basliklar = s.trim().split("|").slice(1,-1);
      var t = "<table><thead><tr>";
      basliklar.forEach(function(x){ t += "<th>" + satirIci(x.trim()) + "</th>"; });
      t += "</tr></thead><tbody>";
      i += 2;
      while(i < satirlar.length && satirlar[i].trim().indexOf("|") === 0){
        var h2 = satirlar[i].trim().split("|").slice(1,-1);
        t += "<tr>";
        h2.forEach(function(x){ t += "<td>" + satirIci(x.trim()) + "</td>"; });
        t += "</tr>"; i++;
      }
      c.push(t + "</tbody></table>"); continue;
    }
    if(/^\s*[-*]\s+/.test(s)){
      var u = "<ul>";
      while(i < satirlar.length && /^\s*[-*]\s+/.test(satirlar[i])){
        u += "<li>" + satirIci(satirlar[i].replace(/^\s*[-*]\s+/,"")) + "</li>"; i++;
      }
      c.push(u + "</ul>"); continue;
    }
    if(/^\s*\d+\.\s+/.test(s)){
      var o = "<ol>";
      while(i < satirlar.length && /^\s*\d+\.\s+/.test(satirlar[i])){
        o += "<li>" + satirIci(satirlar[i].replace(/^\s*\d+\.\s+/,"")) + "</li>"; i++;
      }
      c.push(o + "</ol>"); continue;
    }
    var p = [];
    while(i < satirlar.length && satirlar[i].trim() && !/^#{1,6}\s/.test(satirlar[i])
          && !/^\s*[-*]\s+/.test(satirlar[i]) && !/^\s*\d+\.\s+/.test(satirlar[i])
          && satirlar[i].trim().indexOf("|") !== 0){
      p.push(satirlar[i].trim()); i++;
    }
    if(p.length) c.push("<p>" + satirIci(p.join(" ")) + "</p>");
  }
  return c.join("");
}

/* ==================================================================
   onay penceresi
   ================================================================== */
function onay(baslik, metin, evetEtiket, sonra){
  var d = document.createElement("div");
  d.className = "perde";
  d.innerHTML = '<div class="kart"><h4>' + ky(baslik) + '</h4><p>' + ky(metin) + '</p>'
    + '<div class="sira"><button class="dugme" id="onEvet">' + ky(evetEtiket) + '</button>'
    + '<button class="dugme ikincil" id="onHayir">Vazgeç</button></div></div>';
  document.body.appendChild(d);
  d.querySelector("#onHayir").onclick = function(){ document.body.removeChild(d); };
  d.querySelector("#onEvet").onclick = function(){ document.body.removeChild(d); sonra(); };
}

   üst menü

$("btnMuzik").onclick = function(){
  if(!SESVAR) return;
  D.muzik = !D.muzik;

  $("btnMuzik").textContent = D.muzik ? "Müzik ✓" : "Müzik";
  muzikDurum(AKTIF === "ekOyun");
};
$("btnKurallar").onclick = function(){ if(S && S.sayacId) return; kurallarCiz(false); };
$("btnEmin").onclick = function(){ if(S && S.sayacId) return; eminCiz(); };
$("btnBastan").onclick = function(){
  if(!O) return;
  onay("Bu modülü baştan başlat",
       "Sadece içinde bulunduğun modülün oyunu baştan başlar. Bu modülün küpeleri sıfırlanır; "
     + "geçtiğin modüller ve final durumu olduğu gibi kalır.",
       "Baştan başlat",

};
$("btnSifirla").onclick = function(){
  onay("Her şeyi sıfırla",
       "Bütün ilerleme silinir: geçilmiş modüller, kayıp sayıları, Emin listesi. Geri alınamaz.",
       "Devam",
       function(){
         onay("Emin misin?",
              "Bu bilgisayardaki kayıt tamamen silinecek ve kurs kapaktan başlayacak.",
              "Evet, sıfırla",
              function(){
                if(S && S.sayacId){ clearInterval(S.sayacId); S.sayacId = null; }
                sayacDur();
                sifirla(); O = null; S = null;
                $("btnMuzik").textContent = "Müzik";
                kapakCiz();
              });
       });
};

/* ==================================================================
   klavye
   ================================================================== */
document.addEventListener("keydown", function(e){
  if(document.querySelector(".perde")) return;
  var harfler = {"1":"A","2":"B","3":"C","4":"D","a":"A","b":"B","c":"C","d":"D"};
  var t = (e.key || "").toLowerCase();

  if(AKTIF === "ekOyun" && O){
    if(!O.kilit && harfler[t]){ e.preventDefault(); cevapla(harfler[t]); return; }
    if(O.kilit && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); sonrakiSoru(); return; }
  }
  if(AKTIF === "ekSinav" && S){
    if(harfler[t]){ e.preventDefault(); sinavSec(harfler[t]); return; }
    if(e.key === "Enter"){ e.preventDefault(); sinavIleri(); return; }
  }
  if(e.key === "Enter"){
    var b = document.querySelector(".ekran.acik .dugme");
    if(b){ e.preventDefault(); b.click(); }
  }
});

yukle();

susKur();
